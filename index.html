   "text": "EL COMIENZO DE UNA LARGA AVENTURA\n\nCAPÍTULO 1: LA CREACIÓN\n\nPrimera vida: Ryu\n\n\nPRÓLOGO — ANTES DE QUE EXISTIERA EL SILENCIO\n\nNo había estrellas que pudieran contemplarse.\n\nNo había oscuridad, porque la oscuridad necesitaba de la luz para tener sentido. No había un vacío, porque incluso el vacío debía ocupar un lugar. No existía un arriba ni un abajo, un antes ni un después. No había distancia que recorrer, ni tiempo que pudiera desgastarse, ni una voz que rompiera la quietud.\n\nNo había nada.\n\nY, aun así, algo existía.\n\nUna presencia imposible de describir con palabras. No tenía rostro, pero podía observar. No tenía cuerpo, pero su voluntad era capaz de abarcar aquello que todavía no había nacido. No necesitaba caminar, porque no había lugar al que ir; no necesitaba hablar, porque no había nadie que pudiera escucharla.\n\nAquella presencia era la Entidad.\n\nNo era Dios. No era Satanás. No era un espíritu, un ángel o una criatura de algún reino. No pertenecía a la creación, porque la creación aún no existía. Se encontraba por encima de todo concepto que, algún día, sus criaturas intentarían comprender.\n\nLa Entidad no se sentó sobre un trono. No levantó una mano. No pronunció una orden que pudiera escucharse.\n\nSimplemente, estableció el principio.\n\nUn ciclo.\n\nUna estructura que permitiría que la existencia tuviera comienzo, desarrollo, final y, llegado el momento, otro comienzo. Un orden que se extendería más allá de cualquier reino y que ningún ser creado sería capaz de contemplar en su totalidad.\n\nDe aquella primera voluntad surgieron dos seres.\n\nUno recibió la autoridad para gobernar el reino angelical. El otro, la autoridad para gobernar el reino infernal.\n\nDios.\n\nSatanás.\n\nLa Entidad les concedió poder, dominio y las facultades necesarias para ejercer sus funciones. No les entregó la totalidad de la existencia, ni los convirtió en dueños del ciclo. Les dio autoridad dentro de él.\n\nDios sería el soberano del reino angelical.\n\nSatanás, quien en otro tiempo había pertenecido a las filas celestiales antes de convertirse en un ángel caído, sería destinado al reino infernal.\n\nAmbos recibieron un dominio.\n\nAmbos recibieron poder.\n\nY ambos, pese a su inmensa autoridad, se encontraron ante una realidad que no podían cambiar: el universo era vasto, pero estaba vacío.\n\nNo había nadie que los desafiara. Nadie que los sorprendiera. Ningún acontecimiento capaz de alterar aquella eternidad inmóvil.\n\nEl tiempo, cuando finalmente existió, comenzó a pasar.\n\nY con él llegó algo que ni siquiera dos seres de semejante naturaleza pudieron evitar sentir.\n\nAburrimiento.\n\n\nI — EL PRIMER REINO\n\nEl Primer Reino era un lugar difícil de imaginar para cualquier criatura mortal. No existían horizontes como los que más tarde conocerían los humanos, ni montañas que dividieran el paisaje, ni océanos que reflejaran el cielo. Era una extensión majestuosa, formada por luz, energía y estructuras que parecían obedecer a una voluntad propia.\n\nEn su centro se alzaba un palacio.\n\nSus pilares se elevaban hasta perderse entre nubes luminosas; sus corredores parecían prolongarse más allá de lo que los ojos podían abarcar. Los pisos, pulidos como espejos, reflejaban una claridad que no provenía de lámparas ni de estrellas. Cada arco, cada escalón y cada puerta parecía haber sido colocado con un propósito preciso.\n\nEl palacio no era solamente una residencia.\n\nEra la representación de la autoridad de Dios.\n\nDesde uno de sus balcones, Ryu contemplaba el reino.\n\nEra un serafín, el de mayor rango entre los suyos, y ocupaba una posición que pocos podían siquiera aspirar a comprender. Su presencia era imponente, pero no necesitaba demostrarlo. Su rango, su poder y su cercanía a Dios bastaban para que los demás lo reconocieran como una de las figuras más importantes del reino angelical.\n\nSe le conocía como el protector más cercano de Dios, su mano izquierda, el guardián que permanecía a su lado cuando el resto de las jerarquías se retiraban.\n\nRyu había sido leal desde que tenía memoria —si es que una criatura como él podía llamar memoria a sus primeros instantes de existencia—. Había cumplido órdenes, protegido el palacio y observado el desarrollo de las jerarquías. Nunca había encontrado una razón para desconfiar de su señor.\n\nSin embargo, aquella mañana, mientras observaba la extensión del reino, algo le inquietaba.\n\nNo era una amenaza.\n\nNo era una señal de peligro.\n\nEra la sensación de que todo permanecía demasiado quieto.\n\nLos jardines celestiales estaban impecables. Las fuentes de energía recorrían sus cauces sin alterarse. Los ángeles transitaban por los corredores cumpliendo sus funciones y, más allá de las fronteras del reino, no había nada que pudiera llamar la atención.\n\nRyu apoyó una mano sobre la baranda del balcón.\n\n—¿Esto será todo? —murmuró, sin esperar respuesta.\n\nEl sonido de sus propias palabras le resultó extraño. No acostumbraba expresar dudas en voz alta. Su deber era actuar, proteger y obedecer. Pensar en el propósito de la existencia no formaba parte de sus responsabilidades.\n\nPero aquella inquietud no desaparecía.\n\nA sus espaldas, las puertas del balcón se abrieron.\n\n—Ryu —llamó una voz familiar—. Mi señor te espera.\n\nEra un asistente celestial.\n\nRyu se apartó de la baranda y acomodó su postura.\n\n—¿Ha ocurrido algo?\n\n—Se ha convocado una reunión. Todas las jerarquías deberán presentarse en el salón principal.\n\nRyu miró una última vez el paisaje.\n\n—Entendido.\n\nY siguió al asistente.\n\n\nII — LA CONVOCATORIA\n\nLa noticia de una reunión general se extendió rápidamente por el palacio. No era habitual que Dios convocara a todas las jerarquías al mismo tiempo. Las órdenes ordinarias se transmitían a través de sus representantes; los asuntos importantes se discutían entre grupos reducidos.\n\nAquella convocatoria era diferente.\n\nEl gran salón comenzó a llenarse mucho antes de que Dios apareciera.\n\nLas puertas eran tan altas que varias criaturas podían atravesarlas volando sin rozar sus bordes. Sobre ellas se encontraban grabados símbolos antiguos, trazados durante los primeros momentos del reino. El suelo formaba un círculo amplio, dividido en secciones que representaban las jerarquías celestiales. En el centro se encontraba una plataforma elevada y, sobre ella, el trono.\n\nRyu llegó primero entre los serafines.\n\nSeraphiel, el segundo al mando, lo esperaba junto a una de las columnas. Su presencia era serena; la luz que lo rodeaba parecía más tenue que la de Ryu, pero se extendía de manera constante, como un amanecer que nunca terminaba.\n\n—Parece que esta vez no somos los únicos convocados —comentó Seraphiel, mirando hacia las puertas.\n\n—Eso parece.\n\nAuriel se acercó poco después. Era responsable de las oraciones y de las vibraciones espirituales del reino. A diferencia de Seraphiel, solía hablar poco, pero cuando lo hacía, sus palabras tenían una calma que invitaba a escuchar.\n\n—¿Tienes alguna idea de lo que se discutirá? —preguntó Auriel.\n\nRyu negó con la cabeza.\n\n—No. Dios no ha mencionado nada.\n\n—Entonces será algo importante.\n\nLos tres ocuparon sus lugares.\n\nLos querubines llegaron a continuación.\n\nGabriel, portador de mensajes y poseedor de un conocimiento extraordinario, caminaba con una expresión pensativa. Elyon, guardián de los secretos celestiales y de la historia del Primer Reino, llevaba consigo una pequeña tablilla de registros. Zadkiel, protector de los inocentes y guerrero contra la injusticia, saludó a los serafines antes de tomar asiento.\n\nLos Tronos también se presentaron.\n\nThroniel, representante de la voluntad divina, observaba con equilibrio y prudencia. Orifiel, encargado de la disciplina y el orden, revisó que todos ocuparan sus lugares. Raguel, promotor de la armonía y la justicia, intercambió algunas palabras con Gabriel.\n\nLas Dominaciones llegaron en grupo: Dominiel, que supervisaba las tareas celestiales; Zephoniel, encargado de regular las leyes del tiempo y el espacio dentro del reino; y Sachiel, protector de la verdad y la rectitud.\n\nDespués aparecieron las Potestades.\n\nPotentiel, responsable de las fuerzas de la naturaleza y del orden del mundo físico; Camael, encargado de la fortaleza y el coraje; y Veriel, vigilante de las estrellas y los cuerpos celestes.\n\nLas Virtudes ocuparon su sección.\n\nVirtuel, encargado de los milagros y las maravillas; Haniel, asociado con la gracia y la influencia positiva; y Jophiel, promotor de la belleza y la comprensión.\n\nLos Principados tampoco faltaron.\n\nPrincipiel, líder de los ángeles protectores de los reinos y naciones; Nisroc, defensor de las fronteras espirituales y físicas; y Mehiel, inspirador de los gobernantes para que actuaran con integridad.\n\nLos arcángeles llegaron poco después.\n\nMichael, comandante de las fuerzas celestiales, avanzaba con la disciplina de quien estaba acostumbrado a dirigir. Raphael, mensajero de la sanación y la restauración, llevaba una expresión amable. Selaphiel, encargado de la oración y la invocación de la luz, permanecía en silencio.\n\nEntre los ángeles también se encontraban Ariel, protector de la naturaleza y los animales; Azrael, compañero de las almas al final de sus vidas; y Cassiel, guía y consuelo durante los períodos de soledad.\n\nTodos fueron tomando sus lugares.\n\nEl murmullo del salón disminuyó gradualmente.\n\nRyu observó a los presentes. No era frecuente ver tantas jerarquías reunidas. Algunos parecían curiosos; otros, desconcertados. Gabriel mantenía los ojos en el trono vacío. Zadkiel conversaba brevemente con Raguel. Michael, con los brazos cruzados, esperaba en silencio.\n\nFinalmente, las puertas del salón se cerraron.\n\nLa luz cambió.\n\nNo se apagó, pero pareció concentrarse en la plataforma central. Las conversaciones cesaron al mismo tiempo, como si una orden invisible hubiera recorrido cada rincón.\n\nDios apareció.\n\nNo necesitó anunciarse.\n\nSu presencia bastó para que todos inclinaran la cabeza.\n\nRyu fue el último en levantar la mirada, y lo hizo con la confianza de alguien que había permanecido a su lado durante incontables momentos.\n\nDios ocupó el trono.\n\n—He convocado esta reunión —comenzó— porque creo que ha llegado el momento de decidir qué haremos con la existencia que nos ha sido concedida.\n\nUna pausa recorrió el salón.\n\n—Tenemos un reino —continuó—. Tenemos autoridad, conocimiento y poder. Pero, ¿qué sentido tiene una eternidad en la que nada cambia?\n\nGabriel levantó ligeramente la cabeza.\n\nDios extendió una mano hacia el espacio que los rodeaba.\n\n—El universo está vacío. No hay vida más allá de nosotros. No hay nuevas voces, nuevas ideas ni nada que pueda alterar el curso de nuestra existencia. Considero que ha llegado el momento de expandirla.\n\n\nIII — EL DEBATE SOBRE LA VIDA\n\nLa propuesta fue recibida con silencio.\n\nNo era una idea sencilla. Crear vida significaba introducir algo que no existía, algo que podía desarrollarse de maneras impredecibles. Si el universo era expandido, también lo serían las responsabilidades de quienes lo gobernaban.\n\nThroniel fue el primero en hablar.\n\n—¿Qué clase de existencia propone, mi señor?\n\n—Nuevos seres. Nuevos dominios. Un universo que no permanezca limitado a lo que conocemos.\n\nGabriel frunció el ceño.\n\n—¿Y cuál sería el propósito de crear más vida? —preguntó—. ¿Existe alguna necesidad que no hayamos satisfecho?\n\nDios lo miró.\n\n—¿Necesidad? No. Pero la existencia no debería permanecer inmóvil.\n\n—Crear algo implica responsabilidad —intervino Zadkiel—. Si damos origen a seres capaces de sufrir, tendremos que protegerlos.\n\nOrifiel asintió lentamente.\n\n—Y establecer reglas. Sin orden, cualquier reino que nazca podría terminar convirtiéndose en un caos.\n\nRaguel apoyó las manos sobre la mesa.\n\n—Tal vez la creación también pueda traer armonía. No todo cambio tiene que convertirse en conflicto.\n\n—No podemos saberlo —respondió Gabriel—. Precisamente por eso me preocupa. No sabemos qué surgiría, qué necesitarían esas criaturas ni qué consecuencias tendría para nosotros.\n\nRyu escuchaba atentamente.\n\nNo estaba en contra de la idea. La posibilidad de que existieran otras formas de vida le resultaba fascinante. Sin embargo, compartía una parte de la preocupación de Gabriel. Crear no podía significar simplemente dar forma a algo y abandonarlo.\n\nSeraphiel habló entonces.\n\n—Si la decisión es expandir la existencia, deberíamos establecer primero los límites de cada dominio. Un reino sin estructura podría generar problemas que ni siquiera nosotros podríamos prever.\n\nZephoniel, responsable de las leyes del tiempo y el espacio, inclinó la cabeza.\n\n—La estructura puede establecerse. Pero debemos considerar que cada nuevo dominio tendrá sus propias condiciones. No será posible mantener todos los lugares bajo una única forma de funcionamiento.\n\nVeriel miró hacia las alturas del salón.\n\n—Podríamos crear un espacio donde existan estrellas, cuerpos celestes y ciclos. Un lugar que permita que la materia se desarrolle.\n\nPotentiel añadió:\n\n—Y un mundo físico. Un lugar donde las fuerzas naturales puedan interactuar, donde haya tierra, agua, aire y otras formas de energía.\n\nLas propuestas comenzaron a acumularse.\n\nUn dominio para las criaturas celestiales.\n\nOtro para las entidades infernales.\n\nUn plano espiritual, distinto de la materia, donde las almas y las existencias no físicas pudieran desenvolverse.\n\nY un mundo terrenal, donde la vida pudiera desarrollarse bajo condiciones materiales.\n\nElyon registraba cada propuesta. Su tablilla se llenaba de símbolos, nombres y conceptos que, hasta aquel momento, no habían existido.\n\nRyu miró a Dios.\n\nEl soberano parecía satisfecho con el rumbo de la conversación. No intervenía en cada debate; escuchaba, observaba y esperaba. Sin embargo, había algo en su expresión que Ryu no lograba interpretar.\n\nNo parecía estar pensando en las criaturas que podrían nacer.\n\nParecía estar pensando en el poder que tendría sobre ellas.\n\nRyu apartó aquella sospecha antes de que pudiera desarrollarse.\n\nNo tenía motivos para desconfiar.\n\nNo todavía.\n\n\nIV — LA VOTACIÓN\n\nDespués de un largo debate, Dios decidió que la propuesta debía someterse a votación.\n\nCada representante tendría la oportunidad de expresar su postura. La decisión final se tomaría por mayoría.\n\nDominiel se encargó de organizar el procedimiento. Orifiel verificó que las jerarquías estuvieran correctamente representadas. Elyon registró los votos y Zephoniel preparó el espacio para que el resultado pudiera anunciarse sin interferencias.\n\nDios permaneció sentado en su trono.\n\n—Que cada uno decida —ordenó—. ¿Debemos expandir la existencia y crear nuevos reinos, o debemos conservar el orden que ya conocemos?\n\nLa votación comenzó.\n\nAlgunos levantaron la mano inmediatamente.\n\nOtros se tomaron unos momentos para pensar.\n\nGabriel votó en contra. No por desprecio hacia la vida, sino porque consideraba que el universo todavía no estaba preparado para semejante cambio. Zadkiel votó a favor, convencido de que cualquier nueva criatura merecería protección. Raguel también apoyó la expansión, esperando que pudiera traer armonía. Orifiel prefería mantener el orden, pero aceptó que una estructura nueva podía establecerse si se definían sus leyes.\n\nLos votos continuaron.\n\nRyu observó a sus compañeros. Algunos estaban entusiasmados; otros parecían inquietos. No todos comprendían las consecuencias, pero todos sabían que aquella decisión marcaría un antes y un después.\n\nCuando llegó su turno, Ryu miró hacia el trono.\n\nDios no le hizo ninguna señal.\n\nNo le pidió que votara a favor.\n\nNo le pidió que votara en contra.\n\nRyu pensó en el vacío que había contemplado desde el balcón. Pensó en la eternidad inmóvil, en la ausencia de cualquier cosa nueva y en la posibilidad de que algún día existieran criaturas que pudieran descubrir, aprender y experimentar.\n\nLevantó la mano.\n\nA favor.\n\nLa votación concluyó.\n\nElyon revisó los registros y entregó el resultado a Dominiel. Este se acercó a la plataforma central y habló con claridad.\n\n—La mayoría ha votado a favor de la expansión de la existencia.\n\nEl salón permaneció en silencio.\n\nDios se levantó.\n\n—Entonces, que así sea.\n\nSu voz recorrió el espacio.\n\n—A partir de este momento, la creación se expandirá. Estableceremos nuevos dominios y daremos origen a formas de vida que ocuparán aquello que ahora permanece vacío.\n\nAlgunos de los presentes inclinaron la cabeza. Otros intercambiaron miradas, conscientes de que acababan de aprobar algo que todavía no podían comprender.\n\nRyu sintió una extraña emoción.\n\nNo era exactamente alegría.\n\nEra expectativa.\n\nLa posibilidad de que el universo dejara de ser un lugar inmóvil lo llenaba de curiosidad.\n\n\nV — LOS CUATRO REINOS\n\nLa creación de los reinos no ocurrió como una construcción ordinaria. No hubo herramientas, materiales o manos que levantaran muros. La autoridad concedida por la Entidad permitió que el orden comenzara a tomar forma.\n\nEl reino angelical se estableció como dominio de Dios y de las jerarquías celestiales. Su esencia estaba ligada a la luz, la energía y las estructuras que sostenían la autoridad divina.\n\nEl reino infernal quedó bajo la autoridad de Satanás. Su naturaleza sería diferente, y sus habitantes —cuando llegaran a existir— no necesariamente compartirían las mismas condiciones que los seres celestiales.\n\nEl reino espiritual fue definido como un plano donde las existencias no dependieran únicamente de un cuerpo material. Sería un dominio para las almas y las entidades espirituales, un lugar cuyo funcionamiento no podía compararse completamente con el mundo físico.\n\nEl reino terrenal sería el espacio de la materia. Allí podrían existir tierra, agua, aire, cuerpos, ciclos naturales y criaturas capaces de vivir dentro de ellos.\n\nLos cuatro reinos quedaron establecidos.\n\nNo eran simples territorios separados por fronteras. Cada uno representaba una forma distinta de existencia, y sus diferencias serían fundamentales para el universo que comenzaba a desarrollarse.\n\nDios y Satanás recibieron la autoridad correspondiente a sus dominios. La Entidad permanecía por encima de ambos, sosteniendo el principio del ciclo y las reglas que ninguno de ellos podía reclamar como propias.\n\nPor primera vez, el universo dejó de ser una extensión vacía.\n\nHabía estructura.\n\nHabía posibilidades.\n\nY, aunque todavía no existía vida mortal, el escenario estaba preparado.\n\n\nVI — EL PRIMER AMANECER\n\nPasaron los años.\n\nEl reino angelical comenzó a llenarse de actividad. Las jerarquías establecieron sus funciones, los corredores del palacio dejaron de ser lugares silenciosos y los distintos representantes comenzaron a cumplir sus responsabilidades.\n\nRyu continuó al lado de Dios.\n\nSu rango no cambió. Seguía siendo el serafín de mayor jerarquía, el protector más cercano y uno de los pilares del reino. Sin embargo, ahora tenía nuevas tareas. Supervisaba la seguridad de las estructuras celestiales, acompañaba a Dios en sus recorridos y participaba en las decisiones relacionadas con la estabilidad del reino.\n\nA pesar de ello, siempre encontraba tiempo para visitar los jardines.\n\nLos jardines celestiales habían sido uno de los primeros lugares que aprendió a apreciar. Allí, la luz se filtraba entre árboles cuyas hojas parecían hechas de cristal suave. Las flores no se marchitaban y sus colores cambiaban lentamente según la energía que recorría el lugar. Pequeños arroyos flotaban en algunos tramos, suspendidos en el aire antes de caer en fuentes circulares.\n\nRyu caminaba entre ellos sin necesidad de escolta.\n\nNo porque olvidara su rango, sino porque disfrutaba de aquellos momentos de tranquilidad.\n\nUna mañana encontró a Jophiel contemplando una flor recién formada.\n\n—¿Qué observas? —preguntó Ryu.\n\nJophiel sonrió.\n\n—Su forma. No es exactamente igual a las anteriores.\n\nRyu se inclinó para verla.\n\n—¿Eso es bueno?\n\n—Creo que sí. Si todo fuera idéntico, no habría mucho que descubrir.\n\nRyu soltó una pequeña risa.\n\n—Entonces espero que la creación nos sorprenda.\n\nJophiel lo miró con curiosidad.\n\n—¿Te entusiasma lo que está por venir?\n\n—No sé qué esperar —admitió Ryu—. Pero me gustaría que el universo tuviera algo más que ofrecer que este silencio.\n\nJophiel volvió a mirar la flor.\n\n—Quizá pronto lo tenga.\n\nRyu se quedó un rato más en el jardín.\n\nNo sabía que aquellas palabras terminarían acompañándolo durante tanto tiempo.\n\n\nVII — UNA IDEA QUE CRECE\n\nDios también había comenzado a pensar en la siguiente etapa.\n\nLos cuatro reinos existían, pero todavía estaban lejos de alcanzar el propósito que él imaginaba. La expansión había sido aprobada, las estructuras estaban establecidas y el universo comenzaba a tomar forma.\n\nAhora quería llenarlo.\n\nNo bastaba con crear dominios. Quería criaturas que pudieran habitar en ellos, que los recorrieran, que construyeran y que reconocieran la autoridad bajo la cual habían nacido.\n\nLa idea de crear humanos comenzó a tomar forma.\n\nSerían criaturas mortales, capaces de razonar y aprender. Tendrían cuerpos materiales, sentidos, emociones y una voluntad que les permitiría desenvolverse en el reino terrenal.\n\nDios imaginó comunidades.\n\nImaginó templos.\n\nImaginó seres que levantaran la mirada hacia él y comprendieran que su existencia había sido posible gracias a su poder.\n\nLa idea de ser reconocido comenzó a ocupar un lugar cada vez mayor en sus pensamientos.\n\nNo se lo expresó a los demás de esa manera.\n\nCuando hablaba de la creación, utilizaba palabras como orden, propósito y expansión. Pero, en el fondo, había comenzado a desear algo más personal: que todo aquello que naciera bajo su voluntad lo reconociera como la autoridad suprema.\n\nRyu todavía no conocía aquella intención.\n\nUn día, mientras acompañaba a Dios por uno de los corredores del palacio, se atrevió a preguntar:\n\n—Mi señor, he escuchado que planea crear nuevas formas de vida.\n\nDios continuó caminando.\n\n—Así es.\n\n—¿Serán criaturas capaces de pensar?\n\n—Quiero que lo sean.\n\n—Entonces necesitarán aprender. Tendrán que comprender su mundo, sus límites y las consecuencias de sus decisiones.\n\nDios se detuvo frente a una ventana que daba hacia el reino terrenal.\n\n—Todo eso llegará con el tiempo.\n\nRyu observó el paisaje todavía incompleto.\n\n—Será interesante ver qué hacen con la existencia que reciban.\n\nDios lo miró por un instante.\n\n—Lo será, siempre que recuerden de quién proviene.\n\nRyu asintió, sin darle demasiada importancia a aquella frase.\n\n—Estoy seguro de que lo comprenderán.\n\nDios no respondió.\n\n\nVIII — LO QUE TODAVÍA NO SABÍAN\n\nEn el reino infernal, Satanás observaba el desarrollo de los dominios con una expresión que no era fácil de interpretar. Él también había recibido autoridad. Él también tenía un reino. Pero el universo todavía no ofrecía nada que pudiera alterar la monotonía de su existencia.\n\nLa expansión había sido un comienzo.\n\nNo necesariamente un final.\n\nMás allá de los cuatro reinos, la Entidad continuaba sosteniendo el ciclo. No intervenía en cada decisión de sus gobernantes. Su función no era resolver sus conflictos ni dirigir cada acontecimiento. La estructura existía, y dentro de ella, las voluntades comenzarían a actuar.\n\nDios se preparaba para crear vida.\n\nSatanás esperaba ver qué sucedería.\n\nLos seres celestiales se acostumbraban a sus nuevas funciones.\n\nY Ryu, todavía fiel, todavía convencido de que su señor tenía buenas intenciones, miraba hacia el reino terrenal con una esperanza que no sabía nombrar.\n\nQuizá allí habría criaturas que necesitarían ayuda.\n\nQuizá habría algo que proteger.\n\nQuizá la existencia finalmente tendría un propósito que pudiera comprender.\n\nNo sabía que, con el nacimiento de los humanos, también nacerían las primeras diferencias entre la voluntad de Dios y aquello que Ryu consideraba correcto.\n\nNo sabía que la curiosidad de aquellas criaturas sería vista como una amenaza.\n\nNo sabía que algún día tendría que elegir entre obedecer al ser al que había jurado lealtad y defender a quienes habían sido creados bajo su autoridad.\n\nPor ahora, el reino terrenal permanecía silencioso.\n\nUn mundo inmenso, esperando.\n\nY en el palacio celestial, Dios contemplaba aquella posibilidad con una sonrisa.\n\nLa creación apenas comenzaba.\n\n\nFIN DEL CAPÍTULO 1\n\n«El universo dejó de estar vacío cuando nació la posibilidad de la vida. Pero nadie imaginó que, algún día, la vida tendría el valor de cuestionar a quien la creó».\n\nCONTINUARÁ…\n\nCapítulo 2: El fruto del conocimiento.\n"

   "text": "EL COMIENZO DE UNA LARGA AVENTURA\n\nCAPÍTULO 2: EL FRUTO DEL CONOCIMIENTO\n\nPrimera vida: Ryu\n\n\nPRÓLOGO — LO QUE NACE TAMBIÉN PUEDE SUFRIR\n\nAl principio, el reino terrenal no conocía el sonido de una voz.\n\nEl viento recorría extensiones de tierra todavía intactas. Las aguas buscaban sus cauces entre montañas jóvenes y los primeros bosques crecían bajo un cielo que comenzaba a llenarse de luces. El mundo tenía estaciones, mareas, tormentas y amaneceres, pero aún no existía nadie que pudiera detenerse a contemplarlos.\n\nDespués llegaron las criaturas.\n\nPrimero fueron formas de vida pequeñas, frágiles y numerosas. Algunas se ocultaban bajo la tierra; otras aprendieron a nadar, a volar o a encontrar alimento entre las hojas. El reino terrenal dejó de ser un escenario vacío. Se convirtió en un lugar que respiraba.\n\nY, cuando aquel mundo ya había comenzado a llenarse de sonidos, Dios decidió crear algo distinto.\n\nNo quería solamente criaturas que siguieran los ritmos de la naturaleza. Quería seres capaces de observarla, de darle nombres a las cosas y de preguntarse por qué existían. Quería que pudieran recordar, imaginar y construir. Quería que fueran capaces de mirar hacia el cielo.\n\nLos humanos fueron creados con esa posibilidad.\n\nEran vulnerables. Sus cuerpos podían enfermar, cansarse y morir. Necesitaban refugio para protegerse de las tormentas, alimento para continuar viviendo y compañía para no enfrentarse solos a un mundo demasiado grande. Pero también poseían algo que llamó la atención de Ryu desde el primer momento: podían elegir.\n\nNo eran idénticos entre sí. Tenían voces distintas, temperamentos distintos y maneras diferentes de entender lo que ocurría a su alrededor. Podían sentir alegría por cosas sencillas y tristeza por pérdidas que nadie más consideraría importantes. Podían equivocarse, perdonar, aprender y volver a equivocarse.\n\nDios contempló el resultado con satisfacción.\n\nRyu, a su lado, observó a las primeras comunidades reunirse alrededor de una fuente de agua. Vio a una criatura levantar a otra después de una caída. Vio a dos humanos compartir alimento sin que nadie se los ordenara. Vio a una madre cubrir a su hijo con su propio cuerpo cuando comenzó a llover.\n\nAquello le produjo una emoción que no había conocido en el palacio.\n\n—Son pequeños —comentó Ryu.\n\nDios no apartó la mirada del mundo.\n\n—Lo son.\n\n—Y, aun así, parecen encontrar razones para continuar.\n\n—Precisamente por eso los he creado.\n\nRyu sonrió apenas.\n\n—¿Para que vivan?\n\nDios tardó un instante en responder.\n\n—Para que sepan quién les concedió esa vida.\n\nLa sonrisa de Ryu se desvaneció un poco. No porque aquella respuesta le pareciera terrible. Todavía no. Simplemente esperaba algo diferente.\n\n—Supongo que lo comprenderán cuando conozcan el mundo —dijo.\n\n—Lo comprenderán cuando se les enseñe.\n\nDios extendió una mano y la imagen del reino terrenal pareció acercarse. Las comunidades humanas eran apenas puntos dispersos en una extensión inmensa. Sin embargo, el soberano las observaba como si ya pudiera imaginar lo que serían: pueblos, ciudades, templos, altares y multitudes reunidas bajo una misma mirada.\n\nRyu siguió contemplando a los humanos.\n\nNo pensó en templos.\n\nPensó en la criatura que había compartido su alimento.\n\nY, sin saberlo, allí comenzó la distancia entre ambos.\n\n\nI — EL MUNDO APRENDE A PRONUNCIAR SUS NOMBRES\n\nLos años comenzaron a acumularse en el reino terrenal.\n\nLos humanos descubrieron que podían levantar refugios con ramas y piedra. Aprendieron a conservar el fuego, a reconocer los cambios del clima y a seguir los rastros de los animales. Algunos se establecieron cerca de los ríos; otros prefirieron las llanuras abiertas o los límites de los bosques. Con el paso del tiempo aparecieron caminos, pequeñas aldeas y formas rudimentarias de organización.\n\nCada descubrimiento era una pequeña victoria contra la fragilidad de sus cuerpos.\n\nTambién cada descubrimiento traía nuevas dificultades.\n\nDonde había alimento, surgían disputas por conseguirlo. Donde había tierra fértil, aparecían desacuerdos sobre sus límites. Los humanos podían cooperar para levantar una vivienda y, al día siguiente, discutir por quién debía ocuparla. A veces el miedo los llevaba a protegerse; otras veces los empujaba a atacar aquello que no comprendían.\n\nRyu observaba todo aquello con una curiosidad que crecía día tras día.\n\nAl principio descendía al mundo terrenal acompañado por otros ángeles. No necesitaba ocultar su naturaleza: su presencia era luminosa y las criaturas solían reconocer que estaban frente a algo que las superaba. Algunas se arrodillaban. Otras huían. Había quienes intentaban hablarle, aunque no supieran qué decir.\n\nRyu nunca exigía que inclinaran la cabeza.\n\nPrefería escucharlas.\n\nUna vez encontró a un grupo de humanos alrededor de un animal herido. Era una criatura pequeña, de patas delgadas, que respiraba con dificultad. Los humanos habían intentado ayudarla, pero no sabían cómo detener la sangre que manchaba su pelaje.\n\n—¿Por qué hacen esto? —preguntó Ryu, acercándose.\n\nUna mujer levantó la vista. Tenía las manos sucias y el rostro cansado.\n\n—Porque está sufriendo.\n\nRyu observó al animal.\n\n—No es de tu grupo.\n\n—No.\n\n—No puede darte nada a cambio.\n\nLa mujer frunció el ceño, como si no entendiera por qué aquello debía importar.\n\n—Eso no significa que tengamos que dejarlo morir.\n\nRyu se quedó en silencio.\n\nNo era una respuesta elaborada. No provenía de una ley celestial ni de una enseñanza divina. La mujer simplemente había visto dolor y había decidido acercarse.\n\nRyu utilizó una pequeña parte de su poder para cerrar la herida. No hizo desaparecer el cansancio del animal ni borró el miedo de sus ojos, pero logró que su respiración se estabilizara.\n\nLa mujer lo miró con asombro.\n\n—¿Quién eres?\n\n—Alguien que pasaba por aquí.\n\n—¿Un dios?\n\nRyu negó suavemente.\n\n—No.\n\nElla pareció decepcionada por un instante, como si esperara que el mundo tuviera una respuesta más sencilla. Después volvió a mirar al animal.\n\n—Entonces gracias, viajero.\n\nRyu se marchó antes de que pudiera formular más preguntas.\n\nDurante el trayecto de regreso al reino angelical recordó aquellas palabras. No le habían agradecido por su rango, por su cercanía a Dios ni por el poder que podía ejercer. La mujer había agradecido que alguien se detuviera.\n\nEra un gesto pequeño.\n\nPero permaneció con él.\n\nEn otra ocasión, Ryu encontró a dos niños discutiendo junto a un arroyo. Uno sostenía una piedra lisa y brillante; el otro aseguraba haberla encontrado primero. La disputa escaló hasta que ambos terminaron empujándose y uno cayó al agua poco profunda.\n\nRyu los separó con facilidad.\n\n—¿Vale la pena lastimarse por una piedra? —preguntó.\n\n—¡Era mía! —protestó uno.\n\n—¡No, yo la vi primero! —respondió el otro.\n\nRyu miró el objeto. No tenía ninguna propiedad extraordinaria. Era una piedra que el agua había pulido durante mucho tiempo.\n\n—Hay muchas más en el arroyo.\n\nLos niños se quedaron callados.\n\n—Pero esa es la que yo quería —murmuró el primero.\n\nRyu no supo qué contestar. Finalmente tomó la piedra y la colocó entre ambos.\n\n—Pueden decidir qué hacer con ella. Pero no deberían olvidar que el otro también la quería.\n\nLos niños se miraron con desconfianza. Ryu siguió su camino sin saber si habían llegado a un acuerdo.\n\nCuando regresó, Gabriel lo encontró en uno de los corredores del palacio.\n\n—Has estado visitando mucho el mundo terrenal —comentó el querubín.\n\n—Hay mucho que observar.\n\n—También hay mucho que corregir.\n\nRyu se detuvo.\n\n—¿A qué te refieres?\n\nGabriel acomodó los registros que llevaba entre las manos.\n\n—A que cada vez que una criatura aprende algo, también descubre una manera nueva de equivocarse. Algunas comunidades comienzan a enfrentarse. Otras ya establecieron jerarquías. Hay quienes creen que tener más fuerza les concede el derecho de decidir por los demás.\n\n—Son jóvenes. Están aprendiendo.\n\n—Lo sé.\n\nGabriel lo miró con seriedad.\n\n—La pregunta es quién va a enseñarles.\n\nRyu volvió a caminar.\n\n—Nosotros podríamos hacerlo.\n\n—¿Nosotros?\n\n—Los ángeles. Podemos guiarlos. Evitar que sus diferencias se conviertan en crueldad.\n\nGabriel no respondió de inmediato.\n\n—Eso supondría que se nos permite intervenir.\n\nLa frase quedó suspendida entre ambos.\n\nRyu miró hacia los ventanales. Desde allí podía contemplarse una parte del reino terrenal, pequeño y distante bajo la extensión del universo.\n\n—¿Por qué no se nos permitiría?\n\nGabriel bajó la mirada hacia sus registros.\n\n—Esa es una pregunta que quizá debas hacerle a Dios.\n\n\nII — EL TRIBUTO\n\nA medida que los humanos crecieron en número, también lo hicieron sus formas de comprender el mundo.\n\nAlgunos comenzaron a reunirse en lugares elevados para observar los cielos. Otros levantaron estructuras de piedra donde depositaban alimentos y objetos que consideraban valiosos. Había quienes interpretaban las tormentas como señales, quienes temían los eclipses y quienes atribuían las enfermedades a fuerzas que no podían ver.\n\nDios observaba el desarrollo de aquellas costumbres desde su reino.\n\nNo tardó en descubrir que los humanos podían ofrecer algo que las demás criaturas no le habían dado: reconocimiento.\n\nAl principio bastaba con que levantaran la mirada. Después quiso escuchar sus voces. Más adelante, empezó a esperar que las comunidades reservaran una parte de sus cosechas y de sus riquezas para honrarlo.\n\nLos primeros altares fueron sencillos. Un círculo de piedras, una llama protegida del viento, unas cuantas frutas o recipientes con agua. Pero con el tiempo aparecieron construcciones más grandes. Los humanos dedicaban jornadas enteras a levantar templos y organizar ceremonias.\n\nDios se complacía al contemplarlos.\n\n—Han comenzado a comprender —dijo una vez, mientras observaba una ceremonia desde el palacio.\n\nRyu, situado a su derecha, miró la imagen.\n\nEn una plaza, varias personas colocaban alimentos frente a una figura tallada. Un anciano pronunciaba palabras que el viento arrastraba hasta perderlas. Los demás permanecían de rodillas.\n\n—Parecen tenerte miedo —comentó Ryu.\n\nDios no apartó los ojos.\n\n—El respeto y el temor suelen caminar juntos.\n\n—¿Y eso es lo que quieres de ellos?\n\n—Quiero que recuerden quién los creó.\n\n—¿No sería suficiente con que vivieran y conocieran el mundo que les diste?\n\nDios giró lentamente la cabeza.\n\n—No confundas gratitud con indiferencia, Ryu. Si reciben la vida, deben reconocer su origen.\n\nRyu volvió a mirar a los humanos.\n\nLa ceremonia había terminado. Una mujer recogía los alimentos que quedaban junto al altar. No se los llevaba a su casa: un grupo de hombres los guardaba en recipientes destinados al templo.\n\n—¿Todo eso es necesario? —preguntó.\n\n—Es una ofrenda.\n\n—Lo entiendo, pero ¿qué harán con ella?\n\n—No es asunto tuyo.\n\nLa respuesta fue breve. Dios se alejó de la ventana y la conversación terminó sin que Ryu tuviera oportunidad de continuar.\n\nDurante varios días intentó olvidar el asunto. Se dijo que quizá las ofrendas ayudaban a mantener el orden, que los humanos necesitaban símbolos y que no había nada malo en expresar agradecimiento.\n\nSin embargo, la imagen de aquella mujer recogiendo los restos no desaparecía.\n\nVolvió a descender al mundo terrenal.\n\nEsta vez llegó a una región donde el clima había sido desfavorable. Las lluvias no habían aparecido durante semanas y la tierra se abría en grietas. Los cultivos estaban secos. Los animales buscaban agua en los cauces casi vacíos y las familias comenzaban a dividir las últimas reservas.\n\nEn el centro de una aldea se encontraba un templo recién construido. Sus paredes eran más altas que las viviendas y su techo brillaba bajo el sol. Frente a la entrada, un grupo de sacerdotes organizaba una nueva entrega de alimentos.\n\nRyu observó cómo los habitantes se acercaban con pequeñas bolsas de grano, recipientes de agua y frutas que habían logrado conservar.\n\nUna niña caminaba junto a su padre. Llevaba una cesta casi vacía.\n\n—¿Tenemos que dejarlo todo? —preguntó.\n\n—Es lo que se nos pidió —respondió el hombre.\n\n—¿Y qué vamos a comer después?\n\nEl padre no contestó.\n\nUn sacerdote tomó la cesta y la colocó junto a las demás ofrendas.\n\n—El soberano proveerá a quienes demuestren devoción —dijo, alzando la voz para que todos lo escucharan—. No deben poner en duda la voluntad divina.\n\nLa niña miró a su padre. Él mantuvo la cabeza inclinada.\n\nRyu sintió que algo se tensaba dentro de su pecho.\n\nNo era la primera vez que veía a los humanos pasar hambre. La fragilidad pertenecía a su naturaleza y el mundo no podía ser un lugar sin dificultades. Pero aquello era distinto. La gente entregaba sus últimas reservas porque se les había enseñado que hacerlo demostraría su lealtad.\n\nRyu se acercó al sacerdote.\n\n—¿Por qué reciben alimento de quienes no tienen suficiente?\n\nEl hombre se volvió. Al ver la luz que rodeaba al serafín, cayó de rodillas.\n\n—Señor celestial, cumplimos con lo que se nos ha ordenado.\n\n—No te he preguntado si obedeces. Te he preguntado por qué.\n\nEl sacerdote tragó saliva.\n\n—Las ofrendas son necesarias para honrar a Dios.\n\n—¿Y los niños que pasan hambre también deben ofrecer lo poco que tienen?\n\n—La fe exige sacrificio.\n\nRyu miró a la niña. La pequeña se aferraba a la mano de su padre y observaba la conversación sin comprender por qué aquel desconocido parecía enfadado.\n\n—¿Quién decidió eso?\n\nEl sacerdote no se atrevió a responder.\n\nRyu sintió deseos de tomar todas las cestas y devolverlas. Podía hacerlo. Bastaba con extender una mano. Pero también sabía que el problema no terminaría allí. Si devolvía el alimento, al día siguiente alguien volvería a exigirlo. La aldea necesitaba agua, cosechas y una manera de protegerse de la sequía. No necesitaba un milagro que durara una tarde.\n\nSe apartó de la entrada y encontró un cauce seco detrás de las viviendas. Puso una mano sobre la tierra. La energía celestial se extendió bajo el suelo hasta alcanzar una corriente subterránea. El terreno se estremeció y, poco a poco, el agua volvió a abrirse paso entre las piedras.\n\nLos habitantes corrieron hacia el sonido.\n\nAlgunos gritaron de alegría. Otros cayeron de rodillas. La niña llenó sus manos y bebió antes de que su padre pudiera detenerla.\n\nRyu sintió alivio al verla sonreír.\n\nPero su alivio duró poco.\n\n—¡Es una señal! —exclamó el sacerdote—. ¡Dios ha aceptado nuestras ofrendas!\n\nLos habitantes comenzaron a agradecer al templo. El sacerdote se apresuró a atribuir el agua a la generosidad divina. Nadie preguntó quién la había hecho aparecer ni por qué el agua había regresado justo cuando las reservas estaban a punto de agotarse.\n\nRyu no corrigió sus palabras.\n\nSe quedó observando desde lejos.\n\nHabía ayudado a aquellas personas, pero el resultado había sido utilizado para justificar aquello que las estaba perjudicando.\n\nPor primera vez comprendió que un milagro podía convertirse en una herramienta para mantener a alguien sometido.\n\nY no supo cómo impedirlo.\n\n\nIII — LA INDIFERENCIA DE LOS CIELOS\n\nLas noticias del reino terrenal llegaban al palacio de distintas maneras. Los ángeles encargados de observar los dominios registraban cambios, conflictos y alteraciones. Algunas situaciones eran atendidas por las jerarquías correspondientes; otras se consideraban parte del desarrollo natural de las criaturas.\n\nRyu comenzó a leer aquellos informes con atención.\n\nEncontró registros de aldeas que habían sido saqueadas por grupos más numerosos. De comunidades que expulsaban a los enfermos para evitar contagios. De gobernantes que acumulaban alimento mientras sus habitantes morían de hambre. También había relatos de humanos que arriesgaban la vida para proteger a desconocidos, que compartían sus hogares con viajeros y que se negaban a abandonar a los más débiles.\n\nEl mundo no era enteramente cruel.\n\nEso lo hacía más difícil de comprender.\n\nNo podía señalar a una sola criatura y decir que toda la humanidad estaba perdida. La misma especie que levantaba una mano para golpear también podía utilizarla para sostener a alguien. La misma comunidad que expulsaba a un extraño podía recibirlo días después, cuando comprendía su necesidad.\n\nLos humanos eran contradictorios.\n\nY, para Ryu, aquella contradicción significaba que todavía podían aprender.\n\nUna tarde llevó varios informes al salón de audiencias. Dios estaba sentado frente a una mesa de piedra clara, revisando las ceremonias que se habían celebrado en distintas regiones. A su alrededor había tablillas con registros de tributos y peticiones.\n\n—Mi señor —dijo Ryu.\n\nDios no levantó la mirada.\n\n—Habla.\n\n—Hay comunidades que están sufriendo.\n\n—Siempre las habrá.\n\n—No hablo de dificultades comunes. Hay pueblos que han perdido sus cosechas. Otros están siendo sometidos por sus propios gobernantes. Algunos entregan su alimento a los templos y después no tienen nada que comer.\n\nDios pasó una página.\n\n—¿Y qué esperas que haga?\n\n—Que los ayudes.\n\n—¿A todos?\n\n—A quienes lo necesiten.\n\nDios soltó una pequeña risa sin humor.\n\n—Entonces no has entendido cómo funciona la creación.\n\nRyu permaneció quieto.\n\n—Explícamelo.\n\n—Los humanos recibieron un mundo, cuerpos y la capacidad de decidir. Si lo utilizan mal, deben enfrentar las consecuencias. No puedo corregir cada error que cometen.\n\n—No te estoy pidiendo que decidas por ellos. Te estoy pidiendo que no permitas que los más fuertes destruyan a los demás.\n\n—¿Y quién decidirá quién merece ser protegido?\n\n—Tú tienes autoridad para establecer límites.\n\n—Mi autoridad no existe para resolver los problemas de cada criatura que se niega a obedecer.\n\nRyu bajó los ojos hacia los registros. Reconoció nombres de regiones que había visitado. Había visto algunos de aquellos rostros. Recordaba el hambre de la niña, el silencio del padre y la manera en que los sacerdotes habían convertido el agua en una prueba de obediencia.\n\n—Algunos sí obedecen —dijo—. Hacen todo lo que se les pide y aun así sufren.\n\nDios levantó por fin la mirada.\n\n—Entonces quizá no están haciendo suficiente.\n\nLa respuesta hizo que Ryu alzara la cabeza.\n\n—¿Cómo puedes decir eso?\n\n—Con facilidad. Si necesitan algo, pueden pedirlo. Si desean prosperidad, pueden demostrar devoción. Si esperan protección, pueden recordar a quién deben agradecerla.\n\n—Pero hay quienes no tienen nada que ofrecer.\n\n—Siempre tienen algo.\n\nRyu apretó las manos a los costados.\n\n—¿Y si no pueden?\n\nDios volvió a sus tablillas.\n\n—Entonces aprenderán lo que significa vivir sin recibirlo todo.\n\nLa conversación terminó allí. No hubo gritos ni una orden de retirarse. Dios simplemente dejó de prestarle atención, como si la pregunta de Ryu hubiera sido una interrupción menor.\n\nRyu salió del salón con los informes todavía en las manos.\n\nEn el corredor encontró a Zadkiel. El querubín había escuchado parte de la conversación desde la entrada y no intentó fingir lo contrario.\n\n—No deberías presionarlo de esa manera —dijo con cautela.\n\nRyu lo miró.\n\n—¿Crees que estoy equivocado?\n\nZadkiel tardó en contestar.\n\n—Creo que tienes razón en preocuparte por ellos. Pero también sé lo que ocurre cuando alguien desafía directamente la voluntad de Dios.\n\n—¿Desde cuándo una pregunta es un desafío?\n\n—Desde que quien la escucha decide tomarla como tal.\n\nRyu observó el rostro de Zadkiel. No había cobardía en él. Había preocupación, y quizá una parte de esa preocupación estaba dirigida al propio Ryu.\n\n—¿Qué harías tú? —preguntó.\n\n—Intentaría encontrar una manera de ayudarlos sin provocar una ruptura.\n\n—¿Y si la ruptura ya existe? ¿Y si ellos viven bajo un orden que los abandona?\n\nZadkiel bajó la voz.\n\n—No tengo una respuesta.\n\nRyu asintió lentamente.\n\nNo esperaba que todos estuvieran de acuerdo con él. Tampoco quería que los demás se rebelaran por su causa. Solo deseaba que alguien más mirara lo que él estaba viendo.\n\nPero, al parecer, muchos preferían mirar hacia otro lado.\n\n\nIV — EL JARDÍN QUE NO DEBÍA SER TOCADO\n\nHabía un lugar en el reino terrenal que no se parecía a ningún otro.\n\nSe encontraba apartado de los caminos humanos, rodeado por una extensión de árboles y una quietud que parecía distinta a la del resto del mundo. El aire allí era fresco incluso cuando el calor se extendía por las tierras cercanas. Las hojas se movían con una brisa constante y el agua corría sobre piedras claras sin ensuciarse ni perder su transparencia.\n\nEn el centro del jardín crecía un árbol antiguo.\n\nSu tronco era ancho y sus ramas se extendían en varias direcciones, como si sostuvieran una parte del cielo. Las hojas tenían un brillo tenue, y entre ellas nacían frutos de aspecto delicado. No eran abundantes. Cada uno parecía concentrar una luz propia, difícil de distinguir de la claridad que atravesaba el follaje.\n\nEra el árbol del conocimiento.\n\nDios había establecido que sus frutos no debían ser consumidos. La prohibición no había sido presentada como una sugerencia ni como una advertencia para tener cuidado. Era una orden.\n\nNingún humano debía comer de él.\n\nRyu conocía aquella regla, aunque nunca había comprendido por qué existía. La primera vez que preguntó, Dios le respondió que ciertas cosas debían permanecer fuera del alcance de las criaturas hasta que estuvieran preparadas para comprenderlas.\n\n—¿Y cómo sabrán cuándo están preparadas? —había preguntado Ryu.\n\n—Yo lo decidiré.\n\nNo hubo más explicación.\n\nCon el paso del tiempo, el jardín comenzó a convertirse en una frontera simbólica. Los humanos que escuchaban hablar de él lo imaginaban como un lugar sagrado, lleno de riquezas y maravillas. Algunos contaban que sus aguas podían curar cualquier enfermedad; otros aseguraban que allí se encontraban respuestas a todas las preguntas. Ninguno sabía con certeza qué había de verdad en aquellas historias.\n\nLos ángeles, por su parte, tenían instrucciones de respetar la prohibición.\n\nRyu no había pensado demasiado en el asunto hasta que Gabriel volvió a mencionarlo.\n\nSe encontraron en una galería que daba hacia los jardines del palacio. Gabriel llevaba varios registros antiguos y parecía estar buscando una referencia concreta.\n\n—¿Has estado en el jardín del árbol? —preguntó.\n\n—Sí.\n\n—¿Lo has observado de cerca?\n\n—Lo suficiente para saber que sus frutos están prohibidos.\n\nGabriel levantó los ojos.\n\n—Eso no responde a mi pregunta.\n\nRyu apoyó un hombro contra una columna.\n\n—¿Qué quieres saber?\n\n—Por qué está prohibido.\n\nRyu lo miró con interés.\n\n—¿Tú tampoco lo sabes?\n\n—No. He revisado los registros que tenemos. La orden aparece, pero no explica su motivo. No se menciona que el árbol sea peligroso, ni que sus frutos destruyan el cuerpo, ni que puedan dañar los reinos.\n\n—Tal vez la razón no nos corresponde.\n\nGabriel cerró uno de los registros.\n\n—¿Y no te parece extraño que se nos exija obedecer una regla cuyo propósito nadie puede explicar?\n\nRyu no respondió enseguida.\n\nLa frase se parecía demasiado a las preguntas que él mismo había comenzado a hacerse.\n\n—Dios tendrá sus razones —dijo al fin, aunque la seguridad de su voz ya no era la misma.\n\nGabriel no insistió.\n\n—Eso espero.\n\nSe despidieron poco después. Ryu permaneció en la galería, mirando el mundo terrenal a la distancia.\n\nNo era la prohibición lo que le inquietaba.\n\nEra el silencio que la rodeaba.\n\n\nV — LAS VOCES DE QUIENES NO PUEDEN SER ESCUCHADOS\n\nEl tiempo continuó avanzando.\n\nLas comunidades humanas se extendieron y sus conflictos se volvieron más complejos. Algunas ciudades prosperaron; otras desaparecieron después de guerras o desastres naturales. Los templos se hicieron más grandes y las ofrendas, más frecuentes. También aumentó la distancia entre quienes podían decidir y quienes debían obedecer.\n\nRyu siguió descendiendo al mundo terrenal.\n\nYa no lo hacía solo para observar. Buscaba lugares donde su presencia pudiera aliviar algún sufrimiento. A veces sanaba a un enfermo. Otras veces detenía una pelea antes de que alguien muriera. En ocasiones se limitaba a escuchar a personas que necesitaban hablar con alguien que no las juzgara.\n\nNo podía estar en todas partes.\n\nEsa era una de las primeras verdades que había tenido que aceptar.\n\nUna tarde llegó a una ciudad rodeada por murallas. Desde lejos parecía próspera: sus calles estaban pavimentadas, los mercados rebosaban de mercancías y las torres del templo dominaban los tejados. Sin embargo, al recorrer sus callejones encontró a familias durmiendo junto a las paredes, niños que buscaban restos de comida y ancianos que esperaban a que alguien les ofreciera agua.\n\nEn la plaza principal se celebraba una ceremonia.\n\nEl gobernante de la ciudad había ordenado reunir a todos los habitantes para agradecer una buena cosecha. Los sacerdotes anunciaban que la prosperidad era una recompensa por la obediencia de la ciudad y que, para conservarla, debían aumentar las ofrendas.\n\nRyu escuchó desde el borde de la multitud.\n\nUn hombre levantó la voz.\n\n—Mi señor, mi familia no tiene suficiente para pagar lo que nos piden.\n\nLos guardias lo sujetaron antes de que pudiera continuar.\n\n—La ciudad ha recibido abundancia —respondió uno de los sacerdotes—. Quien se niega a compartirla demuestra ingratitud.\n\n—No tenemos abundancia. Perdimos nuestra casa durante el incendio. Mis hijos apenas han comido.\n\nEl sacerdote hizo una señal a los guardias.\n\n—Llévenselo.\n\nRyu dio un paso al frente.\n\nLa luz que lo rodeaba se hizo más intensa. Los guardias se detuvieron al sentir una presión que no comprendían. El sacerdote palideció.\n\n—¿Qué significa esto? —preguntó Ryu.\n\nNadie respondió.\n\nRyu miró al gobernante, sentado bajo un dosel elevado. El hombre había observado la escena sin moverse. Sus ropas estaban adornadas con metales y piedras preciosas. A su lado había bandejas llenas de comida.\n\n—¿Por qué castigas a quienes no pueden entregar lo que no tienen? —preguntó Ryu.\n\nEl gobernante se levantó con cautela.\n\n—Señor celestial, la ciudad cumple con las obligaciones que le fueron dadas.\n\n—¿Obligaciones?\n\n—Las ofrendas mantienen nuestra relación con Dios. Si permitimos que algunos se nieguen, otros harán lo mismo. Entonces perderemos su favor.\n\nRyu miró a las familias reunidas.\n\n—¿Y qué ocurre con quienes ya lo han perdido todo?\n\nEl gobernante no supo qué contestar.\n\nRyu podría haber destruido aquel lugar. Podría haber derribado las murallas, arrebatado el poder al gobernante y terminado con la ceremonia. Pero no lo hizo. Su deber no era sustituir una voluntad por la suya. No quería convertirse en otro ser que decidiera el destino de todos sin escucharlos.\n\nSoltó a los guardias de la presión que los mantenía inmóviles.\n\n—Devuelvan lo que han tomado de esa familia —ordenó.\n\nEl sacerdote miró al gobernante. El gobernante miró a Ryu. Nadie se movió.\n\n—Ahora —dijo el serafín.\n\nEsta vez obedecieron.\n\nLa familia recibió algunas provisiones y se marchó de la plaza. La multitud comenzó a dispersarse. Algunos agradecieron a Ryu; otros se retiraron con miedo, temiendo que aquella intervención trajera consecuencias.\n\nRyu no se quedó para recibir elogios.\n\nAl abandonar la ciudad, una voz lo alcanzó desde un callejón.\n\n—¿Vas a volver?\n\nEra el hombre al que habían detenido. Tenía a sus hijos junto a él.\n\nRyu se acercó.\n\n—No lo sé.\n\nEl hombre bajó la mirada.\n\n—Entonces no importa.\n\nRyu se quedó quieto.\n\n—¿Por qué dices eso?\n\n—Porque mañana volverán a pedirnos lo mismo. Y cuando te marches, ellos seguirán aquí.\n\nNo había reproche en su voz. Solo cansancio.\n\nRyu quiso prometerle que no volverían a hacerle daño. Quiso asegurarle que encontraría una solución. Pero no tenía derecho a ofrecer algo que no sabía si podría cumplir.\n\n—Lo siento —dijo.\n\nEl hombre asintió, como si aquella respuesta fuera más honesta que cualquier promesa.\n\nRyu se marchó con una sensación de impotencia que no desapareció al cruzar de nuevo las fronteras del reino angelical.\n\nAquella noche no acudió a sus aposentos. Permaneció en una terraza alta, mirando el mundo que había ayudado a crear.\n\nDesde allí, las ciudades eran pequeñas luces dispersas.\n\nCada una contenía miles de vidas.\n\nCada una guardaba dolores que jamás llegarían hasta el palacio.\n\nRyu se preguntó cuántas veces habría pasado junto a una ventana sin comprender lo que significaba realmente gobernar un mundo.\n\n\nVI — LA ORDEN\n\nLa tensión que Ryu sentía terminó por hacerse evidente.\n\nDios lo notó durante una reunión breve en la que se revisaban las condiciones del reino terrenal. No había convocado a todas las jerarquías. Solo estaban presentes algunos representantes, entre ellos Gabriel, Zadkiel y Seraphiel.\n\nLas conversaciones giraban alrededor del crecimiento de las comunidades humanas y de las nuevas ceremonias que se realizaban en los templos.\n\nDios se mostraba satisfecho.\n\n—Las ofrendas han aumentado —comentó—. Cada vez son más los que comprenden la importancia de reconocer mi autoridad.\n\nRyu miró los registros.\n\n—También han aumentado las peticiones de ayuda.\n\nEl silencio fue breve, pero perceptible.\n\nDios apoyó una mano sobre la mesa.\n\n—No estamos aquí para revisar cada queja de los humanos.\n\n—No son simples quejas.\n\nSeraphiel dirigió la mirada hacia Ryu, advirtiéndole con discreción que midiera sus palabras.\n\nRyu continuó:\n\n—Hay personas que pierden sus hogares, que son expulsadas de sus tierras y que mueren por decisiones de quienes dicen actuar en tu nombre. Si los templos utilizan tu autoridad para someterlas, deberíamos intervenir.\n\nDios lo observó con una expresión cada vez menos paciente.\n\n—¿Ahora los humanos te preocupan más que tus deberes?\n\n—Mis deberes siempre han sido proteger.\n\n—Proteger el reino angelical.\n\n—Proteger la creación.\n\nDios se incorporó ligeramente en el trono.\n\n—No confundas las funciones que te corresponden. Los humanos no son responsabilidad tuya.\n\nRyu sintió la mirada de Gabriel. El querubín permanecía inmóvil, pero sus manos se habían cerrado alrededor de los registros.\n\n—Entonces, ¿de quién son responsabilidad? —preguntó Ryu.\n\nDios no contestó de inmediato.\n\n—De ellos mismos.\n\n—No todos tienen la fuerza para defenderse.\n\n—No la necesitan si aprenden a obedecer.\n\nZadkiel intervino con prudencia.\n\n—Mi señor, quizá podríamos enviar representantes para enseñarles a resolver sus diferencias. No sería necesario intervenir en cada conflicto.\n\nDios lo miró apenas.\n\n—No he pedido propuestas.\n\nZadkiel inclinó la cabeza y guardó silencio.\n\nRyu sintió que aquella reunión estaba llegando a un punto del que ya no habría regreso. Aun así, hizo una última pregunta.\n\n—¿Qué esperas de ellos, exactamente?\n\nDios extendió una mano hacia los registros de ofrendas.\n\n—Que reconozcan mi autoridad. Que respeten las leyes que se les han dado y que no olviden quién está por encima de ellos.\n\n—¿Y si cumplen con eso, pero siguen sufriendo?\n\n—Entonces deberán soportarlo.\n\nRyu bajó la mirada por un instante.\n\n—¿Eso es todo?\n\n—Es suficiente.\n\nLa reunión terminó poco después. Dios ordenó que los informes relacionados con las peticiones humanas fueran filtrados para que solo llegaran al consejo aquellos que afectaran directamente la estabilidad de los reinos. No quería que cada desgracia se convirtiera en un asunto de discusión.\n\nRyu abandonó la sala sin despedirse.\n\nEn el corredor, Gabriel caminó a su lado.\n\n—No vuelvas a enfrentarlo delante de todos —murmuró.\n\n—¿Por qué? ¿Porque los demás podrían escuchar la respuesta?\n\nGabriel se detuvo.\n\n—Porque sé lo que significa para ti permanecer a su lado. No quiero que pierdas todo por una discusión.\n\nRyu lo miró.\n\n—¿Y qué se supone que debo hacer? ¿Seguir protegiéndolo mientras el resto se desmorona?\n\n—No he dicho eso.\n\n—Pero tampoco has dicho que vaya a cambiar.\n\nGabriel sostuvo su mirada. Durante un momento pareció querer responder, pero finalmente cerró los ojos.\n\n—No sé cómo cambiarlo.\n\nRyu asintió.\n\n—Yo tampoco.\n\nSiguió caminando.\n\n\nVII — EL FRUTO\n\nRyu regresó al jardín del árbol cuando el reino terrenal estaba entrando en una noche tranquila.\n\nNo tenía intención de acercarse al fruto. Solo quería estar lejos del palacio, de las órdenes y de las explicaciones que nunca llegaban. El jardín permanecía silencioso. Las hojas se mecían con suavidad y el agua corría entre las piedras como si nada en el universo pudiera alterarla.\n\nSe detuvo frente al árbol.\n\nHabía visto a los humanos levantar ciudades, compartir alimento, construir templos y destruirse por motivos que a veces ni siquiera recordaban. Había visto a niños aprender a caminar y a ancianos cerrar los ojos por última vez. Había visto bondad sin recompensa y crueldad protegida por leyes sagradas.\n\nY había escuchado a Dios decir que todo aquello debía soportarse.\n\nRyu levantó la vista hacia las ramas.\n\nEl fruto prohibido seguía allí.\n\nDurante mucho tiempo había pensado que la orden debía tener un propósito que todavía no comprendía. Había confiado en que el conocimiento que le faltaba llegaría cuando fuera necesario. Esa confianza había sido parte de su vida desde el principio. Dios sabía más. Dios veía más. Dios decidía.\n\nPero, ¿y si aquella confianza era precisamente lo que le impedía ver?\n\nSe acercó un paso.\n\nRecordó la pregunta de Gabriel: por qué se les exigía obedecer una regla cuyo propósito nadie podía explicar.\n\nRecordó a la niña junto a la cesta vacía.\n\nRecordó al hombre que sabía que al día siguiente volverían a quitarle lo poco que tenía.\n\nRecordó a Dios preguntando por qué debería ayudar a quienes no creían en él.\n\nRyu extendió la mano.\n\nNo hubo una voz que lo detuviera. Ninguna señal estremeció el jardín. El árbol no retrocedió ni sus ramas se cerraron para proteger el fruto. La prohibición existía en la voluntad de Dios, no en una barrera que impidiera acercarse.\n\nSus dedos rozaron la superficie del fruto.\n\nEra tibio.\n\nRyu lo sostuvo con cuidado. Parecía sencillo, casi frágil. Le resultó difícil entender cómo algo tan pequeño podía cargar con una orden que nadie se atrevía a cuestionar.\n\nDurante un instante pensó en devolverlo.\n\nPodía marcharse. Podía fingir que aquella noche no había ocurrido nada y continuar cumpliendo sus deberes. Tal vez, con el tiempo, encontraría una manera de ayudar a los humanos sin desafiar a Dios. Tal vez el soberano cambiaría de opinión. Tal vez todo tenía una explicación que todavía no había llegado a comprender.\n\nPero había pasado demasiado tiempo esperando.\n\nRyu acercó el fruto a sus labios y mordió.\n\nEl sabor no fue dulce ni amargo de una manera que pudiera describirse. Primero sintió una especie de frescura que le recorrió la boca. Después, un calor profundo se extendió por su cuerpo.\n\nEl jardín pareció alejarse.\n\nRyu apoyó una mano en el tronco.\n\nNo escuchó una voz. No vio una figura. No recibió una explicación ordenada que pudiera repetir después. Lo que ocurrió fue más extraño: el mundo pareció abrirse en todas direcciones y, por un instante, dejó de contemplar la vida desde la distancia segura que siempre había tenido.\n\nSintió el miedo de una criatura acorralada.\n\nLa sed de alguien que llevaba días buscando agua.\n\nLa desesperación de una madre que no sabía cómo alimentar a sus hijos.\n\nLa vergüenza de quien había sido obligado a arrodillarse ante alguien que no respetaba.\n\nTambién sintió otras cosas.\n\nLa alegría absurda de dos hermanos que encontraban una flor en mitad de un campo seco. El alivio de una mano que encontraba otra en la oscuridad. La esperanza de alguien que, después de perderlo todo, decidía comenzar de nuevo.\n\nNo eran recuerdos suyos.\n\nNo eran experiencias que hubiera vivido.\n\nY, sin embargo, por un instante las comprendió desde dentro.\n\nRyu cayó de rodillas.\n\nEl conocimiento no le entregó una respuesta sencilla. No le dijo quién tenía razón en cada conflicto ni cómo debía resolverse cada injusticia. No convirtió a los humanos en criaturas perfectas ni le mostró un futuro sin sufrimiento.\n\nLe mostró algo más difícil de ignorar.\n\nQue cada vida tenía un mundo propio.\n\nQue una decisión tomada desde un trono podía sentirse como una condena para quien debía soportarla. Que una orden pronunciada con serenidad podía destruir a alguien que nunca había tenido la oportunidad de responder. Que el dolor de una criatura no se volvía menos verdadero por ocurrir lejos de los ojos de quien tenía el poder para evitarlo.\n\nRyu respiró con dificultad.\n\nEl jardín regresó poco a poco. Las hojas volvieron a distinguirse. El agua recuperó su sonido. El fruto seguía en su mano, con una marca visible donde había mordido.\n\nNo sabía qué había cambiado en él.\n\nQuizá el fruto le había mostrado una parte del mundo que siempre estuvo ahí. Quizá había despertado algo que llevaba demasiado tiempo dormido. O quizá el conocimiento no había llegado como una respuesta, sino como la imposibilidad de seguir aceptando las mismas preguntas sin hacer nada.\n\nMiró el árbol.\n\nLa prohibición seguía existiendo.\n\nPero ya no podía regresar a la ignorancia que la había hecho parecer incuestionable.\n\n\nVIII — DESPUÉS DE SABER\n\nRyu permaneció en el jardín durante un largo rato.\n\nNo sintió que se hubiera convertido en alguien más poderoso. No percibió una nueva fuerza recorriendo sus brazos ni escuchó un llamado que lo proclamara elegido. Seguía siendo el mismo serafín que había entrado allí, con las mismas alas y la misma autoridad.\n\nSin embargo, algo esencial había cambiado.\n\nAntes podía observar una injusticia y pensar que quizá no comprendía todo lo necesario para juzgarla. Ahora sabía que comprender no significaba permanecer inmóvil. No necesitaba conocer cada secreto del universo para reconocer el sufrimiento de alguien que tenía delante.\n\nY tampoco necesitaba que una autoridad le diera permiso para considerar que una vida importaba.\n\nEl fruto no le había enseñado a odiar a Dios.\n\nEso habría sido más sencillo.\n\nRyu todavía recordaba los primeros días del reino angelical, las veces que había permanecido al lado de su señor, las órdenes que había cumplido y la confianza que le había entregado sin reservas. No quería borrar aquellos recuerdos. No podía fingir que toda su vida había sido una mentira.\n\nPero la lealtad no podía exigirle que negara lo que estaba viendo.\n\nCuando regresó al palacio, el reino angelical parecía igual que siempre. Los corredores resplandecían, los ángeles cumplían sus tareas y las fuentes de energía continuaban recorriendo los jardines. Nada en aquel lugar anunciaba que el serafín de mayor rango acababa de cruzar una frontera prohibida.\n\nRyu encontró a Gabriel en la biblioteca.\n\nEl querubín levantó la vista apenas lo vio entrar.\n\n—Has estado fuera toda la noche.\n\n—Sí.\n\nGabriel observó su rostro. Después miró la mano que Ryu mantenía cerrada.\n\n—¿Qué hiciste?\n\nRyu no respondió enseguida.\n\n—Comí del fruto.\n\nEl silencio que siguió fue distinto a cualquier otro.\n\nGabriel dejó los registros sobre la mesa con mucho cuidado.\n\n—Dime que no es cierto.\n\n—Lo es.\n\n—¿Sabes lo que significa?\n\n—Sé que estaba prohibido.\n\n—No estoy hablando de eso. Sabes que Dios dio una orden expresa. Sabes que nadie debía tocarlo.\n\n—Lo sé.\n\nGabriel se levantó.\n\n—Entonces, ¿por qué lo hiciste?\n\nRyu abrió la mano. En su palma no quedaba nada del fruto. Solo una tenue marca de su jugo, que comenzaba a desaparecer.\n\n—Porque ya no podía seguir mirando sin comprender lo que estaba mirando.\n\nGabriel se quedó inmóvil.\n\n—¿Y qué has comprendido?\n\nRyu tardó en encontrar las palabras.\n\n—Que no son cifras en un registro. Ni ofrendas. Ni comunidades que deben aprender a obedecer. Son vidas. Cada una tiene un miedo, una esperanza y alguien a quien perder. No puedo volver a verlas como si fueran piezas de algo que pertenece a Dios.\n\n—Ryu…\n\n—No estoy diciendo que no deban asumir las consecuencias de sus decisiones. Estoy diciendo que no merecen ser abandonados por cometer errores. Y mucho menos castigados por no tener nada que ofrecer.\n\nGabriel bajó la mirada.\n\n—Si Dios descubre lo que hiciste, no habrá manera de ocultarlo.\n\n—No quiero ocultarlo.\n\n—No sabes lo que estás diciendo.\n\nRyu se acercó a la ventana.\n\n—Tal vez no. Pero por primera vez siento que estoy haciendo una pregunta que importa.\n\nGabriel no lo acompañó.\n\nNo lo denunció tampoco.\n\nSe quedó allí, dividido entre el temor a lo que podía ocurrir y la certeza de que las palabras de Ryu no eran fáciles de refutar.\n\n\nIX — LA PREGUNTA QUE NO DEBÍA HACERSE\n\nDios supo lo ocurrido.\n\nNo hubo necesidad de que un ángel lo denunciara. La prohibición había sido establecida por su propia voluntad y el acto de Ryu no podía pasar inadvertido para quien había dictado la orden. El soberano convocó al serafín a sus aposentos antes de que terminara el siguiente ciclo de luz.\n\nLa estancia estaba en silencio.\n\nDios permanecía de pie junto a una amplia abertura desde la que podía contemplarse el reino terrenal. No parecía sorprendido. Tampoco parecía preocupado.\n\nRyu entró y se detuvo a una distancia respetuosa.\n\n—Me has llamado, mi señor.\n\nDios no se volvió.\n\n—¿Comiste del fruto?\n\nRyu sintió el peso de la pregunta.\n\n—Sí.\n\n—¿Sabías que estaba prohibido?\n\n—Sí.\n\n—¿Y aun así lo hiciste?\n\n—Sí.\n\nDios giró lentamente.\n\n—¿Por qué?\n\nRyu sostuvo su mirada.\n\n—Porque necesitaba saber qué era aquello que no querías que nadie comprendiera.\n\n—No tenías derecho a decidirlo.\n\n—¿Y ellos sí tienen derecho a sufrir sin saber por qué?\n\nLa expresión de Dios se endureció.\n\n—No conviertas tu desobediencia en una virtud.\n\n—No intento justificar lo que hice. Estoy intentando entender por qué una pregunta merece un castigo mayor que el sufrimiento que vemos todos los días.\n\n—El fruto estaba prohibido.\n\n—Eso lo sé. Pero nunca me explicaste por qué.\n\n—No necesito explicarte cada decisión.\n\n—Entonces, ¿cómo se supone que debemos distinguir una orden justa de una que solo sirve para mantener tu autoridad?\n\nPor primera vez, la habitación pareció quedarse demasiado pequeña para ambos.\n\nDios dio un paso hacia él.\n\n—Mide tus palabras.\n\nRyu no retrocedió.\n\n—He visto a tus criaturas entregar su comida mientras sus hijos pasan hambre. He visto gobernantes utilizar tu nombre para someter a quienes no pueden defenderse. He visto personas pedir ayuda hasta quedarse sin voz. Y cuando te pregunté qué pensabas hacer, me dijiste que no era asunto tuyo.\n\n—Ellos no creen en mí. ¿Por qué debería ayudarlos?\n\nLa frase cayó con una sencillez que la hizo todavía más terrible.\n\nRyu lo miró durante un largo instante.\n\nHabía esperado una explicación. Incluso una respuesta cruel habría sido distinta si al menos hubiera reconocido el dolor de aquellas criaturas. Pero Dios hablaba como si el sufrimiento fuera una deuda que los humanos habían contraído por no rendirle suficiente homenaje.\n\n—Porque son tu gente —respondió Ryu—. Tú los creaste. Deberías enseñarles, guiarlos, darles una oportunidad de comprender lo que todavía no saben.\n\nDios soltó una exhalación de desprecio.\n\n—No me interesa enseñarles. Mientras no intenten rebelarse contra mí, pueden hacer lo que quieran.\n\nRyu sintió que una última parte de su antigua confianza se resquebrajaba.\n\n—¿Entonces solo te importa que te obedezcan?\n\n—Me importa que recuerden quién está por encima de ellos.\n\n—¿Y qué hay de lo que necesitan?\n\n—No voy a perseguir cada problema que ellos mismos provocan.\n\n—No todos los problemas los provocan quienes los sufren.\n\n—Basta.\n\nDios dio otro paso. Su presencia llenó la estancia con una presión que habría hecho inclinarse a cualquier otro ángel.\n\nRyu permaneció de pie.\n\n—¿No deberíamos proteger los reinos? —preguntó, con la voz más baja, pero sin apartar los ojos—. ¿No los creamos para eso?\n\nDios lo observó con desprecio.\n\n—Estás olvidando cuál es tu lugar.\n\n—No. Creo que estoy empezando a comprenderlo.\n\n—Tu lugar es a mi lado.\n\n—Mi lugar está donde alguien necesita protección.\n\nDurante unos segundos ninguno habló.\n\nRyu sintió el recuerdo de todas las veces que había permanecido junto a Dios. Había sido su guardián, su mano izquierda, su servidor más cercano. Había considerado un honor ser la presencia en la que el soberano podía confiar sin mirar atrás.\n\nAhora comprendía que aquella cercanía no le garantizaba conocerlo.\n\nQuizá nunca había visto a Dios con claridad. Quizá había confundido su propia lealtad con la bondad de aquel a quien servía.\n\n—Si tú no piensas hacer nada —dijo finalmente Ryu—, entonces yo lo haré.\n\nDios se quedó inmóvil.\n\n—¿Qué has dicho?\n\n—No voy a quedarme observando cómo se destruyen. No voy a llamar justicia a lo que solo es obediencia. Si la creación necesita protección, alguien tendrá que dársela.\n\n—No tienes autoridad para decidir eso.\n\n—Tal vez no.\n\nRyu bajó brevemente la mirada, no en señal de sumisión, sino porque las palabras que seguían le pesaban más que cualquier orden.\n\n—Pero tampoco necesito tu permiso para saber que están sufriendo.\n\nLa expresión de Dios cambió. Ya no había paciencia en ella. Solo una ira contenida, fría y peligrosa.\n\n—Has confundido el conocimiento con la sabiduría —dijo—. Comer del fruto no te convierte en juez de mi voluntad.\n\n—No quiero juzgarte.\n\n—Entonces obedece.\n\nRyu no respondió.\n\nDios lo miró como si estuviera viendo a un extraño ocupando el lugar de alguien que conocía desde hacía incontables eras.\n\n—Vete —ordenó.\n\nRyu inclinó la cabeza apenas. No hizo una reverencia profunda. Tampoco discutió.\n\nSalió de la estancia con la certeza de que aquella conversación no había terminado realmente. Solo había llegado al punto en que ninguno de los dos podía fingir que seguían hablando de lo mismo.\n\n\nX — LA DECISIÓN\n\nEl reino angelical continuó con sus actividades.\n\nLos ángeles cumplieron sus funciones. Las jerarquías mantuvieron el orden. En el reino terrenal, los humanos siguieron levantando sus casas, celebrando ceremonias, luchando por sus tierras y buscando maneras de sobrevivir. Desde lejos, nada parecía haber cambiado.\n\nPero para Ryu el universo ya no era el mismo.\n\nRegresó una última vez al balcón desde el que, mucho tiempo atrás, había contemplado el silencio del Primer Reino y se había preguntado si aquello sería todo. Entonces deseaba que la existencia se expandiera, que aparecieran nuevas voces y que algo pudiera llenar el vacío.\n\nAhora esas voces existían.\n\nY algunas pedían ayuda.\n\nRyu apoyó las manos sobre la baranda. El resplandor del reino terrenal se extendía ante él. Vio los ríos, los bosques, las montañas y las ciudades humanas. No podía distinguir los rostros a aquella distancia, pero ya no necesitaba verlos para recordar que estaban allí.\n\nEl fruto no le había dado todas las respuestas.\n\nNo sabía cómo terminarían los conflictos. No sabía cuántas veces fracasaría al intentar ayudar. Ni siquiera sabía si su decisión tendría algún efecto duradero.\n\nPero había algo que sí sabía.\n\nNo quería volver a ser un espectador.\n\nHabía servido a Dios porque creía que su autoridad existía para proteger la creación. Había permanecido a su lado porque confiaba en que ambos compartían un propósito. Ahora sabía que no podía sostener esa confianza a costa de abandonar todo aquello que había jurado proteger.\n\nRyu cerró los ojos.\n\nPor primera vez, su lealtad no estaba dirigida hacia un trono.\n\nEstaba dirigida hacia las vidas que existían debajo de él.\n\nCuando los abrió, el mundo seguía siendo inmenso. Las dificultades seguían ahí. El dolor no había desaparecido por el simple hecho de que él lo hubiera comprendido.\n\nSin embargo, ya no estaba dispuesto a apartar la mirada.\n\nEn algún lugar del palacio, Dios observaba los mismos dominios y esperaba que su servidor recuperara el juicio. Creía que aquella insubordinación podía corregirse con una orden más severa. Todavía no comprendía que Ryu no estaba buscando una posición más alta, ni pretendía ocupar su trono.\n\nHabía comenzado a elegir por sí mismo.\n\nY esa elección era precisamente lo que Dios no estaba dispuesto a tolerar.\n\n\nFIN DEL CAPÍTULO 2\n\n«El conocimiento no le entregó a Ryu el poder de cambiar el mundo. Le quitó, para siempre, la posibilidad de fingir que no veía cómo sufría».\n\nCONTINUARÁ…\n\nCapítulo 3: La caída del primer serafín.\n"
