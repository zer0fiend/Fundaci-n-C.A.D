   "n": 16,
   "title": "La llegada",
   "part": "p3",
   "text": "En alguna linea alterna creado tras \"El incidente\". . . .\nCapitulo-5 \"La llegada\"\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\nera un dia normal lleno de luz el sonido del mar los pajaros cantaban era un dia hermoso como cualquier dia normal.\nen un pueblo cercano a bahía de Krest, Russia, se corria el rumor de una criatura mendigar por los bosques, se decia aquella criatura era nueva.\njamas se le habia visto antes mendigar por aquellos bosques, tambien se hacian rumores que en lo profundo del bosque existian entidades magicas, (dragones, hadas, etc)\nnadie se atrevia entrar al bosque, no solo, asta que de la nada. \n\n-un chico aparentemente joven se veia de unos 18 años entro a un bar del pueblo, el chico media 1.62 era pelo castaño y piel casi blanca como la nieve, este entraria al bar para buscar informacion sobre aquella criatura que contaban los lugareños-\n\nmike: -este se acercaria al cantinero comprando un trago y despues preguntarle- oye. . . eh escuchado que hablan de una criatura unica jamas vista antes me gustaria informacion no importa el precio\n\nel cantinero: -este solo se rie del chico para despues verlo y responderle de una forma sarcastica como si lo quisiera humillar- Escuchen todos este chico quiere informacion de la \"criatura\" mistica del bosque\n\n-el bar se llenaria de risas para despues un amargo silencio-\n\nel cantinero: escucha niño el bosque no es para debiluchos como tu regresa a casa no queremos salgas lastimado\n\nmike: -este dejaria pagada la cuenta y se dirigiria a la salida con verguenza al ver todos se burlaron de el-\n\ntras esto no habia percatado la hora que era y que ya era muy noche, las calles de ese pueblo durante las noches solian ser muy solitarias ni un alma salia a esa hora.\n\nmike: -caminaria con el presentimiento de que algo lo acechaba entre las oscuras calles del pueblo en el que se encontraba-\n\nde entre las sobras saldria una figura bastante afeminada la cual llevaba tiempo siguiendo a mike, mike tras ver aquella figura penso era la criatura que decian los lugareños.\neste al no poder ver bien la figura saldria corriendo, esto no serviria de mucho pues aquella figura lo seguiria, tras unos 5 minutos de corres bajo el frio de la nieve este resbalaria ya esperando su final.\n\n???: -aquella figura se detiene frente a el y lo mira-\n\nmike: -asustado sin saber que hacer en el piso se pondria a rezar esperando un milagro-\n\n???: oye tranquilo no soy un moustro para matarte. Escuche buscas a la criatura no es asi? me enojo ver al cantinero que te humillara asi, yo te ayudare me llamo Rize mucho gusto \n-esta le extenderia la mano a mike esperando que le correspondiera-\n\nmike: -al escuchar la voz de rize este se tranquiliza y abre los ojos para darle la mano y levantarse- O-oye Gracias! m-me llamo mike mucho gusto, y si busco a la criatura jaja\n\nrize: -le sonrie a mike- genial! ven vamos a una posada te vas a congelar si te quedas afuera en el camino hablamos de la criatura\n\nmike: -acierta con la cabeza y se sigue a rize-\n\ntras el camino rize casi no hablo mucho fue asta llegar a la posada despues de que mike se cambiara para no morir por congelacion que empezarian a platicar detalladamente\n\nrize: y bien querias saber de el no?\n\nmike: SI! . . . perdone es que lo llevo buscando mucho tiempo. . . usted sabe si es real?\n\nrize: -esta acierta con la mirada- sip es real el se encuentra en lo profundo del bosque. pero casi nadie sobrevive, apenas mi compañero y yo logramos salir con vida de ahi.\n\nmike: recuerdas como era \"eso\"¿? \n\nrize: pues era alto, su creo era cabello era blanco o como un gris muy claro, sus ojos eran negros completamente y parecia salir un liquido negro de ellos tambien no estoy seguro si era una especie de disfras o algo asi pero era completamente negro.\n\nmike: ya veo. . . (si que cambiaste mucho) y recuerdas algo mas¿?\n\nrize: lo ultimo que recuerdo al entrar es que cuando ibamos de salida esa cosa parecia sobre humana definitivamente no es humano o animal es algo mayor a eso\n\nmike: crees mañana me puedas llevar a donde lo viste por ultima ves¿?\n\nrize: claro con mucho gusto, solo debo hacer una llamada y nos vemos mañana a las 12 en la calle ###### vale?\n\nmike:gracias bueno a dormir mañana nos vemos\n\nrize: asta mañana mike que duermas bien\n\nen la mañana rize no estaria en la habitacion habria salido desde mas temprano, seguramente a ver a la llamada que se refirio a mike antes de dormir. . . \n\nmike: -este se despierta mira la hora en un reloj que habia en su habitacion y ve que son las 11:40- (DIOS SE ME HARA TARDE DEBO ESTAR A LAS 12 DONDE AYER RIZE ME MATARA)\n\ntras pensarlo se prepara y saldria a la calle donde acordaron ayer para darse cuenta que llego 10 minutos antes, tras darse cuenta este decide sentarse a esperar, el tiempo pasa dan las 12\na lo lejos se veia dos siluetas ir hacia donde mike\n\nRize: MIKE!!!! -esta le grita a mike a lo lejos junto a alguien mas que no lograba reconocer pero le era familiar a mike-\n\nmike: -este va hacia con ella para quedar frente a frente con la otra persona- hey! h-hola tu eres¿?\n\nrize:oh si lo siento, se me olvido mike el es zukushimo, zukushimo el es mike el que te venia hablando\n\nzukushimo: -este miraria a mike de arriba hacia abajo con una cara de decepcion- Rize te soy honesto no creo dure mucho ahi adentro, miralo \n\nmike: -este se averguenza un poco al verse intimidado-\n\nrize: oye dejalo que tu eras igual hace unos años, bueno mike vamos -esta le da la mano a mike-\n\nmike: -corresponde la mano de rize-\n\ntras agarrar a mike estos 3 se dirigen al bosque donde se vio por ultima ves a la \"criatura\" pero no todo seria color de rosas,pues al llegar la entrada al bosque estaria bloqueada \npor unos cordones de peligro y algunos letreros de no acercarse temporada de osos claramente ignoraron todas las advertencias y entrarian al bosque\ntras un largo rato de caminar zukushimo detendria a rize y mike diciendoles que esten atentos\n\nzukushimo: estamos cerca el olor a sangre y carne podrida aumenta.\n\nzukushimo sigue avanzando pero un toque de sigilo en su caminar rize y mike solo se miran entre si aciertan y siguen los pasos de zukushimo\ntras unas 2 horas de seguir a zukushimo estarian en una parte muy profunda del bosque a lo lejos se veia una vieja y desgastada instalacion\ntotalmente llena de grietas y nieve debido a la tormenta que estaba en aquel momento zukushimo se queda alado de la puerta de la instalacion\nesperando que rize y mike entren primero, al poco tiempo estos entran y detras de ellos entra zukushimo, el lugar era muy oscuro casi no se podia ver nada\nzukushimo saca unas linternas de su mochila y le da una a cada uno el señala las escaleras que bajan al subterraneo\n\nzukushimo: una vez que bajemos no habra vuelta atras estaremos atrapados por esa cosa sera mejor ir con cuidado para evitar bajas.\n\nrize: -ella va delante de todos con un cuchillo que saco del bolsillo y desciende lentamente las escaleras-\n\nen el tunel que baja se podia ver las grietas de que la instalacion lleva años sin mantenimiento conforme van bajando se puede ver arañazos en las paredes del tunel\nal igual que se ve sangre y huesos de antiguos exploradores, a medida que casi llegan al final de la bajada el olor a sangre y carner putrefacta\nse volvia mas fuerte al igual que la cantidad de huesos y pedazos de cuerpos se hacia mas presente, despues de un rato de bajar se ve una luz parpadear\nellos llegan al final de la bajado descubriendo un enorme laboratorio abandonado el musgo y enredaderas al igual que una gran parte ya hacia\ncubierta de tierra por derrumbes del techo hacian que el laboratorio se viera muy descuidado, con fiome se adentraron mas en el encontraron\nvarias capsulas unas en buen estado otras medio dañadas y otras rotas al igual que varias jaulas, jeringas y herramientas de tortura\nlas cuales estaban llenas de sangre seca, decidieron seguir adentrandose en el laboratorio y al poco tiempo encontraron prisiones con numeros romanos en ellas\nescritas,la mayoria de las celdas estaban abiertas dentro de ellas solo habia sangre, ratas y esqueletos humanos y de animales\nla ultima celda llamada \"X\" estaba cerrada y al otro lado de la habitacion se escuchaba ruidos extraños de por debajo de la puerta solo se veia un charco\nde sangre salir de ella, la sangre era fresca se podia escuchar como goteaba, el trio trataria de empujar la puerta pero los intentos fueron inutiles\ndeciden regresar a donde estaban las capsulas antes pero ahora algo estaba fuera de su lugar las capsulas una de las que estaban aun completa\nestaria rota y de ella estaria goteando un liquido extraño, el aire se lleno de una espesa niebla, el ambiente se puso tenso todos sentian que algo los observa desde las sombras\n \nzukushimo: ponganse de espaldas todos nos esta cazando a todos ya sabe que estamos aqui\n\nrize y mike se podrian en contraespalda a zukushimo todos preocupados y tensos por el ambiente, de entre las sombras se veria una figura\nbastante larga midiendo aproximadamente unos 2.10M de altura, la figura era muy delgada pero aun asi el brillo de sus afiladas garras se podia\nver atraves de la espesa niebla, ellos se quedarian viendo a la figura con preocupacion se mirarias despues entre ellos.\n\nzukushimo: debemos separarnos tratar de despitar a la criatura pero debemos tener cuidado no sabemos que tan rapida o letal sea\n\nrize: -esta mira a zukushimo y afirma con la cabeza- la mejor opcion es tratar de despitar a esa cosa como dices y salir de aqui lo mas pronto posible\n\nellos miran a mike y luego se miran entre si\n\nzukushimo: mike tu quedate aqui trata de ocultarte de esa cosa y hagas lo que hagas no vallas tras el\n\nmike: -este suspira y se quedaria escondido atras de uno de las capsulas esperando que zukushimo y rize encuentren la manera de salir de aqui-\n\nla figura veria como cada uno se va por un camino distinto por lo que empezaria a perseguir a zukushimo primero, tras un largo rato de silencio completo\nrize iria para donde fue zukushimo pero esta solo desaparece entre la niebla, mike quien ya se habia dado cuenta que ambos tardaron demasiado \nsaldria de su escondite y iria por donde vio por ultima vez a Rize y Zukushimo, este se adentraria mas en las instalaciones del laboratorio\nhasta encontrar una linterna tirada en el piso.\n\nMike: -toma la linterna y apunta hacia delante viendo si podria ver algo al final de la habitacion- esta espesa niebla no deja ver nada, ademas el lugar es enorme podrian haberse perdido\n\npenso mike pero de la nada algo empezaria a gotear en el hombro de mike, este temblando de miedo y sabiendo que era lo que estaba goteando mira\nhacia arriba, este solo traga saliva y deja salir un suspiro de alivio solo era un grieta que se habia formado hace poco por donde goteaba agua\nmike se levanta de donde estaba y decide adentrarse por el largo pasillo donde habia encontrado la linterna, al poco timepo de estar caminando\nescucharia pisadas cerca de el por lo que este se oculta en un casillero cercano, este trata de mantener su respiracion al ver la criatura \npasar por enfrente de el, en un suspiro de alivio sale del casillero al ver que la criatura se fue y sigue su camino\nllega al final de la habitacion donde se quedaria horrorizado al ver a Rise empalada contra la pared, el pecho lleno de sangre y debajo de ella\nun enorme charco de sangre esta mira a mike con su ultimo alienta y le indica que se acerque\n\nmike: -se acerca con los ojos llorosos- q-que paso? y zukushimo?\n\nrize: -tose un poco de sangre y con lo poco que le queda de vida le dice- se quedo atrapado detras de la celdas entro a una para ocultarse ve y salvalo. . . \n\nrize no sobrevivio a la cazeria y murio frente a mike, este decide ir hacia las celdas donde le dijo rize que zukushimo estaba encerrado\ny tal y como dijo al momento que zukushimo escucho las lagrimas de mike este le grita por ayuda, mike se limpia las lagrimas y junto a zukushimo\nempujarian la puerta hacia adentro para liberarlo de ahi, zukushimo veria la mirada perdida y traumada de mike, a lo que este lo abraza\nbuscando tranquilizarlo.\n\nzukushimo: ella, no lo logro, verdad?\n\nmike: -este rompe en llanto mientras acierta con la cabeza-\n\nzukushimo: ya veo, lo importante es salir de aqui ahora. . . \n\nambos salen de la zona de celdas y se dirigen hacia las escaleras que los trajeron aqui abajo, y justo antes de llegar frente a las escaleras\nestaria la criatura parada mirando fijamente hacia ellos con una sonrisa inhumana totalmente cubierta de sangre y restos humanos.\n\nzukushimo: definitivamente esa cosa no es humana. . ."
  },
  {
   "id": "c17",
   "n": 17,
   "title": "El encuentro",
   "part": "p3",
   "text": "Continuacion tras \"La llegada\"\nCapitulo-6 \"El encuentro\"\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\nRecordatorio: \"ambos salen de la zona de celdas y se dirigen hacia las escaleras que los trajeron aqui abajo, y justo antes de llegar frente a las escaleras\nestaria la criatura parada mirando fijamente hacia ellos con una sonrisa inhumana totalmente cubierta de sangre y restos humanos.\n\nzukushimo: definitivamente esa cosa no es humana. . . \"\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\n\nZukushimo: Quedate atras mike, no sabemos que es capaz.\n\naquella figura se quedaria totalmente quieta frente a la salida del laboratorio abandonado mirando fijamente a mike con una sonrisa\npeculiar, mike algo asustado se pondria detras de Zukushimo\n\nMike: Esa cosa no deja de mirarme, que es lo que busca.\n\nZukushimo: -voltea a ver a Mike- es claro lo que busca, te busca a ti por alguna razon que aun desconocido\n\nMike: Espera me busca a mi? por que? no tiene sentido alguno\n\nZukushimo: si algo aprendi es que nada en este universo tiene sentido, tal vez el te conoce? no lo se, pero debera pasar sobre mi\nsi es que te quiere matar\n\nla figura que hacia inmovil empezaria a moverse hacia ellos arrastrando las alargadas garras por las paredes sacar chispas de ellas"
  },
  {
   "id": "c21",
   "n": 21,
   "title": "El enfrentamiento",
   "part": "p4",
   "text": "Capítulo 10: El Enfrentamiento\n\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\n\nEn un mundo que había perdido su color bajo la sombra de la destrucción, la Ciudad del Horizonte se alzaba como un monumento a la decadencia. \nLas calles, una vez bulliciosas, ahora estaban desiertas, resonando solo con el eco de una tensión que crecía a cada segundo. \nLas nubes densas se arremolinaban en el cielo, formando un vórtice ominoso que presagiaba el choque inminente de dos poderes inconmensurables.\nZero caminaba entre las ruinas, su figura envolviéndose en una luz dorada que contrarrestaba la oscuridad creciente. \nCon cada paso, la gravedad parecía cambiar, como si el mundo mismo se inclinara ante su presencia. Pero en su rostro no había arrogancia, \nsino una mezcla de tristeza y resolución. Sus pensamientos eran un torbellino de recuerdos: las risas compartidas, las noches de promesas, \ny finalmente, el día en que todo se desmoronó. Este no era solo un enfrentamiento entre dos titanes; \nera la culminación de una historia de amor que se había torcido hasta convertirse en tragedia.\nA lo lejos, una risa fría rompió el silencio, resonando como un cuchillo que cortaba la calma antes de la tormenta. \nZwitt emergió de las sombras, su figura envuelta en un aura de oscuridad pura, con el monstruo legendario \nMazikar flotando detrás de él. Sus ojos, antaño cálidos y llenos de amor, ahora eran pozos de malevolencia, un reflejo del caos que había abrazado.\n\"Zero... nunca pensé que llegaríamos a esto,\" dijo Zwitt, con una voz que vibraba entre la nostalgia y el odio. \n\"¿Todavía crees que puedes salvar este mundo con tu luz? Este mundo está podrido, y tú, más que nadie, deberías saberlo.\"\nZero se detuvo, su mirada fija en Zwitt. Un destello cruzó sus ojos, y en un instante, \nla katana del clan Lost Night apareció en su mano, irradiando una luz cegadora que contrastaba con la oscuridad que emanaba de Zwitt. \"Zwitt,\" \nsu voz era firme, aunque teñida de dolor, \"no deseo hacerte daño... pero no puedo permitir que destruyas todo lo que juré proteger.\"\nLa tensión en el aire era palpable, el mundo mismo parecía contener el aliento. Y entonces, \nen un abrir y cerrar de ojos, Zwitt desató su ataque. Con un movimiento apenas perceptible, \nlanzó su técnica de corte maldito, una ráfaga de tajos invisibles que rasgaban el aire, \napuntando directamente a Zero. Pero antes de que los cortes pudieran alcanzarlo, \nla katana de Zero se movió en un arco perfecto, interceptando los ataques y desintegrándolos en chispas que iluminaban la oscura ciudad.\nMazikar rugió desde lo alto, descendiendo en picado con una furia descomunal, \nsus garras rodeadas de energía maldita. Pero se encontró de frente con una barrera invisible que lo detuvo en seco. \nZero había desplegado su técnica del Infinito, un campo que negaba cualquier ataque al detenerlo en una distancia infinita de su cuerpo. \nEl monstruo retrocedió, furioso, pero la barrera se mantuvo firme, impenetrable.\nZwitt sonrió con amargura, una sombra de lo que solía ser. \"¿Recuerdas cuando solíamos entrenar juntos? Siempre te admiré, Zero. Pero ahora, \nese poder que tanto respetaba es lo que debo destruir.\" Su voz, aunque llena de determinación, cargaba el peso de su antigua vida, \nde lo que había dejado atrás.\nSin previo aviso, Zwitt desapareció en un destello de velocidad, reapareciendo justo frente a Zero, \nlanzando una serie de cortes que desafiaban la lógica y el espacio. Pero Zero, con una calma inhumana, interceptó cada golpe, \nsu katana moviéndose como un rayo de luz en la oscuridad.\nEl suelo se quebró bajo sus pies, las estructuras colapsaron a su alrededor, y la ciudad, ya herida, \ncomenzó a desmoronarse bajo la presión de sus poderes. Zero retrocedió, parando un ataque tras otro, \nmientras Zwitt continuaba su embestida con una intensidad que solo podía nacer del dolor y la furia acumulada.\nMazikar, viendo la oportunidad, lanzó un ataque devastador, su cuerpo mutando y adaptándose para romper la barrera de Zero. \nLa criatura maldita, ahora con una fuerza multiplicada, golpeó la defensa de Zero con una energía que distorsionaba el espacio a su alrededor, \ncreando grietas en la barrera del Infinito.\n\"¡Mazikar, destrúyelo!\" gritó Zwitt, canalizando su propio poder en el monstruo. \nLa entidad evolucionó una vez más, su cuerpo se expandió, su aura se intensificó, \nhasta convertirse en una abominación imposible de describir con palabras. Un ser que podía destrozar montañas con solo existir.\nZero, consciente del peligro, supo que debía actuar rápidamente. Con un suspiro profundo, \ncerró los ojos y concentró toda su energía en su katana. La luz que emitía comenzó a intensificarse, \ncada vez más brillante, hasta que se convirtió en un faro que iluminó toda la ciudad. El Infinito comenzó a contraerse, \nenvolviéndolo en una singularidad de energía pura, un punto donde todo el poder se concentraba.\nZwitt observó, y por primera vez en mucho tiempo, sintió algo que creía haber olvidado: temor. \n\"No... no puede ser...\" murmuró, mientras Mazikar, en su forma final, se lanzaba hacia Zero con un rugido que sacudió el mund\nEl choque fue apocalíptico. La luz y la oscuridad colisionaron en una explosión de energía que rasgó el cielo, \npartiendo la tierra y disolviendo todo a su alrededor en un remolino de pura fuerza. \nEl mundo mismo parecía a punto de desintegrarse bajo la presión de sus poderes combinados. El sonido de la batalla se silenció, \ncomo si el universo contuviera la respiración en espera del resultado.\nCuando el polvo y la luz finalmente se disiparon, todo lo que quedó fue un silencio ensordecedor. \nEl vasto cráter que reemplazaba a la Ciudad del Horizonte era el único testigo de la batalla épica que había tenido lugar. \nZero se mantenía en pie, su katana brillando débilmente mientras el viento barría los restos de la devastación. A sus pies, \ndonde antes estaban Zwitt y Mazikar, no quedaba nada, solo cenizas y el eco de un nombre susurrado por el viento.\nZero miró el horizonte, sus ojos reflejando el vacío de lo que acababa de perder. En su corazón, la victoria se sentía vacía, \nteñida de la melancolía de un amor que no pudo salvar. Sin embargo, sabía que mientras él siguiera de pie, la luz no se extinguiría. \nCon un último vistazo al horizonte, Zero dio un paso adelante y desapareció en un destello, dejando tras de sí solo una leyenda.\n Una historia que sería contada como un recordatorio del día en que la luz y la oscuridad, una vez unidas por amor, \n colisionaron en una batalla que sacudió los cimientos del mundo.\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-"
  },

   "id": "c23",

   "title": "La última transmisión",

   "text": "El arcoíris después de la tormenta\n\nCapítulo 15: La última transmisión\n\n❦\n\nLa lluvia todavía no había comenzado, pero el mundo ya tenía el aspecto de algo que estaba a punto de llorar.\n\nEl campo de batalla se extendía frente a Zero como el recuerdo de una pesadilla demasiado larga. Había humo entre los árboles, piedras partidas, armas abandonadas y marcas oscuras sobre la tierra. A lo lejos, las últimas luces que separaban los reinos parpadeaban con una debilidad casi imperceptible. El cielo parecía una herida abierta: no era de día ni de noche, sino una mezcla extraña de ambos, como si el mundo no supiera qué hora debía ser después de todo lo que había ocurrido.\n\nLos gritos habían cesado. Eso era lo que más le inquietaba.\n\nDurante horas había escuchado órdenes, explosiones, plegarias, amenazas y nombres pronunciados con desesperación. Ahora solo quedaban el viento y el crujido de las cosas que terminaban de caer. Los sobrevivientes se reunían lejos de la brecha, ayudándose unos a otros, comprobando quién seguía respirando. Los cazadores estaban vivos. Los suyos estaban vivos. Sage estaba vivo. Zwitt también.\n\nZero había conseguido aquello por lo que llevaba tanto tiempo luchando.\n\nY, aun así, no podía sentirse victorioso.\n\nSe apoyó contra una roca para recuperar el aliento. El movimiento le arrancó un dolor agudo desde el costado hasta el hombro. Bajó la mirada. Su ropa estaba desgarrada, una de sus manos no dejaba de temblar y había sangre en sus dedos. No necesitaba que nadie se lo explicara: había llegado demasiado lejos. Su cuerpo llevaba un buen rato intentando advertírselo, pero él había aprendido a ignorar las advertencias hacía mucho tiempo.\n\n—Vaya manera de terminar el año —murmuró.\n\nIntentó reír. Solo consiguió una exhalación rota.\n\nA unos pasos, sobre una piedra plana, descansaba una pequeña grabadora. La carcasa estaba golpeada y la pantalla tenía una grieta que cruzaba los números. Seguía funcionando porque Zero la había reparado tantas veces que ya no recordaba cuáles de sus piezas pertenecían al aparato original. La había usado para guardar instrucciones, estrategias, voces de reuniones y tonterías que Sage decía cuando creía que nadie lo escuchaba. También conservaba grabaciones que nunca se había atrevido a reproducir.\n\nLa tomó con cuidado.\n\nNo sabía cuánto tiempo le quedaba. No sabía si tendría fuerzas para volver a levantarse, si alcanzaría a despedirse de todos o si las palabras que tenía guardadas desde hacía años acabarían muriendo dentro de su garganta. Pero todavía podía hacer una cosa. Podía dejar una voz. Algo que no dependiera de que sus manos siguieran sujetando una espada.\n\nEncendió la grabadora.\n\nUn pequeño indicador rojo apareció en la pantalla.\n\n—Registro final… —comenzó, y se detuvo—. No. Eso suena demasiado dramático.\n\nMiró el aparato durante unos segundos. Su reflejo apenas se distinguía en el cristal roto.\n\n—Aunque supongo que ya no importa.\n\nSe sentó con la espalda contra la roca. Respiró despacio. Cada inhalación era una negociación con el dolor.\n\n—Es viernes treinta y uno de diciembre. Son las once con cuarenta y siete. Si esta grabación llegó a alguien, significa que no pude decir todo esto en persona. O que fui un cobarde y preferí hablarle a una máquina antes que mirar a quienes quiero a los ojos. Probablemente un poco de ambas cosas.\n\nUna pausa. El viento rozó el micrófono.\n\n—Mi nombre es Zero. Fui líder de Lost Night. Fui maestro, compañero, amigo… o al menos lo intenté. Si están escuchando esto, no quiero que conviertan lo que pasó hoy en una leyenda sobre alguien invencible. No fui invencible. No lo soy. Tuve miedo. Me equivoqué. Corrí cuando debía quedarme y me quedé cuando ya no tenía fuerzas. Hubo días en los que confundí ser fuerte con no pedir ayuda. Y hubo otros en los que sonreí para que nadie notara que estaba a punto de derrumbarme.\n\nSe quedó callado. El indicador rojo siguió encendido.\n\n—No quiero que recuerden solamente la parte en la que levantaba la espada. Recuerden también al idiota que se quedaba despierto para comprobar que todos hubieran vuelto, al que fingía no escuchar sus discusiones, al que se quejaba cuando le cambiaban los planes y después terminaba ayudando de todos modos. Recuerden que me gustaba verlos juntos. Que, aunque nunca fui bueno diciéndolo, cada uno de ustedes hizo que este lugar se sintiera como un hogar.\n\nCerró los ojos.\n\nPor un instante, el campo de batalla desapareció. Volvió a escuchar risas en un lugar seguro, pasos acercándose por un pasillo, una voz que lo llamaba desde lejos. Recordó las noches en las que todavía creía que todo podía arreglarse si aguantaba un poco más.\n\nEntonces oyó otra voz.\n\n—Siempre haces eso.\n\nZero abrió los ojos.\n\nKitty estaba junto a él.\n\nNo apareció con un destello ni con el estruendo de una invocación. Simplemente estaba allí, como tantas otras veces: una presencia que el mundo había dejado atrás, pero que se negaba a desaparecer de la vida de Zero. La luz atravesaba suavemente su figura. Conservaba la silueta de un chico gato: las orejas felinas, la cola y aquellos rasgos que lo habían distinguido en vida. Ahora todo parecía hecho de una claridad tenue; los bordes de sus orejas se deshacían con el viento y su cola se volvía casi transparente por momentos. Aun así, sus ojos conservaban aquella expresión que Zero habría reconocido incluso en medio de miles de almas.\n\nKitty era un espíritu. No había dejado de ser un chico gato al morir; simplemente, su existencia pertenecía ahora a la raza de los espíritus. Zero lo sabía. Había aprendido a vivir con esa verdad, aunque nunca había conseguido acostumbrarse a ella.\n\nKitty inclinó la cabeza hacia la grabadora.\n\n—¿Vas a despedirte de todos menos de ti mismo?\n\nZero bajó la mirada. Una sonrisa cansada le cruzó el rostro.\n\n—No sabía que los espíritus podían ser tan entrometidos.\n\n—Y yo no sabía que los vivos podían ser tan tercos.\n\n—Entonces los dos hemos aprendido algo.\n\nKitty se sentó a su lado. La roca no crujió bajo su peso. No podía hacerlo. Aun así, Zero sintió el calor conocido de su cercanía; quizá no era calor verdadero, quizá era su memoria intentando protegerlo de la ausencia. Ya no le importaba distinguirlo. La punta de la cola espiritual de Kitty se curvó junto a él, casi como si todavía pudiera rozarle la mano.\n\n—Te escuché desde el principio —dijo él—. Estás intentando dejar instrucciones para que nadie se atreva a llorarte.\n\n—No puedo controlar eso.\n\n—No. Pero estás intentando controlarlo de todas formas.\n\nZero soltó el aire lentamente. La grabadora seguía registrando.\n\n—No quiero que sufran por mi culpa.\n\n—Van a sufrir porque te quieren. No puedes pedirles que conviertan el amor en algo cómodo para ti.\n\nÉl no respondió.\n\nKitty lo observó con una ternura que dolía más que cualquier herida. Hubo un tiempo en que Zero habría dado cualquier cosa por verlo caminar a su lado bajo la luz del sol, por escucharle reír sin que el sonido pareciera venir de otra parte, por discutir con él sobre cosas insignificantes y luego reconciliarse antes de que terminara el día. Había imaginado futuros enteros en los que Kitty estaba presente. Después lo perdió. Y cuando el mundo le ofreció la posibilidad de volver a escuchar su voz, aunque fuera como un espíritu, Zero aceptó sin preguntar cuánto iba a doler.\n\nLo amó cuando estaba vivo. Lo amó cuando tuvo que aprender a pronunciar su nombre sin esperar una respuesta. Lo amó cuando volvió a encontrarlo en aquella forma imposible. Y lo amaba todavía, con un sentimiento que el tiempo no había reducido; solo había cambiado de lugar.\n\n—A veces pienso que no debí dejarte ir —susurró.\n\n—No me dejaste ir, Zero. No eras dueño de mi vida ni de mi muerte.\n\n—Pude haber hecho más.\n\n—Siempre piensas eso cuando alguien se va.\n\n—Porque siempre queda algo que no dije.\n\nKitty bajó los ojos hacia sus manos ensangrentadas.\n\n—Entonces dilo ahora.\n\nZero tragó saliva. Miró la grabadora y luego a Kitty.\n\n—Te extrañé. Incluso cuando estabas cerca, te extrañé. Extrañé la vida que no pudimos tener. Extrañé todas esas cosas pequeñas que parecían tan seguras cuando todavía creía que habría tiempo. Quería verte cumplir tus sueños. Quería que tuvieras días aburridos, días felices, días en los que no tuvieras que preocuparte por nadie. Quería poder elegirte sin que el mundo nos arrancara siempre algo a cambio.\n\nSu voz se quebró.\n\n—Y perdóname por seguir hablando de ti como si todavía pudiera arreglar lo que pasó.\n\nKitty acercó la mano a su rostro. Sus dedos no llegaron a tocarlo del todo, pero Zero inclinó la cabeza hacia ellos como si el contacto fuera real.\n\n—No tienes que arreglar mi final para que lo que vivimos haya sido verdadero —dijo él—. Me amaste. Yo te amé. Eso ocurrió. No desaparece porque no hayamos tenido todo el tiempo que queríamos.\n\nÉl apretó los labios.\n\n—No quería que nuestra historia terminara así.\n\n—Nadie quiere despedirse.\n\n—Yo quería quedarme contigo.\n\n—Y yo quería quedarme contigo. Pero amar a alguien no significa pedirle que deje de vivir cuando nosotros ya no podemos hacerlo.\n\nLa frase quedó entre ambos, silenciosa y pesada.\n\nZero volvió a mirar el indicador rojo. Durante un momento pensó en detener la grabación. No quería que los demás escucharan aquello. Kitty había sido una parte de su vida que casi siempre guardaba en secreto, no porque se avergonzara de él, sino porque no soportaba que alguien tratara su recuerdo como una historia triste que pudiera resumirse en unas cuantas palabras.\n\nPero quizá había llegado el momento de dejar de esconder que también había sido amado.\n\n—Hay alguien más a quien debo pedir perdón —dijo.\n\nKitty asintió, como si ya supiera el nombre.\n\n—Zwitt.\n\nZero apoyó la cabeza contra la roca.\n\n—Cuando aquel espíritu apareció, debí protegerlo. Debí quedarme a su lado, enfrentar lo que fuera necesario. Pero tuve miedo. Elegí huir y me convencí de que era lo correcto, de que podría volver después, de que habría otra oportunidad. Siempre hay otra oportunidad… hasta que no la hay.\n\nSe frotó los ojos con el dorso de la mano. El gesto solo extendió una mancha de sangre sobre su mejilla.\n\n—No fue culpa suya. No quiero que cargue con una decisión que tomé yo. Si llega a escuchar esto, quiero que sepa que nunca estuve enojado con él. Nunca. Mi arrepentimiento no es una deuda que tenga que pagar. Es mío. Yo debí hacerlo mejor.\n\nKitty permaneció en silencio. No intentó consolarlo con una respuesta sencilla. Tal vez por eso Zero pudo continuar.\n\n—Y Sage… —dijo después de un momento—. Sage tiene que dejar de creer que ser mi alumno significa convertirse en mí. No quiero otro Zero. Ya hubo suficiente con uno. Tiene que encontrar su propia manera de proteger a los demás, incluso si se equivoca, incluso si tiene miedo. Sobre todo si tiene miedo. Que no confunda mi confianza con una orden de ser perfecto.\n\nUna sonrisa pequeña le suavizó el rostro.\n\n—Tiene potencial. Muchísimo. A veces más del que él mismo alcanza a ver. Todavía le falta entrenamiento, paciencia y aprender cuándo cerrar la boca. Bueno… eso último quizá no se lo enseñé muy bien.\n\nKitty soltó una risa suave. Fue breve, pero Zero la recibió como si alguien hubiera encendido una luz en una habitación que llevaba años cerrada.\n\n—Eso sí que es culpa tuya —dijo él.\n\n—Lo sé. Tengo demasiados defectos como para dejarle todos mis métodos.\n\n—Por fin dices algo sensato.\n\nLos dos guardaron silencio. A lo lejos, alguien llamó a un compañero. Una voz respondió. Los sonidos eran débiles, pero significaban que todavía había personas buscando a otras personas. Todavía había manos tendidas. Todavía quedaba mundo.\n\nZero miró hacia donde se encontraban los sobrevivientes.\n\n—Lo conseguimos —dijo.\n\nNo lo dijo con orgullo. Lo dijo con incredulidad.\n\nLas fuerzas que habían desgarrado la frontera entre los cuatro reinos comenzaban a apagarse. La brecha ya no rugía. Los espíritus podrían regresar a su plano; los demonios, al lugar del que habían escapado; los ángeles, a su deber de cuidar el mundo desde las alturas. No sería una paz perfecta. Ninguna paz lo era. Quedarían ruinas, recuerdos, heridas y personas que tendrían que aprender a vivir después de la guerra. Pero ya no tendrían que hacerlo con el cielo partiéndose sobre sus cabezas.\n\n—Todos van a volver a casa —murmuró Zero—. Eso era lo que quería.\n\n—¿Y tú? —preguntó Kitty.\n\nÉl tardó en contestar.\n\n—No lo sé.\n\n—Sí lo sabes.\n\nZero miró el cielo. La luz temblorosa sobre la brecha se apagó un poco más.\n\n—Creo que mi camino termina aquí.\n\nDecirlo en voz alta fue distinto a pensarlo. No hubo un trueno ni una señal del destino. El mundo no se detuvo para escuchar. Solo apareció una calma extraña, como si una parte de él hubiera dejado de luchar contra una verdad que su cuerpo conocía desde hacía rato.\n\n—Tengo miedo —confesó.\n\nKitty no apartó la mirada.\n\n—Lo sé.\n\n—Pensé que, llegado el momento, sería diferente. Que sentiría paz. Que no me importaría. Pero sí me importa. Quiero ver otro amanecer. Quiero volver a escuchar sus voces. Quiero tener una oportunidad de hacer las cosas bien. Quiero… —Se interrumpió para respirar—. Quiero quedarme.\n\n—Entonces no finjas que no deseas vivir. Aceptar que este puede ser tu final no significa que tengas que dejar de querer la vida.\n\nZero cerró los ojos.\n\n—¿Y si no estoy listo?\n\n—Nadie está listo para despedirse de todo lo que ama.\n\n—No quiero que me recuerden así.\n\n—No podrás elegir cada recuerdo que dejes en los demás. Pero puedes elegir qué haces con el tiempo que todavía tienes.\n\nAbrió los ojos y lo miró. Kitty ya no parecía una aparición triste ni una sombra que lo acompañara desde el pasado. Por un instante volvió a ser el chico al que había amado: no porque hubiera recuperado su vida, sino porque el amor no necesitaba disfrazarse de milagro para seguir existiendo.\n\n—¿Vas a estar ahí? —preguntó él—. Cuando llegue el momento.\n\n—He estado aquí todo este tiempo.\n\n—No es lo mismo.\n\n—No —aceptó él—. No lo es. Pero no voy a mentirte para hacer más fácil esta despedida.\n\nZero asintió. Esa honestidad también era una forma de ternura.\n\nVolvió a acercar la grabadora a su boca. Esta vez no intentó bromear.\n\n—A todos los que escuchen esto: no hagan de mi muerte una obligación. No tienen que demostrar que me quisieron sufriendo para siempre. No tienen que continuar una guerra en mi nombre, ni buscar culpables donde ya no hay nada que reparar. Si algo de lo que hice merece quedarse, que sea esto: que después de todo lo que nos pasó todavía puedan elegir cuidarse.\n\nSu voz era más baja, pero se esforzó por mantenerla firme.\n\n—Cuídense entre ustedes. No conviertan el dolor en una razón para lastimarse. No permitan que el poder, el miedo o el orgullo los convenzan de que alguien vale menos por ser diferente. Los cuatro reinos no necesitan otro vencedor. Necesitan aprender a vivir sin ponerse una espada en el cuello. Si mañana tienen la oportunidad de empezar de nuevo, háganlo. Aunque sea difícil. Aunque al principio parezca que nada ha cambiado.\n\nHizo una pausa.\n\n—Y si me extrañan, háganlo. No voy a pedirles que no lloren. Solo quiero que algún día puedan recordar algo de mí y sonreír sin sentir que me están traicionando.\n\nMiró hacia Kitty.\n\n—Hay alguien que no debería quedar reducido a una nota al margen de mi historia. Kitty. Si alguna vez escuchan su nombre en mis grabaciones, no lo recuerden únicamente como un espíritu. Fue un chico gato, alguien que vivió, que soñó, que se enfadó conmigo, que se rio de mis tonterías y que me quiso cuando yo todavía no sabía qué hacer con tanto cariño. Murió, y su existencia pasó a pertenecer a la raza de los espíritus, pero eso no borra al chico que fue ni todo lo que compartimos. Yo tuve la suerte de amarlo.\n\nKitty bajó la mirada. Su expresión se volvió frágil.\n\n—No quería que me olvidaran —continuó Zero—, pero tampoco quiero que me conviertan en una cadena. Ni a mí ni a él. Lo que vivimos fue nuestro. Fue real. Y merece descansar sin que nadie tenga que cargar con ello.\n\nLa grabadora emitió un chasquido. La batería estaba por agotarse.\n\nZero miró la pantalla. Las once y cuarenta y ocho.\n\n—Supongo que se acaba el tiempo.\n\n—El tiempo siempre se acaba —dijo Kitty—. Lo importante es qué hiciste con él.\n\n—No sé si hice suficiente.\n\n—Hiciste lo que pudiste con lo que eras. Y cuando entendiste que podías hacerlo mejor, lo intentaste. No eres todas tus decisiones equivocadas, Zero.\n\nÉl respiró con dificultad. Una gota de sangre cayó de su barbilla a la tierra.\n\n—Quería tener más tiempo contigo.\n\n—Yo también.\n\n—Quería tener más tiempo con ellos.\n\n—Lo sé.\n\n—Quería… —La voz se le deshizo—. Quería que esto no fuera una despedida.\n\nKitty se inclinó hacia él. Su frente quedó cerca de la suya, sin llegar a tocarla.\n\n—Entonces no desperdicies lo que queda intentando convertirlo en otra cosa.\n\nPor primera vez desde que había comenzado la batalla, Zero dejó de resistirse a llorar. No fue un llanto escandaloso. Apenas pudo contener el temblor de su respiración. Lloró por Kitty, por Zwitt, por Sage, por Lost Night, por todas las versiones de sí mismo que había abandonado en el camino. Lloró por el futuro que ya no iba a conocer y por las personas que tendrían que construirlo sin él.\n\nKitty permaneció a su lado.\n\nNo le dijo que todo estaría bien. No le prometió que despertaría en algún lugar mejor. No le ofreció una respuesta sobre lo que ocurría después de la muerte. Solo se quedó allí, compartiendo con él el silencio que tantas veces habían compartido cuando las palabras no alcanzaban.\n\nCuando Zero pudo hablar de nuevo, levantó la grabadora.\n\n—Última parte —susurró—. Si esto es lo último que pueden escuchar de mí, quiero que sepan que no me voy odiando al mundo. Estoy cansado. Estoy asustado. Hay cosas que lamento y personas a las que quisiera abrazar una vez más. Pero no me arrepiento de haberlos querido. No me arrepiento de haber intentado protegerlos. No me arrepiento de haber tenido una familia, aunque no siempre supiera cómo llamarla.\n\nMiró sus manos. Ya no le parecían las manos de alguien invencible. Eran solo manos cansadas, heridas, humanas.\n\n—No fui el más fuerte porque nunca pudiera caer. Si alguna vez fui fuerte, fue porque encontré motivos para levantarme. Y hoy, aunque quizá ya no pueda hacerlo, esos motivos siguen aquí. En ustedes.\n\nLa pantalla cambió a las once y cuarenta y nueve.\n\n—Sage, confío en ti. Zwitt, perdóname. No cargues con mis errores. Kitty… —Se detuvo. Su garganta se cerró alrededor de aquel nombre—. Kitty, gracias por haberme amado incluso cuando yo estaba convencido de que tenía que salvar a todos antes de permitirme ser feliz. Ojalá hubiéramos tenido más tiempo. Ojalá pudiera volver a escuchar tu voz sin tener que despedirme después.\n\nKitty sonrió con tristeza.\n\n—Yo también te habría elegido en todos esos días que no tuvimos.\n\nZero inclinó la cabeza. Una lágrima recorrió su mejilla y se perdió entre la sangre.\n\n—Te amo —dijo, sin saber si se lo decía a él, a su recuerdo o a la parte de sí mismo que todavía necesitaba escucharlo.\n\n—Lo sé —respondió Kitty—. Yo también te amo.\n\nLa grabadora permaneció encendida unos segundos más. Solo registró el viento, una respiración irregular y el sonido distante de la lluvia que por fin comenzaba a caer.\n\nZero levantó la vista. Entre los árboles, más allá del terreno destrozado, distinguió uno cuya copa se movía suavemente bajo las primeras gotas. No era un lugar especial. No había sido elegido para una última ceremonia ni para una despedida solemne. Era simplemente un árbol, todavía en pie después de la tormenta.\n\n—Quiero sentarme un momento —murmuró.\n\nKitty se puso de pie.\n\n—Entonces vamos.\n\nZero apagó la grabadora. La guardó contra su pecho, como si aquel pequeño aparato pudiera conservar algo más que su voz. Apoyó una mano en la roca y trató de levantarse. El mundo se inclinó. Tuvo que esperar hasta que el mareo disminuyera.\n\nNo llamó a nadie. Todavía no.\n\nNo porque no quisiera verlos, sino porque necesitaba reunir las pocas fuerzas que le quedaban para poder mirarlos sin convertir su último momento en una súplica. Quería sonreírles. Quería que supieran que, aun con miedo, seguía siendo él.\n\nDio un paso.\n\nDespués otro.\n\nCada uno parecía más largo que el anterior. La lluvia comenzó a empaparle el cabello y a limpiar lentamente la sangre de sus manos. A su espalda, la brecha terminó de apagarse. En algún punto del campo, alguien gritó que lo habían conseguido. Otros respondieron. Hubo un sonido parecido a un sollozo colectivo, y luego un silencio distinto: no el silencio de la destrucción, sino el de quienes comprenden que han sobrevivido.\n\nZero escuchó aquellas voces y sonrió.\n\n—Lo logramos —repitió.\n\nKitty caminaba a su lado, aunque sus pies no dejaban huellas.\n\n—Sí —dijo él—. Lo lograron.\n\nÉl lo miró de reojo.\n\n—No digas «lo lograron» como si tú no hubieras estado aquí.\n\n—Yo no fui quien sostuvo la espada.\n\n—No. Pero hubo noches en las que tu voz fue lo único que me hizo seguir.\n\nKitty no contestó. Su figura se volvió un poco más tenue bajo la lluvia.\n\n—No te me adelantes —dijo Zero, con una sonrisa débil.\n\n—No soy yo quien está caminando con tanta dificultad.\n\n—Qué cruel eres con un hombre herido.\n\n—Siempre lo he sido.\n\nLa broma murió despacio entre ambos. Zero siguió avanzando hasta alcanzar el árbol. Se dejó caer bajo su sombra, con un cuidado que ya no podía disimular el agotamiento. El tronco estaba frío contra su espalda. Sobre él, las ramas se extendían como brazos antiguos, indiferentes a las guerras de los hombres.\n\nLa grabadora pesaba poco en su pecho. Su cuerpo, en cambio, parecía pesar cada vez más.\n\nKitty se quedó frente a él.\n\n—¿Y ahora? —preguntó.\n\nZero miró hacia el camino por el que, tarde o temprano, aparecerían Sage y Zwitt. Pensó en todo lo que todavía debía decirles. Pensó en las palabras que no cabían en una grabación y en las que quizá nunca encontraría la fuerza para pronunciar.\n\n—Ahora voy a escucharlos —respondió—. Y voy a intentar no desperdiciar este último momento teniendo miedo de que sea el último.\n\nKitty lo observó con una dulzura que parecía iluminar la lluvia.\n\n—Eso suena a ti.\n\n—No sé si es algo bueno.\n\n—Nunca dije que lo fuera.\n\nZero dejó escapar una risa tenue. Luego cerró los ojos durante un instante. No estaba en paz. Todavía sentía miedo. Todavía quería vivir. Pero ya no estaba peleando contra la verdad con la misma desesperación. Había hecho todo lo que pudo para que los demás tuvieran un mañana. Si ese mañana no lo incluía, al menos podía intentar recibirlo sin convertir sus últimos segundos en otra batalla.\n\nAbrió los ojos al escuchar pasos entre la lluvia.\n\nGuardó silencio.\n\nLa grabadora, apagada contra su pecho, conservaba su última voz. En ella quedaban sus disculpas, sus agradecimientos, el nombre de Kitty y la certeza de que, pese a todo, había amado este mundo. No era una orden. No era una leyenda. Era simplemente Zero, hablando por última vez sin espada en la mano.\n\nEl indicador rojo ya no brillaba.\n\nLa lluvia cayó con más fuerza.\n\nY, bajo la sombra de aquel árbol, Zero esperó a quienes todavía tenía que mirar a los ojos."

   "title": "El último aliento",
   "part": "p4",
   "text": "EL COMIENZO DE LA NUEVA AVENTURA: «EL ARCOÍRIS DESPUÉS DE LA TORMENTA»\n\nCAPÍTULO 16: «EL ÚLTIMO ALIENTO»\n\nLa lluvia no distinguía entre vencedores y vencidos.\n\nCaía sobre los restos del campo de batalla, apagaba las últimas brasas, arrastraba el polvo de los caminos y se mezclaba con la sangre que todavía manchaba la tierra. Cada gota golpeaba las hojas del árbol bajo el que yacía Zero. A su alrededor, el mundo parecía haberse quedado sin fuerzas para continuar. El ruido de la batalla había desaparecido; ya no quedaban órdenes, gritos ni promesas de victoria. Solo persistía aquel aguacero interminable, como si incluso el cielo necesitara llorar lo que había costado alcanzar la paz.\n\nZero estaba recostado contra el tronco. Tenía heridas por todo el cuerpo, la ropa desgarrada y la respiración tan débil que, por momentos, parecía confundirse con el sonido de la lluvia. Una de sus manos descansaba sobre la tierra húmeda. La otra permanecía cerca de su pecho, donde el dolor latía con cada intento de tomar aire.\n\nHabía entregado cuanto tenía.\n\nSu fuerza, su tiempo, sus días de descanso, sus sueños y, finalmente, aquello que durante tanto tiempo creyó que nunca tendría que ofrecer: su propia vida. Había luchado por su familia, por sus amigos, por su clan, por sus reclutas y por todos aquellos que quizá jamás conocerían su nombre. Había querido que ninguno tuviera que cargar con el precio que ahora estaba pagando él.\n\nY, sin embargo, allí estaba.\n\nNo se sentía invencible. No se sentía como el hombre al que tantos habían llamado el más fuerte. Solo era Zero: un muchacho cansado, herido y asustado, que todavía tenía cosas que quería hacer.\n\nEse pensamiento le dolió más que cualquiera de sus heridas.\n\nQuería ver cómo sería el día siguiente. Quería escuchar a los demás discutir por tonterías, volver a entrenar con Sage, fastidiar a sus amigos y compartir con Zwitt una tarde que no terminara en despedidas. Quería tener tiempo para corregir sus errores. Quería vivir lo suficiente para descubrir quién sería cuando ya no tuviera que ser el líder, el protector o la persona a la que todos acudían cuando algo salía mal.\n\nQuería quedarse.\n\nRecordó la última grabación que había dejado preparada. Allí había guardado palabras que no quería que se perdieran con su voz; quizá Sage, Zwitt y los demás la escucharían cuando estuvieran listos. No era una despedida capaz de arreglarlo todo, pero al menos les dejaría algo más que el recuerdo de verlo marcharse bajo la lluvia. Un fragmento de él que pudieran escuchar en otro momento, cuando el dolor ya no les impidiera hacerlo.\n\nPor primera vez en mucho tiempo, Zero no intentó ocultárselo a sí mismo.\n\n—Vaya manera de terminar, ¿no? —murmuró, observando la lluvia.\n\nUna figura estaba sentada junto a las raíces del árbol. Zero no necesitó girar demasiado la cabeza para reconocerla.\n\nKitty.\n\nEl chico gato tenía la apariencia de siempre: sus rasgos felinos, sus orejas y su cola lo distinguían incluso bajo aquella luz gris. Pero había algo en él que ningún ser vivo podía confundir con una presencia común. Kitty pertenecía a los espíritus porque había muerto. Su existencia estaba en ese límite extraño entre lo que permanece y lo que ya no pertenece al mundo de los vivos.\n\nY solo Zero podía verlo.\n\nSage no lo veía. Zwitt tampoco. Ninguna de las personas que todavía se encontraban cerca podía distinguir su silueta ni escuchar su voz. Para todos los demás, Zero estaba mirando el vacío o hablando consigo mismo. Kitty era una presencia que únicamente se revelaba ante él, una compañía que no podía compartir con nadie más.\n\nKitty lo observó en silencio. No parecía sorprendido por encontrarlo así. Quizá porque había comprendido antes que Zero que aquella historia se acercaba a su última página.\n\n—No tienes que hacerte el fuerte conmigo —dijo Kitty.\n\nZero soltó una risa breve, que se convirtió en una mueca de dolor.\n\n—¿Y qué quieres que haga? ¿Que me ponga a llorar?\n\n—Puedes hacerlo.\n\n—No me queda demasiada energía.\n\n—Entonces no la desperdicies fingiendo que no te duele.\n\nZero bajó la mirada. Durante unos segundos solo se escuchó el agua al caer de las ramas. Había muchas cosas que podía decirle a Kitty, pero ninguna parecía suficiente. Lo había amado. Había encontrado en él una parte de su vida que no podía explicar con facilidad a los demás. Su muerte no había borrado lo que compartieron, ni el cariño, ni las palabras que quedaron pendientes. Kitty seguía siendo alguien importante para él; no un recuerdo decorativo ni una sombra que aparecía para recordarle el pasado. Era Kitty. Un chico al que había amado y cuya ausencia había aprendido a llevar sin dejar de extrañarlo.\n\n—Pensé que tendría más tiempo —confesó Zero.\n\n—Todos creen eso alguna vez.\n\n—Yo tenía planes.\n\n—Lo sé.\n\n—Ni siquiera terminé de cumplirlos.\n\nKitty se acercó un poco. Zero pudo distinguir la tristeza en su expresión, aunque el espíritu no intentó convertirla en lástima.\n\n—Que no hayas podido terminar todo no significa que no hayas hecho nada —respondió—. No conviertas lo que quedó pendiente en la medida de lo que valió tu vida.\n\nZero cerró los ojos.\n\n—No quiero que me recuerden así.\n\n—Entonces dales algo más que recordar.\n\nAntes de que pudiera contestar, escuchó pasos sobre el barro.\n\nSage y Zwitt se acercaban.\n\nZero abrió los ojos y buscó sus rostros. Verlos allí le produjo un alivio que no esperaba. También le hizo sentir una punzada de culpa: ambos seguían de pie, respirando, mientras él apenas podía mantener los ojos abiertos. Habían sobrevivido, pero sus expresiones no se parecían a las de quienes acababan de ganar una batalla.\n\nSage tenía los puños cerrados. Intentaba controlar el temblor de sus manos, aunque las lágrimas ya le recorrían las mejillas. Zwitt caminaba con dificultad, como si cada paso le exigiera aceptar algo que su corazón se negaba a comprender.\n\n—Zero... —alcanzó a decir Sage.\n\n—Acérquense —pidió él.\n\nSu voz fue apenas un hilo, pero ambos lo escucharon.\n\nKitty se quedó junto al tronco. No se interpuso entre ellos ni intentó llamar su atención. Sabía que no podían verlo. También sabía que aquel momento pertenecía a Zero y a las personas que habían llegado hasta allí para despedirse de él.\n\nZero miró a Sage primero.\n\n—Tú. Ven un poco más cerca.\n\nSage obedeció y se arrodilló frente a él. La lluvia le empapaba el cabello y le resbalaba por el rostro, mezclándose con sus lágrimas. Durante unos instantes no consiguió pronunciar palabra. Miraba las heridas de su maestro como si, por encontrar una forma de cerrarlas, pudiera deshacer todo lo ocurrido.\n\n—Tenemos que llevarte de aquí —dijo finalmente—. Todavía podemos buscar ayuda. No puedes rendirte ahora.\n\nZero quiso levantar una mano para tranquilizarlo, pero apenas consiguió mover los dedos.\n\n—Sage... mírame.\n\nEl joven levantó la vista.\n\n—Escúchame bien. No quiero que conviertas este momento en una deuda que tengas que pagar durante el resto de tu vida.\n\n—Pero yo debería haber...\n\n—No. —Zero hizo una pausa para recuperar el aliento—. No empieces a cargar con culpas que no te corresponden. No te entrené para que pudieras salvarme a mí. Te entrené para que fueras capaz de proteger aquello que consideras importante, incluso cuando yo ya no estuviera a tu lado.\n\nSage apretó los labios. Quería protestar, pero las palabras se le quebraban antes de salir.\n\n—No quiero ser el líder si eso significa perderte.\n\nLa expresión de Zero se suavizó.\n\n—Lo sé. Y ojalá pudiera quedarme para verlo todo. Ojalá pudiera seguir corrigiéndote cuando cometas errores, decirte que entrenes más y recordarte que no todo se resuelve intentando cargar con el mundo tú solo. Pero no confundas mi ausencia con el final de tu camino.\n\nUna gota cayó desde una hoja y golpeó el hombro de Sage. Él no se movió.\n\n—Vive con orgullo y mantén la frente en alto —continuó Zero—. Habrá días en los que dudes de ti. Días en los que tus miedos sean más grandes que tu fuerza y te preguntes si de verdad estás preparado. Cuando eso ocurra, no intentes convertirte en alguien que jamás siente miedo. Llena tu corazón de valor y sigue adelante aun con miedo. Eso también es ser fuerte.\n\nZero tomó aire. El esfuerzo le hizo cerrar los ojos un instante.\n\n—El tiempo no se detendrá porque nosotros queramos quedarnos en un momento. Puedes detenerte, puedes llorar, puedes extrañarnos... pero no permitas que la tristeza decida por ti cuánto debe durar tu vida. No mires atrás para castigarte. Mira atrás cuando necesites recordar por qué empezaste.\n\nSage ya no intentaba esconder el llanto.\n\n—No sé si podré hacerlo como tú.\n\n—No lo hagas como yo. Hazlo mejor. —Una pequeña sonrisa apareció en el rostro de Zero—. No necesito otro Zero. Necesito que seas Sage. Tienes tu propio criterio, tu propia fuerza y una manera de ver el mundo que todavía no has terminado de descubrir.\n\n—Me enseñaste todo lo que sé.\n\n—Te enseñé lo que pude. El resto tendrás que aprenderlo viviendo.\n\nZero lo miró con un orgullo sereno. Recordó los entrenamientos, los errores, las discusiones y todos aquellos momentos en los que Sage había seguido intentándolo a pesar de no sentirse preparado. En ese instante pudo ver en él algo más importante que la fuerza: la voluntad de continuar.\n\n—Fue un honor ser tu maestro —dijo—. Y será un honor que algún día seas tú quien guíe a los demás. No porque tengas que ocupar mi lugar, sino porque habrás encontrado el tuyo.\n\nSage inclinó la cabeza. Su frente quedó cerca de la mano de Zero.\n\n—Gracias por confiar en mí —susurró.\n\n—Siempre lo hice, alumno mío.\n\nZero intentó sonreír un poco más.\n\n—No te rindas. Todavía tienes mucho por vivir.\n\nSage se quedó allí unos segundos, incapaz de separarse. Después, con un esfuerzo que pareció arrancarle algo del pecho, se puso de pie y retrocedió. No se marchó porque quisiera hacerlo, sino porque comprendió que Zero necesitaba hablar con Zwitt y porque, por mucho que quisiera, no podía obligarlo a quedarse.\n\nCuando Sage se apartó, Zero volvió a mirar hacia el árbol.\n\nKitty seguía allí. Sus ojos se encontraron por un instante. El espíritu no dijo nada, pero Zero entendió lo que le ofrecía: no una salida, ni una promesa de que todo dejaría de doler, sino la tranquilidad de no tener que fingir durante los últimos minutos.\n\nEntonces Zwitt se acercó.\n\nNo había en él la serenidad de Sage. Su rostro estaba deshecho por el miedo y el dolor. Se arrodilló junto a Zero y tomó su mano con ambas manos, como si el calor de su piel pudiera convencerlo de permanecer en este mundo.\n\n—No hables —dijo Zwitt—. Guarda fuerzas. Por favor, no digas nada todavía.\n\nZero lo miró con una ternura cansada.\n\n—Siempre fuiste malo dándome órdenes.\n\nZwitt soltó una risa rota que apenas duró un segundo. Después volvió a llorar.\n\n—No hagas bromas. No ahora.\n\n—Perdón.\n\n—No quiero que te disculpes. Quiero que te levantes. Quiero que salgamos de aquí y que mañana me digas que todo esto fue una pesadilla. Quiero que vuelvas a quejarte de cualquier cosa, que me mires como si supieras que tengo razón incluso cuando no la tengo. Quiero... —Zwitt no pudo terminar.\n\nZero apretó sus dedos todo lo que su cuerpo le permitió.\n\n—Lo sé.\n\nSe quedaron mirándose. No había palabras capaces de hacer más pequeño aquel instante.\n\n—Escúchame, Zwitt. Hay algo que necesito decirte y no quiero llevármelo sin que lo sepas.\n\nZwitt negó con la cabeza, anticipando la despedida.\n\n—No.\n\n—Por favor.\n\nEl silencio que siguió fue tan pesado que hasta la lluvia pareció alejarse.\n\n—No estoy enojado contigo —dijo Zero—. Nunca quise que pensaras que todo lo que ocurrió fue culpa tuya. Debí protegerte de aquel espíritu. Debí enfrentar lo que nos perseguía en lugar de elegir huir. En ese momento tuve miedo, y tomé decisiones que todavía me pesan. No voy a fingir que no cometí errores. Te fallé en cosas que debí hacer mejor y lo lamento.\n\nZwitt le sostuvo la mano con más fuerza.\n\n—No tienes que cargar con eso ahora.\n\n—Lo he cargado mucho tiempo. Déjame, al menos, decirlo.\n\nZero tosió. Un hilo de sangre apareció en sus labios. Zwitt intentó limpiarlo con la manga, con movimientos temblorosos, y luego apoyó la frente contra la mano de Zero.\n\n—Perdóname por no haber sido la mejor pareja —continuó Zero—. Por las veces en que estuve tan ocupado protegiendo a todos que olvidé preguntarte cómo estabas. Por las ocasiones en que pensé que podía resolverlo todo solo. No siempre supe demostrarte cuánto significabas para mí.\n\n—Tú significas todo para mí —respondió Zwitt, casi sin voz.\n\n—Y tú para mí. No quiero que te quedes viviendo entre los «qué habría pasado si...» No quiero que pases cada día buscando el instante en el que pudiste cambiar el resultado. No fue una sola decisión, ni una sola persona, ni una sola palabra lo que nos trajo aquí. No conviertas mi muerte en una condena para ti.\n\nZwitt levantó la mirada. Tenía los ojos rojos y el rostro empapado.\n\n—¿Cómo se supone que voy a seguir sin ti?\n\nZero tardó en responder.\n\n—Un día a la vez. No tienes que saberlo todo ahora. Llora cuando lo necesites. Enójate conmigo si eso te ayuda. Guarda lo que quieras guardar y deja ir lo que te haga daño. Pero sigue viviendo. Por favor.\n\nEl pulgar de Zero rozó la mano de Zwitt, un gesto pequeño que tantas veces había hecho sin pensarlo.\n\n—Cuida de los demás. No permitas que el dolor los empuje hacia el mismo camino que casi nos destruye. Y cuando Sage esté preparado, entrégale mi mando y mi katana. Tiene el potencial para liderar a los cazadores. Todavía necesita experiencia, pero aprenderá. Confía en él como yo confié.\n\n—Se lo daré —prometió Zwitt—. Pero tú tienes que decírselo. Tienes que estar ahí cuando llegue ese día.\n\nZero bajó los ojos. No quiso mentirle.\n\n—No voy a poder.\n\nZwitt cerró los párpados con fuerza. Una lágrima cayó sobre la mano de Zero.\n\n—Te amo —dijo Zero—. Siento no haber tenido más tiempo para demostrártelo.\n\n—Yo también te amo. No importa cuánto tiempo pase. No importa dónde estés.\n\n—Gracias por haber caminado conmigo.\n\nZwitt se inclinó y apoyó su frente contra la de Zero. No hubo una despedida perfecta. No hubo una frase capaz de reparar lo que estaba rompiéndose. Solo dos personas que se amaban intentando encontrar un segundo más dentro de un tiempo que se les escapaba.\n\nA unos pasos, Sage se cubrió el rostro. No intentó interrumpirlos.\n\nZero miró de reojo hacia Kitty. El chico gato continuaba junto al árbol, silencioso. Nadie más reaccionó a su presencia. Zwitt no lo vio, no giró la cabeza hacia él ni escuchó las palabras que el espíritu pronunció después, en voz tan baja que solo Zero pudo oírlas.\n\n—No tienes que despedirte de todos como si tuvieras que dejarles una respuesta para cada dolor.\n\nZero volvió la atención a Zwitt.\n\n—Prométeme que no dejarás de vivir por mí.\n\nZwitt tardó en responder. La promesa parecía demasiado cruel para pedirla y demasiado importante para callarla.\n\n—Lo intentaré —dijo finalmente—. No sé cómo, pero lo intentaré.\n\n—Eso es suficiente.\n\nZero soltó lentamente su mano. Sus dedos perdieron fuerza uno por uno hasta que la mano quedó quieta sobre la tierra. Zwitt no quiso aceptarlo. La sostuvo todavía unos instantes, esperando sentir otro apretón, otro movimiento, cualquier señal de que la despedida aún no había terminado.\n\nPero Zero ya no tenía fuerzas para responder.\n\nZwitt se apartó con dificultad. Sage se acercó a él y lo sostuvo por el hombro. Ninguno de los dos sabía qué hacer con el silencio que había quedado bajo aquel árbol. Se alejaron unos pasos, no porque Zero hubiera dejado de importarles, sino porque ya no podían cambiar lo que estaba sucediendo y porque mirar cada respiración convertirse en una lucha era más de lo que podían soportar.\n\nPor un instante, Zero quedó solo con la lluvia.\n\nO eso habría parecido para cualquiera que estuviera allí.\n\nKitty se acercó hasta quedar a su lado. Se sentó en la tierra húmeda, cerca de su hombro. Su cola se acomodó junto a él y sus orejas se inclinaron con tristeza. No necesitaba fingir que no estaba preocupado. Zero tampoco necesitaba fingir frente a él.\n\n—¿Crees que lo hice bien? —preguntó Zero.\n\n—Creo que hiciste lo que pudiste con lo que tenías.\n\n—Eso no siempre fue suficiente.\n\n—No. Pero nunca fuiste una máquina hecha para salvar a todos.\n\nZero observó las ramas que se extendían sobre ambos. El agua resbalaba por las hojas y caía junto a su rostro.\n\n—Me pasé la vida intentando que nadie tuviera que sentir lo que yo estoy sintiendo ahora.\n\n—Y aun así, no pudiste evitarles todo el dolor.\n\n—No.\n\n—Eso no vuelve inútil lo que hiciste.\n\nZero respiró con dificultad. La siguiente inhalación llegó tarde, como si el cuerpo estuviera olvidando poco a poco cómo continuar.\n\n—Me habría gustado tener una vida normal —dijo—. Una casa, días tranquilos, discusiones absurdas. Despertar sin tener que pensar a quién debía proteger. Envejecer. Tener la oportunidad de arrepentirme de cosas pequeñas, no de decisiones que cambiaron la vida de tantos.\n\nKitty inclinó la cabeza.\n\n—Habrías sido terrible quedándote quieto demasiado tiempo.\n\n—Probablemente.\n\n—Y habrías encontrado algo por lo que preocuparte incluso en el día más tranquilo.\n\n—Eso también es cierto.\n\nUna pequeña sonrisa cruzó el rostro de Zero. Fue breve, pero real. Kitty le había recordado que, antes de ser un líder o un guerrero, había sido alguien capaz de reírse por tonterías. Alguien que había querido, que se había equivocado y que había tenido momentos felices incluso cuando el mundo parecía empeñado en arrebatárselos.\n\n—No quiero que lo que vivimos se convierta solo en tristeza —dijo Zero.\n\n—Entonces no lo recuerdes solo desde el final.\n\n—Te quise, Kitty.\n\n—Lo sé.\n\n—Y sigo queriéndote. Aunque haya pasado el tiempo. Aunque tantas cosas hayan cambiado. No quería que nuestra historia terminara con una despedida que nunca pudimos tener como merecíamos.\n\nKitty bajó la mirada. Por primera vez desde que había aparecido, pareció no encontrar una respuesta inmediata.\n\n—Lo que vivimos fue real, Zero. No necesita durar para siempre para haber sido importante. No tienes que demostrarme nada ahora. Ni quedarte por mí, ni arrepentirte por seguir adelante, ni convertir tu dolor en una promesa.\n\n—A veces pensé que, si hubiera podido salvarte...\n\n—No puedes volver a cambiar mi muerte. Y no quiero que pases tu existencia intentando pagar por ella.\n\nZero cerró los ojos. Una lágrima se mezcló con la lluvia y recorrió su mejilla.\n\n—Qué injusto es todo esto.\n\n—Sí —respondió Kitty—. Lo es.\n\nNo intentó suavizarlo. No le dijo que todo ocurría por una razón ni que el sufrimiento tenía que convertirse en algo hermoso. Se quedó con él, aceptando que había dolores para los que no existía una explicación suficiente.\n\nZero volvió a mirar hacia donde estaban Sage y Zwitt. Los distinguía entre la lluvia. Sage sostenía a Zwitt, aunque también él parecía a punto de derrumbarse. Ninguno podía ver a Kitty. Ninguno podía escuchar aquella conversación. Para ellos, Zero estaba mirando las ramas y respirando con dificultad. Solo él sabía que no estaba solo.\n\n—Quiero que recuerden que fui feliz —murmuró—. No todo el tiempo. No en cada momento. Pero sí lo fui. Que no piensen que mi vida fue únicamente una preparación para morir aquí.\n\n—Entonces eso es lo que debes dejarles —dijo Kitty—. No solo instrucciones. También recuerdos.\n\nZero reunió lo que le quedaba de fuerza y giró un poco la cabeza hacia Sage y Zwitt.\n\n—¡Oigan...!\n\nLa voz apenas atravesó la lluvia, pero Sage y Zwitt se volvieron de inmediato.\n\nZero intentó sonreír.\n\n—No olviden vivir.\n\nSage se llevó una mano a la boca. Zwitt dio un paso hacia él, pero se detuvo al verlo tan débil. Ninguno encontró palabras.\n\n—No hagan de este día todo lo que fuimos —continuó Zero—. Hubo más que esta batalla. Hubo risas, entrenamientos, errores, momentos buenos... Recuérdenlos también.\n\nSu voz se apagó. No pudo decir nada más.\n\nKitty se inclinó un poco hacia él.\n\n—Ya has dicho suficiente.\n\nZero dejó escapar el aire lentamente. El dolor parecía alejarse por momentos, aunque no sabía si aquello era alivio o simplemente cansancio. La lluvia seguía cayendo, pero ahora escuchaba otros sonidos: el roce de las hojas, la respiración distante de sus amigos, el viento moviéndose entre las ramas.\n\nPensó en su clan. En las personas que había conocido. En quienes habían llegado a casa y en quienes no. Pensó en Sage, que tendría que aprender a dirigir sin imitarlo. Pensó en Zwitt, que tendría que encontrar una manera de seguir adelante. Pensó en Kitty, cuyo recuerdo no necesitaba ocupar un lugar visible para continuar formando parte de él.\n\nY pensó en sí mismo.\n\nNo en el más fuerte. No en el líder. No en el hombre que todos esperaban que fuera.\n\nEn Zero.\n\n—Tengo miedo —admitió.\n\nKitty acercó su mano a la de él. Zero sintió el contacto como una tibieza tenue, aunque nadie más habría podido verlo ni sentirlo.\n\n—Lo sé.\n\n—No quiero irme.\n\n—Lo sé.\n\n—Pero ya no puedo seguir.\n\nKitty no respondió enseguida. Sus ojos permanecieron fijos en los de Zero.\n\n—No tienes que fingir que estás listo. Solo tienes que dejar de castigarte por tener miedo.\n\nZero respiró una vez más. Luego otra, más débil.\n\n—Gracias por venir.\n\n—Nunca necesité que me pidieras que me quedara.\n\n—Aun así, gracias.\n\nEl muchacho gato permaneció a su lado. No intentó arrastrarlo a ninguna parte ni le ofreció promesas sobre lo que habría después. Simplemente acompañó a Zero mientras el mundo se volvía cada vez más silencioso.\n\nLa mirada de Zero se elevó hacia las ramas. Algunas hojas temblaban por el peso de la lluvia. El tronco, firme y antiguo, parecía sostener no solo el agua, sino también el pequeño instante de paz que aún quedaba allí.\n\nEn algún lugar, el reloj marcaba las 11:49 de aquel viernes 31 de diciembre.\n\nZero pensó que era extraño que el tiempo pudiera seguir avanzando con tanta normalidad mientras para él todo estaba terminando. No hubo un estruendo ni una señal que anunciara el momento. Solo una respiración que no llegó a completarse.\n\nSu mano quedó quieta.\n\nSus ojos perdieron el enfoque.\n\nY Zero murió bajo aquel árbol, mientras la lluvia continuaba cayendo.\n\nKitty permaneció junto a él. Por última vez, Zero había podido verlo; por última vez, había podido escuchar su voz y sentir que alguien conocía una parte de su historia que no necesitaba explicar. Nadie más fue testigo de aquella despedida. Sage y Zwitt solo vieron a Zero inmóvil, y el silencio que siguió les confirmó aquello que ninguno estaba preparado para aceptar.\n\nSage cayó de rodillas. Zwitt no pudo moverse.\n\nEl hombre que se había creído capaz de soportarlo todo, el maestro que había impulsado a tantos, el compañero que todavía tenía promesas pendientes, ya no volvería a abrir los ojos.\n\nLa paz había llegado.\n\nPero no se parecía a la victoria que habían imaginado.\n\nDurante mucho tiempo, Sage y Zwitt permanecieron cerca del árbol. La lluvia fue perdiendo fuerza hasta convertirse en una llovizna fina. No hubo palabras capaces de llenar aquel espacio. Sage miraba el rostro de su maestro, intentando memorizarlo sin aceptar que esa sería la última vez. Zwitt conservaba en sus manos el recuerdo de la última vez que Zero le había apretado los dedos.\n\nCuando finalmente se alejaron, ninguno lo hizo porque hubiera olvidado a Zero. Se marcharon porque la vida, cruel y obstinada, seguía reclamándoles que dieran el siguiente paso.\n\nY el tiempo pasó.\n\nPasaron días en los que el dolor parecía reciente incluso al despertar. Pasaron semanas en las que cualquier silencio podía devolverlos a aquella tarde. Pasaron meses antes de que Sage pudiera sostener el mando sin sentir que pesaba más de lo que debía. Pasaron años antes de que el nombre de Zero dejara de pronunciarse siempre acompañado de un sollozo.\n\nSage cumplió su promesa. Siguió entrenando, aprendió de sus errores y dejó de intentar convertirse en una copia de su maestro. Cuando llegó el momento, recibió el mando y la katana de Zero. No los tomó como trofeos ni como prueba de que había alcanzado una posición superior. Los aceptó como una responsabilidad y como un recuerdo de la confianza que alguien había depositado en él cuando todavía dudaba de sí mismo.\n\nCon el tiempo, Sage logró su objetivo y se convirtió en el líder de los cazadores. No fue un líder idéntico a Zero. Tuvo sus propias decisiones, sus propios aciertos y sus propios errores. Y quizá por eso honró de verdad lo que su maestro le había enseñado: no debía ocupar su lugar, sino construir un camino propio.\n\nDe Zwitt, en cambio, se supo cada vez menos. Después de aquel día dejó de aparecer entre los demás. Algunos conservaron sus recuerdos; otros se preguntaron durante años dónde habría ido. Pero nadie pudo borrar lo que había significado para Zero ni las últimas palabras que ambos compartieron bajo la lluvia.\n\nEl clan Lost Night terminó separándose. No fue una ruptura nacida únicamente del odio o del olvido, sino el cierre de una etapa que ya había cumplido su propósito. Cada integrante tuvo que encontrar su propio rumbo. El mundo espiritual regresó a su plano existencial; los demonios volvieron al infierno y los ángeles regresaron al cielo para continuar cuidando del mundo. Los Cuatro Reinos alcanzaron finalmente una paz que durante generaciones había parecido imposible.\n\nY, con el paso de los años, el lugar donde Zero había dejado su último aliento cambió.\n\nLa naturaleza reclamó lentamente aquello que la batalla había herido. Las raíces se extendieron por la tierra. El tronco se fortaleció y las ramas crecieron hacia el cielo. Allí donde había descansado el cuerpo de Zero nació un árbol de sakura. Cada primavera, sus flores cubrían el lugar con tonos suaves; cada vez que el viento soplaba, los pétalos caían como pequeños recuerdos que el mundo se negaba a perder.\n\nQuienes conocían la historia acudían a veces para permanecer en silencio bajo sus ramas. Algunos dejaban flores. Otros inclinaban la cabeza. Los más jóvenes escuchaban el relato de aquel líder que había dado su vida para que los demás pudieran construir un futuro distinto.\n\nCon el tiempo, muchos olvidaron los detalles de la batalla. Los nombres de algunos enemigos se perdieron. Las heridas de los reinos dejaron de ser visibles y las generaciones nuevas crecieron sin tener que aprender a vivir bajo aquella guerra. Pero el árbol permaneció.\n\nNo era una estatua ni un monumento de piedra. No llevaba una corona, no sostenía una espada y no tenía una inscripción que explicara quién había sido Zero. Simplemente estaba allí, creciendo, floreciendo y dejando caer sus pétalos con cada cambio de estación.\n\nQuizá aquel era el recuerdo más honesto que podía quedar de él.\n\nPorque Zero no había sido únicamente el hombre que murió por todos. También había sido alguien que se reía, que se equivocaba, que amaba, que extrañaba y que tenía miedo de perder aquello que había conseguido. Había sido maestro, amigo, compañero y alguien que, incluso en su último instante, deseó haber tenido un poco más de tiempo.\n\nAquel viernes 31 de diciembre, a las 11:49, no terminó solamente una vida. Terminó una era. La paz entre los Cuatro Reinos llegó, pero su precio quedó escrito en cada persona que tuvo que aprender a continuar sin él.\n\nAquel día perdieron más de lo que ganaron.\n\nY aun así, el mundo siguió adelante.\n\nSage siguió adelante. Zwitt siguió adelante, aunque nadie supiera cuánto le costó. Los sobrevivientes siguieron adelante. Y el árbol continuó floreciendo, recordando en silencio a quien había descansado bajo sus ramas.\n\nEn algún lugar de aquella historia quedó también Kitty: el chico gato que pertenecía al mundo de los espíritus, el ser que solo Zero podía ver y cuya presencia lo acompañó cuando ya no quedaban fuerzas para fingir. Nadie pudo confirmar que hubiera estado allí. Nadie escuchó sus palabras. Para todos, Zero pasó sus últimos momentos mirando la lluvia y las ramas de un árbol.\n\nPero Zero no estuvo solo.\n\nY tal vez eso también formó parte de su despedida.\n\nA pesar de cómo comenzó su historia, de los errores que cometió y de todo aquello que no pudo reparar, ojalá Zero haya encontrado la paz que tanto le costó construir para los demás.\n\nQue sus amigos recuerden su risa además de su sacrificio. Que Sage no olvide que siempre creyó en él. Que Zwitt pueda, algún día, recordar su amor sin que el dolor sea lo único que permanezca. Y que Kitty conserve de Zero algo más que su última mirada: todos los momentos en los que todavía había tiempo para estar juntos.\n\nZero se fue, pero no todo lo que dejó desapareció con él. Lo que amó, protegió y enseñó siguió viviendo en los demás: en una promesa cumplida, en una espada entregada, en quienes encontraron valor para continuar y en el árbol que florecía cada primavera.\n\nFIN.\n"
