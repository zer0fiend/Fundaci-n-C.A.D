   "text": "---\n\nEL comienzo de una larga aventura: \"¿Estas bien?\"\nCapítulo 1: \"La creacion\"\n\n---\n\nTodo empeze en el primer reino, un lugar donde era gobernado por una unica entidad \"Dios\" se alzaba sobre todo, y junto a el su mas leal, Ryu su serafin de mayor\nrango, habia escuchado la idea crear vida por parte de dios, a Ryu esto lo desconserto ¿por que crear mas vida? ¿hay algo malo con lo actual?, esas y mas\npreguntas pasaban por la mente de Ryu, un dia Dios decidio hacer una junta para decidir que pasaria ahora, cuya reunion asistieron \nDios - La entidad suprema y creadora de todo, gobernante del Primer Reino.\nSerafines\nRyu - El serafín de mayor rango, leal a Dios y encargado de la protección más cercana.\nSeraphiel - Segundo al mando entre los serafines, conocido por su sabiduría y luz cegadora.\nAuriel - Encargado de las oraciones y las vibraciones espirituales del reino.\nQuerubines\nGabriel - Poseedor de gran conocimiento y portador de mensajes divinos, cuestiona la creación de nueva vida.\nElyon - Guardián de los secretos celestiales y la historia del Primer Reino.\nZadkiel - Protector de los inocentes y guerrero contra la injusticia.\nTronos\nThroniel - Representante de la voluntad de Dios, equilibrado y justo.\nOrifiel - Encargado de la disciplina y el orden entre las jerarquías.\nRaguel - Promotor de la armonía y la justicia entre los ángeles.\nDominaciones\nDominiel - Supervisa las tareas celestiales y asegura que se cumplan las órdenes divinas.\nZephoniel - Regula las leyes del tiempo y el espacio en el reino.\nSachiel - Protector de la verdad y la rectitud.\nPotestades\nPotentiel - Controla las fuerzas de la naturaleza y mantiene el orden en el mundo físico.\nCamael - Encargado de la fortaleza y el coraje entre los ángeles.\nVeriel - Vigila las estrellas y los cuerpos celestes.\nVirtudes\nVirtuel - Encargado de los milagros y las maravillas del reino.\nHaniel - Se ocupa de la gracia y la influencia positiva en el mundo.\nJophiel - Promueve la belleza y la comprensión entre las creaciones de Dios.\nPrincipados\nPrincipiel - Líder de los ángeles protectores de los reinos y naciones.\nNisroc - Defiende las fronteras espirituales y físicas del Primer Reino.\nMehiel - Inspirador de los líderes y gobernantes para que actúen con integridad.\nArcángeles\nMichael - Comandante de las fuerzas celestiales y protector contra el mal.\nRaphael - Sanador y mensajero de la curación y la restauración.\nSelaphiel - Encargado de la oración y la invocación de la luz divina.\nÁngeles\nAriel - Protector de la naturaleza y los animales.\nAzrael - Compañero de las almas al final de sus vidas.\nCassiel - Proveedor de consuelo y guía durante los períodos de soledad.\nSatanás - Originariamente un ángel caído de alto rango, ahora enemigo de Dios.\nen dicha reunion se decidio si crear mas vida y mas reinos debido a que la soledad en el universo, en ese momento estaba vacio, por votos gano la desicion de\nexpandiar los reinos, dando como inico a los 4 reinos del universo.\ntras pasar varios años, Dios habia tomado ideales erroneos, volviendo del universo un mundo de anarquia en el cual solo le importaba a el tener el poder del todo\nRyu al darse cuenta de esto cuestiona a dios, pero este es ignorado por el mismo\n\nRyu:No deberiamos proteger los reinos? no los creamos para eso?\n\nDios: -solo miraria a Ryu con desprecio y lo ignoraria-\n\nRyu: no piensas hacer nada? solo te quedaras ahi parado observando todo? si tu no piensas hacer nada entonces yo lo hare\n\nDios: -se levantaria de su asinto y miraria a Ryu de una forma seria- Chico, ellos no creen nosotros porque deberia yo ayudarlos?\n\nRyu: porque son tu gente, tu los creaste y deberias enseñarles\n\nDios: no me interesa enseñarles siempre y cuando no intenten rebelen ante mi\n\nRyu: entonces solo te quedaras ahi sentado sin hacer nada, mientras se matan?\n\nDios: exactamente, ya estas entendiendo\n\nRyu: yo me largo, si tu no piensas hacer nada entonces yo lo hare y no
