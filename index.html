const LV=()=>role==='admin'?9:(U[role]?U[role].l:0);
const DC={'SEGURO':'SEGURO','NO SEGURO':'EUCLID','LETAL':'KETER'};
const SEED={parts:[{id:'p1',n:'Parte I · Génesis'},{id:'p2',n:'Parte II · Bahía de Krest'},{id:'p3',n:'Parte III · Horizonte'},{id:'p4',n:'Parte IV · El arcoíris después de la tormenta'}],
chaps:[{"id": "c1", "n": 1, "title": "La creacion", "part": "p1", "text": "---\n\nEL comienzo de una larga aventura: \"¿Estas bien?\"\nCapítulo 1: \"La creacion\"\n\n---\n\nTodo empeze en el primer reino, un lugar donde era gobernado por una unica entidad \"Dios\" se alzaba sobre todo, y junto a el su mas leal, Ryu su serafin de mayor\nrango, habia escuchado la idea crear vida por parte de dios, a Ryu esto lo desconserto ¿por que crear mas vida? ¿hay algo malo con lo actual?, esas y mas\npreguntas pasaban por la mente de Ryu, un dia Dios decidio hacer una junta para decidir que pasaria ahora, cuya reunion asistieron \nDios - La entidad suprema y creadora de todo, gobernante del Primer Reino.\nSerafines\nRyu - El serafín de mayor rango, leal a Dios y encargado de la protección más cercana.\nSeraphiel - Segundo al mando entre los serafines, conocido por su sabiduría y luz cegadora.\nAuriel - Encargado de las oraciones y las vibraciones espirituales del reino.\nQuerubines\nGabriel - Poseedor de gran conocimiento y portador de mensajes divinos, cuestiona la creación de nueva vida.\nElyon - Guardián de los secretos celestiales y la historia del Primer Reino.\nZadkiel - Protector de los inocentes y guerrero contra la injusticia.\nTronos\nThroniel - Representante de la voluntad de Dios, equilibrado y justo.\nOrifiel - Encargado de la disciplina y el orden entre las jerarquías.\nRaguel - Promotor de la armonía y la justicia entre los ángeles.\nDominaciones\nDominiel - Supervisa las tareas celestiales y asegura que se cumplan las órdenes divinas.\nZephoniel - Regula las leyes del tiempo y el espacio en el reino.\nSachiel - Protector de la verdad y la rectitud.\nPotestades\nPotentiel - Controla las fuerzas de la naturaleza y mantiene el orden en el mundo físico.\nCamael - Encargado de la fortaleza y el coraje entre los ángeles.\nVeriel - Vigila las estrellas y los cuerpos celestes.\nVirtudes\nVirtuel - Encargado de los milagros y las maravillas del reino.\nHaniel - Se ocupa de la gracia y la influencia positiva en el mundo.\nJophiel - Promueve la belleza y la comprensión entre las creaciones de Dios.\nPrincipados\nPrincipiel - Líder de los ángeles protectores de los reinos y naciones.\nNisroc - Defiende las fronteras espirituales y físicas del Primer Reino.\nMehiel - Inspirador de los líderes y gobernantes para que actúen con integridad.\nArcángeles\nMichael - Comandante de las fuerzas celestiales y protector contra el mal.\nRaphael - Sanador y mensajero de la curación y la restauración.\nSelaphiel - Encargado de la oración y la invocación de la luz divina.\nÁngeles\nAriel - Protector de la naturaleza y los animales.\nAzrael - Compañero de las almas al final de sus vidas.\nCassiel - Proveedor de consuelo y guía durante los períodos de soledad.\nSatanás - Originariamente un ángel caído de alto rango, ahora enemigo de Dios.\nen dicha reunion se decidio si crear mas vida y mas reinos debido a que la soledad en el universo, en ese momento estaba vacio, por votos gano la desicion de\nexpandiar los reinos, dando como inico a los 4 reinos del universo.\ntras pasar varios años, Dios habia tomado ideales erroneos, volviendo del universo un mundo de anarquia en el cual solo le importaba a el tener el poder del todo\nRyu al darse cuenta de esto cuestiona a dios, pero este es ignorado por el mismo\n\nRyu:No deberiamos proteger los reinos? no los creamos para eso?\n\nDios: -solo miraria a Ryu con desprecio y lo ignoraria-\n\nRyu: no piensas hacer nada? solo te quedaras ahi parado observando todo? si tu no piensas hacer nada entonces yo lo hare\n\nDios: -se levantaria de su asinto y miraria a Ryu de una forma seria- Chico, ellos no creen nosotros porque deberia yo ayudarlos?\n\nRyu: porque son tu gente, tu los creaste y deberias enseñarles\n\nDios: no me interesa enseñarles siempre y cuando no intenten rebelen ante mi\n\nRyu: entonces solo te quedaras ahi sentado sin hacer nada, mientras se matan?\n\nDios: exactamente, ya estas entendiendo\n\nRyu: yo me largo, si tu no piensas hacer nada entonces yo lo hare y no hay nada que puedas hacer para detenerme\n\nDios: -se levanta de su asiento se acerca a Ryu y de un movimiento le arranca sus alas y lo lanza al mundo humano mientras solo rie-\n\nRyu inconsiente por la perdida de sangre queda inmovil barado en el mundo humano, tras varias horas este despierta atado y cerca de una fogata"}, {"id": "c5", "n": 5, "title": "La llegada", "part": "p2", "text": "En alguna linea alterna creado tras \"El incidente\". . . .\nCapitulo-5 \"La llegada\"\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\nera un dia normal lleno de luz el sonido del mar los pajaros cantaban era un dia hermoso como cualquier dia normal.\nen un pueblo cercano a bahía de Krest, Russia, se corria el rumor de una criatura mendigar por los bosques, se decia aquella criatura era nueva.\njamas se le habia visto antes mendigar por aquellos bosques, tambien se hacian rumores que en lo profundo del bosque existian entidades magicas, (dragones, hadas, etc)\nnadie se atrevia entrar al bosque, no solo, asta que de la nada. \n\n-un chico aparentemente joven se veia de unos 18 años entro a un bar del pueblo, el chico media 1.62 era pelo castaño y piel casi blanca como la nieve, este entraria al bar para buscar informacion sobre aquella criatura que contaban los lugareños-\n\nmike: -este se acercaria al cantinero comprando un trago y despues preguntarle- oye. . . eh escuchado que hablan de una criatura unica jamas vista antes me gustaria informacion no importa el precio\n\nel cantinero: -este solo se rie del chico para despues verlo y responderle de una forma sarcastica como si lo quisiera humillar- Escuchen todos este chico quiere informacion de la \"criatura\" mistica del bosque\n\n-el bar se llenaria de risas para despues un amargo silencio-\n\nel cantinero: escucha niño el bosque no es para debiluchos como tu regresa a casa no queremos salgas lastimado\n\nmike: -este dejaria pagada la cuenta y se dirigiria a la salida con verguenza al ver todos se burlaron de el-\n\ntras esto no habia percatado la hora que era y que ya era muy noche, las calles de ese pueblo durante las noches solian ser muy solitarias ni un alma salia a esa hora.\n\nmike: -caminaria con el presentimiento de que algo lo acechaba entre las oscuras calles del pueblo en el que se encontraba-\n\nde entre las sobras saldria una figura bastante afeminada la cual llevaba tiempo siguiendo a mike, mike tras ver aquella figura penso era la criatura que decian los lugareños.\neste al no poder ver bien la figura saldria corriendo, esto no serviria de mucho pues aquella figura lo seguiria, tras unos 5 minutos de corres bajo el frio de la nieve este resbalaria ya esperando su final.\n\n???: -aquella figura se detiene frente a el y lo mira-\n\nmike: -asustado sin saber que hacer en el piso se pondria a rezar esperando un milagro-\n\n???: oye tranquilo no soy un moustro para matarte. Escuche buscas a la criatura no es asi? me enojo ver al cantinero que te humillara asi, yo te ayudare me llamo Rize mucho gusto \n-esta le extenderia la mano a mike esperando que le correspondiera-\n\nmike: -al escuchar la voz de rize este se tranquiliza y abre los ojos para darle la mano y levantarse- O-oye Gracias! m-me llamo mike mucho gusto, y si busco a la criatura jaja\n\nrize: -le sonrie a mike- genial! ven vamos a una posada te vas a congelar si te quedas afuera en el camino hablamos de la criatura\n\nmike: -acierta con la cabeza y se sigue a rize-\n\ntras el camino rize casi no hablo mucho fue asta llegar a la posada despues de que mike se cambiara para no morir por congelacion que empezarian a platicar detalladamente\n\nrize: y bien querias saber de el no?\n\nmike: SI! . . . perdone es que lo llevo buscando mucho tiempo. . . usted sabe si es real?\n\nrize: -esta acierta con la mirada- sip es real el se encuentra en lo profundo del bosque. pero casi nadie sobrevive, apenas mi compañero y yo logramos salir con vida de ahi.\n\nmike: recuerdas como era \"eso\"¿? \n\nrize: pues era alto, su creo era cabello era blanco o como un gris muy claro, sus ojos eran negros completamente y parecia salir un liquido negro de ellos tambien no estoy seguro si era una especie de disfras o algo asi pero era completamente negro.\n\nmike: ya veo. . . (si que cambiaste mucho) y recuerdas algo mas¿?\n\nrize: lo ultimo que recuerdo al entrar es que cuando ibamos de salida esa cosa parecia sobre humana definitivamente no es humano o animal es algo mayor a eso\n\nmike: crees mañana me puedas llevar a donde lo viste por ultima ves¿?\n\nrize: claro con mucho gusto, solo debo hacer una llamada y nos vemos mañana a las 12 en la calle ###### vale?\n\nmike:gracias bueno a dormir mañana nos vemos\n\nrize: asta mañana mike que duermas bien\n\nen la mañana rize no estaria en la habitacion habria salido desde mas temprano, seguramente a ver a la llamada que se refirio a mike antes de dormir. . . \n\nmike: -este se despierta mira la hora en un reloj que habia en su habitacion y ve que son las 11:40- (DIOS SE ME HARA TARDE DEBO ESTAR A LAS 12 DONDE AYER RIZE ME MATARA)\n\ntras pensarlo se prepara y saldria a la calle donde acordaron ayer para darse cuenta que llego 10 minutos antes, tras darse cuenta este decide sentarse a esperar, el tiempo pasa dan las 12\na lo lejos se veia dos siluetas ir hacia donde mike\n\nRize: MIKE!!!! -esta le grita a mike a lo lejos junto a alguien mas que no lograba reconocer pero le era familiar a mike-\n\nmike: -este va hacia con ella para quedar frente a frente con la otra persona- hey! h-hola tu eres¿?\n\nrize:oh si lo
