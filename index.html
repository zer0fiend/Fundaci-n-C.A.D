   "text": "EL COMIENZO DE UNA LARGA AVENTURA\n\nCAPÍTULO 3: LA CAÍDA DEL PRIMER SERAFÍN\n\nPrimera vida: Ryu\n\n\nPRÓLOGO — DESPUÉS DE LA ÚLTIMA ORDEN\n\nLa puerta se cerró detrás de Ryu.\n\nNo hubo un estruendo. No hizo falta.\n\nEl sonido fue apenas un golpe seco, discreto, casi insignificante en medio de la inmensidad del palacio. Sin embargo, cuando el eco se apagó, Ryu tuvo la impresión de que algo mucho más grande acababa de cerrarse con ella.\n\nSe quedó inmóvil en el corredor.\n\nLa conversación con Dios seguía resonando en su cabeza. No las palabras relacionadas con el fruto, ni las acusaciones sobre la sabiduría y la obediencia. Lo que no conseguía apartar de sus pensamientos era la manera en que Dios había dejado de mirarlo. Durante incontables eras, Ryu había conocido aquella mirada en todas sus formas: la satisfacción después de una tarea cumplida, la severidad durante una reunión, la calma de las decisiones importantes e incluso la confianza silenciosa de quien no necesita comprobar si su guardián continúa a su lado.\n\nPero nunca la había visto convertirse en desprecio.\n\nAquel cambio le dolía de una forma que no sabía nombrar.\n\nEl reino angelical seguía resplandeciendo a su alrededor. Las superficies claras del palacio reflejaban una luz uniforme; las columnas parecían no tener principio ni final; los corredores se extendían entre jardines suspendidos y terrazas desde las que podían contemplarse otros dominios. Los ángeles continuaban con sus labores. Algunos trasladaban registros de una sala a otra. Otros conversaban junto a los ventanales o se dirigían a sus puestos. La armonía del lugar permanecía intacta.\n\nY, aun así, Ryu sentía que acababa de quedarse fuera de ella.\n\nCaminó despacio.\n\nSus pasos eran conocidos por aquellas galerías. Las había recorrido acompañando a Dios, había atravesado sus salones durante reuniones que se prolongaban hasta que el resto de los presentes se retiraba y había permanecido junto a las entradas mientras el soberano recibía a los representantes de los distintos órdenes. En ocasiones, ni siquiera necesitaba hablar. Su presencia era suficiente para que los demás comprendieran que Dios no estaba solo.\n\nRyu había sido su guardián más cercano.\n\nSu protector.\n\nSu mano izquierda.\n\nNo recordaba la primera vez que había ocupado aquel lugar. Para él, aquella confianza siempre había formado parte de su existencia. Había aprendido a estar alerta antes de aprender a descansar. Había considerado natural vigilar los movimientos de quienes se acercaban al soberano, anticipar cualquier amenaza y colocarse entre Dios y aquello que pudiera ponerlo en peligro.\n\nLo había hecho sin esperar reconocimiento.\n\nLo habría hecho de nuevo, incluso después de aquella conversación.\n\nEso era lo que volvía todo más difícil.\n\nRyu no había dejado de sentir afecto por el ser al que había servido. No podía borrar incontables eras de lealtad con una sola discusión. No podía convertir de pronto cada recuerdo en una mentira. Había momentos buenos, conversaciones tranquilas, decisiones que habían parecido justas. Había confiado en Dios de una manera que no se parecía a la obediencia que otros le profesaban. No lo había seguido únicamente porque fuera su soberano. Lo había seguido porque creía comprender el propósito que compartían.\n\nAhora sabía que quizá nunca lo había comprendido.\n\nSe detuvo junto a una de las grandes aberturas del corredor.\n\nDesde allí podía contemplar el reino terrenal. La distancia hacía que sus bosques y montañas parecieran trazos delicados sobre una superficie inmensa, pero Ryu ya no los observaba como una creación lejana. Recordaba las aldeas, los caminos, las manos que se extendían hacia quienes necesitaban ayuda. Recordaba a la niña que había preguntado si debían entregar hasta el último alimento. Recordaba el agua brotando entre las piedras y al sacerdote atribuyendo el milagro a las ofrendas.\n\nRecordaba, sobre todo, la respuesta de Dios.\n\nMientras no intentaran rebelarse contra él, podían hacer lo que quisieran.\n\nRyu apoyó una mano en el borde de piedra.\n\nNo sabía qué encontraría al descender. No tenía un plan capaz de resolver los problemas de la humanidad. Tampoco podía asegurar que su intervención fuera suficiente. El conocimiento del fruto no le había entregado una solución para cada injusticia ni una forma de impedir todas las guerras. Le había dado algo menos cómodo: la capacidad de reconocer que la obediencia no convertía una decisión en justa.\n\nY, una vez comprendido eso, ya no podía regresar a la ignorancia.\n\n—Así que era cierto.\n\nLa voz llegó desde atrás.\n\nRyu cerró los ojos un instante antes de volverse. Gabriel estaba a unos pasos, con el rostro serio y las manos vacías. No llevaba registros ni documentos. Había acudido sin una razón administrativa que pudiera utilizar como excusa.\n\n—¿Qué cosa? —preguntó Ryu.\n\n—Que ibas a marcharte.\n\nRyu volvió la mirada hacia el mundo terrenal.\n\n—Sí.\n\nGabriel se acercó, aunque mantuvo cierta distancia. Durante un momento ambos contemplaron el horizonte en silencio.\n\n—El soberano está enfadado —dijo Gabriel al fin.\n\n—Lo sé.\n\n—No creo que comprendas hasta dónde puede llegar.\n\n—Creo que empiezo a comprenderlo.\n\nGabriel apretó la mandíbula.\n\n—No hablo de una discusión. No hablo de que pierdas su confianza durante unos días. Has cuestionado una orden y después has dicho que actuarás sin su permiso. Eso no es algo que vaya a dejar pasar.\n\n—No estoy intentando que lo deje pasar.\n\n—Ryu...\n\n—No puedo seguir fingiendo que no ocurre nada.\n\nGabriel se quedó callado.\n\nRyu lo miró. En el rostro de su compañero encontró preocupación, pero también algo más difícil de enfrentar: la esperanza de que todavía pudiera arrepentirse.\n\n—Dime que no crees que debamos ayudar a esas personas —pidió Ryu—. Dime que no has visto los informes. Dime que no sabes lo que sucede en el reino terrenal.\n\nGabriel bajó ligeramente la cabeza.\n\n—Lo sé.\n\n—Entonces dime que estoy equivocado.\n\nEl querubín tardó demasiado en responder.\n\n—No creo que estés equivocado al preocuparte por ellos.\n\n—Pero sí al hacer algo.\n\n—Creo que hay maneras de cambiar una situación sin destruir todo lo que existe alrededor.\n\n—¿Y quién va a cambiarla si todos esperan a que otro se atreva?\n\nGabriel levantó la mirada.\n\n—No todos tenemos tu posición.\n\nRyu comprendió lo que quería decir. Gabriel no ocupaba su lugar junto a Dios. No tenía la misma autoridad, ni era el primer ser al que el soberano llamaba cuando necesitaba protección. Para él, desobedecer no significaba perder solamente una función. Podía significar convertirse en enemigo de todo aquello que había conocido.\n\n—No te estoy pidiendo que me sigas —dijo Ryu.\n\n—No he dicho que no lo haría.\n\n—Tampoco has dicho que sí.\n\nGabriel miró hacia el palacio.\n\n—No sé qué haría si tuviera que elegir entre ambos.\n\nRyu asintió despacio. No había reproche en su expresión.\n\n—Entonces no elijas por mí.\n\n—No quiero perderte.\n\nAquella frase le llegó más hondo de lo que esperaba.\n\nRyu extendió una mano y la apoyó brevemente en el hombro de Gabriel.\n\n—Tampoco quiero perderte a ti.\n\n—Entonces quédate.\n\nRyu retiró la mano.\n\n—No puedo.\n\nGabriel cerró los ojos. Por un instante pareció que iba a insistir, pero terminó apartándose del ventanal.\n\n—Ojalá encuentres otra manera.\n\n—Ojalá la hubiera encontrado antes.\n\nGabriel se marchó sin despedirse.\n\nRyu lo siguió con la mirada hasta que desapareció al final del corredor. No sabía si volverían a hablar. No sabía si algún día Gabriel comprendería por qué había tomado aquella decisión. Lo único que sabía era que no podía quedarse para conservar una cercanía que exigía mirar hacia otro lado.\n\nRespiró profundamente.\n\nDespués continuó caminando.\n\n\nI — EL LUGAR QUE DEJARÍA VACÍO\n\nRyu llegó a la estancia que durante mucho tiempo había utilizado como puesto de guardia.\n\nNo era una habitación ostentosa. Su función no requería adornos ni objetos personales. Había una mesa de piedra, algunos registros de seguridad, un asiento junto a la pared y una abertura desde la que podía observarse la entrada principal del sector reservado a Dios. Todo permanecía en orden, como si Ryu solo hubiera salido un momento y estuviera a punto de regresar.\n\nSe acercó a la mesa.\n\nHabía un registro abierto. En él figuraban los turnos de vigilancia y las disposiciones relacionadas con los movimientos dentro del palacio. Reconoció su propia escritura en varias anotaciones. Las últimas eran recientes: una observación sobre una reunión del consejo, una indicación para reforzar la vigilancia de una de las entradas y una nota sobre la llegada de representantes de otro dominio.\n\nTareas sencillas.\n\nTareas que alguien tendría que continuar.\n\nRyu apoyó los dedos sobre el borde del registro y sintió una punzada de tristeza. No por la responsabilidad en sí, sino por lo extraño que resultaba contemplar su vida como una lista de labores que podían transferirse a otra persona. Durante tanto tiempo había pensado que su lugar era inseparable del suyo. Ahora descubría que el palacio seguiría funcionando sin él.\n\nQuizá esa era una de las primeras cosas que tendría que aceptar.\n\nSu ausencia no detendría el movimiento de los astros ni derrumbaría las columnas. Los ángeles no olvidarían sus funciones. Dios continuaría gobernando. Los reinos seguirían sus ciclos.\n\nEl universo no se detendría para lamentar su partida.\n\nRyu cerró el registro.\n\nNo se llevó nada de la estancia. No había un objeto que necesitara para demostrar quién había sido. Tampoco quería convertir su salida en una ceremonia. Se limitó a dejar todo tal como estaba y se dirigió hacia el corredor que conducía al acceso entre el reino angelical y el terrenal.\n\nA mitad del trayecto escuchó su nombre.\n\n—Ryu.\n\nEsta vez era una voz que no esperaba encontrar.\n\nZara estaba junto a una de las columnas, apartada del tránsito principal. No llevaba ningún documento y no parecía estar cumpliendo una tarea. Tenía la mirada fija en él, como si hubiera intentado decidir durante un largo rato si debía acercarse.\n\nRyu se detuvo.\n\n—Zara.\n\nElla miró primero hacia el corredor que llevaba a la estancia de Dios y después volvió a observarlo.\n\n—¿Es verdad?\n\n—Depende de lo que hayas escuchado.\n\n—Que vas a abandonar el reino.\n\nRyu no respondió enseguida.\n\n—Sí.\n\nZara bajó la mirada. No pareció sorprendida, aunque la confirmación le provocó una tensión visible en el rostro.\n\n—Pensé que todavía intentarías hablar con él.\n\n—Ya lo hice.\n\n—¿Y?\n\n—No hay nada más que decir.\n\n—Siempre hay algo más que decirle a alguien a quien has servido durante tanto tiempo.\n\nRyu sostuvo su mirada.\n\n—No cuando la otra persona ya decidió que no quiere escuchar.\n\nZara se acercó un paso.\n\n—¿Vas a hacerlo por el fruto?\n\nLa pregunta no sonó acusatoria. Parecía querer saber si aquel cambio en él había nacido de una revelación repentina o de algo que llevaba mucho tiempo creciendo.\n\n—No —respondió Ryu—. El fruto no decidió por mí. No me ordenó abandonar el palacio ni me dijo qué debía pensar de Dios. Solo hizo imposible que siguiera usando mi desconocimiento como excusa.\n\n—Entonces ya lo habías decidido antes de probarlo.\n\n—Había empezado a decidirlo cuando vi lo que sucedía abajo. El fruto me obligó a mirar sin apartar la vista.\n\nZara guardó silencio.\n\n—¿Qué harás? —preguntó después.\n\n—Descenderé al reino terrenal. Ayudaré a quienes pueda. Intentaré impedir que la fuerza de unos se convierta en la condena de otros. No sé cuánto podré hacer, pero no pienso quedarme aquí esperando a que el sufrimiento se vuelva conveniente para quienes gobiernan.\n\n—¿Y si Dios te lo prohíbe?\n\n—Ya me lo ha prohibido.\n\n—¿Y si te persigue?\n\nRyu miró hacia el horizonte que apenas podía verse desde aquel corredor.\n\n—Entonces tendré que enfrentar las consecuencias.\n\nZara respiró hondo.\n\n—No estás hablando de una misión cualquiera.\n\n—Lo sé.\n\n—Si cruzas ese límite, no vas a poder regresar como si nada hubiera ocurrido.\n\n—No espero hacerlo.\n\n—Podrías perderlo todo.\n\nRyu bajó los ojos hacia sus manos. Seguían siendo las mismas. La luz que las recorría no había cambiado. Todavía podía sentir la energía de su rango, el poder que había ejercido durante eras y la presencia de Dios en algún lugar del reino. No sabía cuánto de aquello conservaría después de abandonar el palacio.\n\n—Quizá ya empecé a perderlo —dijo.\n\nZara lo observó con una seriedad que no intentó suavizar.\n\n—¿Y no tienes miedo?\n\nRyu tardó un instante en contestar.\n\n—Sí.\n\nLa respuesta pareció sorprenderla más que cualquier otra cosa.\n\n—¿Sí?\n\n—No sé qué sucederá cuando salga de aquí. No sé si podré ayudar a alguien. No sé si los humanos confiarán en mí o si terminarán temiéndome. No sé si voy a arrepentirme de la forma en que lo estoy haciendo. Y sí, tengo miedo de perder todo lo que he conocido.\n\nMiró de nuevo hacia ella.\n\n—Pero tengo más miedo de acostumbrarme a verlo y dejar de sentir que está mal.\n\nZara no apartó la mirada.\n\n—No eres el único que ha visto esos informes.\n\n—Lo sé.\n\n—Tampoco eres el único que ha escuchado las peticiones.\n\n—Lo sé.\n\n—Y, aun así, todos seguimos aquí.\n\nRyu no intentó defender a los demás. No sabía qué temores guardaban, qué compromisos los retenían ni qué habían visto en privado. No quería juzgarlos con la misma facilidad con la que Dios había juzgado a quienes sufrían.\n\n—Cada uno tendrá que decidir qué puede soportar —respondió.\n\nZara miró hacia el suelo.\n\n—¿Y tú ya decidiste cuánto puedes soportar?\n\n—No. Decidí qué no quiero seguir soportando en silencio.\n\nDurante unos segundos el corredor pareció quedar suspendido. Al fondo, otros ángeles continuaban caminando, ajenos a la conversación o fingiendo estarlo. El palacio estaba lleno de ojos que podían observar, pero pocos parecían dispuestos a detenerse.\n\nZara se hizo a un lado para dejar pasar a un grupo de mensajeros. Esperó hasta que desaparecieron.\n\n—Voy contigo —dijo.\n\nRyu la miró.\n\n—No.\n\n—No te lo he preguntado.\n\n—Zara, no sabes lo que estás diciendo.\n\n—Sé exactamente lo que estoy diciendo.\n\n—No tienes que perder tu lugar por una decisión que es mía.\n\nElla frunció el ceño.\n\n—¿Crees que hago esto porque no puedo decidir por mí misma?\n\n—Creo que todavía puedes quedarte. Puedes ayudar desde aquí. Puedes intentar cambiar las cosas sin enfrentarte directamente a Dios.\n\n—¿Como lo has intentado tú?\n\nRyu no respondió.\n\nZara dio un paso hacia él.\n\n—No me pidas que me quede tranquila solo porque todavía tengo algo que perder.\n\n—No quiero que te ocurra lo mismo que a mí.\n\n—No sabes qué me ocurrirá.\n\n—Precisamente.\n\n—Tampoco sabes qué te ocurrirá a ti.\n\n—Eso no significa que debas acompañarme.\n\nZara sostuvo su mirada. No parecía enojada; parecía herida por la idea de que Ryu pudiera considerar su decisión una carga que debía impedirle.\n\n—No voy porque me hayas convencido —dijo—. Voy porque he visto lo suficiente para saber que no quiero seguir formando parte de un orden que llama justicia a la obediencia. No necesito que me des permiso.\n\nRyu bajó ligeramente la cabeza.\n\n—No quiero que tu elección nazca de mi caída.\n\n—Mi elección nace de mí.\n\nAquello lo dejó sin respuesta.\n\nZara miró hacia la salida.\n\n—No tienes que cargar con mi decisión. Ya tienes bastante con la tuya.\n\nRyu la contempló durante unos segundos. No sabía qué decirle. Una parte de él quería insistir hasta hacerla cambiar de parecer. Otra parte comprendía que hacerlo sería repetir el mismo error que había comenzado a cuestionar: decidir por alguien más creyendo que era por su bien.\n\n—Entonces no te detendré —dijo finalmente.\n\nZara asintió.\n\n—Bien.\n\nNo se abrazaron ni hicieron una promesa solemne. Todavía no habían cruzado nada. Todavía tenían sus alas, sus nombres y el suelo conocido bajo los pies.\n\nPero, desde aquel instante, Ryu dejó de caminar solo.\n\n\nII — EL ÚLTIMO UMBRAL\n\nEl acceso hacia el reino terrenal se encontraba más allá de las galerías principales, en una zona del palacio donde la arquitectura parecía abrirse hacia el vacío. No era una puerta construida con madera o metal. Era un umbral de energía, un límite entre dominios que permitía a quienes tenían autorización desplazarse de un reino a otro.\n\nRyu había cruzado aquel umbral en incontables ocasiones.\n\nLo había hecho para cumplir misiones, observar acontecimientos y regresar junto a Dios con informes de lo que había encontrado. Nunca había considerado que algún día tendría que atravesarlo sin saber si el camino de regreso seguiría disponible.\n\nA medida que se acercaban, el aire se volvió más frío.\n\nLos guardianes apostados en el acceso reconocieron a Ryu y se apartaron. Ninguno le pidió explicaciones. Su rango todavía era visible en la manera en que la luz lo rodeaba y en la forma en que los demás le cedían el paso. Sin embargo, algunos intercambiaron miradas al notar que Zara caminaba junto a él.\n\n—¿Debemos registrar su salida? —preguntó uno de los guardianes.\n\nRyu se detuvo.\n\n—No vengo por una misión oficial.\n\nEl guardián pareció no saber cómo responder.\n\n—Entonces... ¿regresará?\n\nRyu miró el umbral.\n\n—No lo sé.\n\nEl ángel inclinó la cabeza y se hizo a un lado.\n\nRyu dio un paso hacia la abertura. La energía del límite respondió a su presencia. Una corriente luminosa se extendió por la superficie y dibujó el contorno del paso. Más allá se encontraba el mundo terrenal, con sus montañas, sus mares, sus bosques y todas las vidas que todavía no sabían que él había tomado una decisión.\n\nEntonces el umbral se apagó.\n\nNo poco a poco.\n\nDe golpe.\n\nUna fuerza atravesó la estancia y obligó a los guardianes a retroceder. Los ángeles que se encontraban cerca interrumpieron sus conversaciones. Zara giró hacia el corredor por el que habían llegado.\n\nDios estaba allí.\n\nNo había venido acompañado por el consejo. No necesitaba hacerlo. Su presencia fue suficiente para transformar el lugar. La luz del acceso se inclinó hacia él, como si reconociera una autoridad a la que no podía oponerse. Los guardianes bajaron la cabeza de inmediato.\n\nRyu permaneció de pie.\n\nDios se detuvo a varios pasos.\n\n—¿A dónde crees que vas?\n\nLa pregunta no buscaba información.\n\n—Al reino terrenal —respondió Ryu.\n\n—Te ordené que te fueras de mi presencia. No te autoricé a abandonar tu puesto.\n\n—Mi puesto ya no existe.\n\n—Tu puesto sigue siendo el mismo que ha sido desde el principio.\n\n—No puedo cumplirlo.\n\nDios observó a Zara por un instante y después volvió la mirada hacia Ryu.\n\n—¿También has decidido traer compañía?\n\n—Zara ha decidido por sí misma.\n\n—No le he preguntado a ella.\n\n—Y yo no necesito que lo hagas.\n\nUna tensión recorrió la estancia. Algunos de los ángeles presentes bajaron aún más la cabeza. Otros se alejaron discretamente, aunque ninguno abandonó el lugar por completo.\n\nDios avanzó.\n\n—Ryu, regresa conmigo.\n\nPor un instante, la vieja costumbre casi hizo que el serafín inclinara la cabeza. Su cuerpo reconocía aquella voz. La había obedecido durante incontables eras. Una parte de él todavía esperaba que, al escuchar su nombre pronunciado de aquella manera, todo volviera a ocupar su lugar.\n\nPero recordó la niña.\n\nRecordó al padre que había entregado la cesta.\n\nRecordó las palabras de Dios: siempre tienen algo.\n\n—No —respondió.\n\nLa palabra fue breve.\n\nEl palacio entero pareció escucharla.\n\nDios se detuvo.\n\n—¿Qué has dicho?\n\n—Que no voy a regresar.\n\n—No has comprendido la gravedad de lo que estás haciendo.\n\n—Sí la comprendo.\n\n—Has consumido algo que te estaba prohibido. Has permitido que una información incompleta altere tu juicio. Estás confundiendo la compasión con la autoridad.\n\n—No necesito autoridad para reconocer el sufrimiento.\n\n—Necesitas obedecer para que el orden sobreviva.\n\n—¿Un orden que exige que los débiles soporten todo lo que los fuertes decidan?\n\nDios cerró la mano.\n\n—No estás en posición de juzgarme.\n\n—No pretendo ocupar tu lugar.\n\n—Entonces vuelve al tuyo.\n\nRyu respiró profundamente.\n\n—Mi lugar está donde alguien necesita protección.\n\nDios lo observó durante un largo momento. La expresión de su rostro no mostraba sorpresa. Mostraba una decepción fría, casi ofendida, como si Ryu hubiera incumplido un deber que no podía discutirse.\n\n—Te di un lugar a mi lado —dijo—. Te concedí una posición que ningún otro serafín ha tenido. Te confié mi seguridad, mis decisiones y el acceso a mi presencia. Fuiste el primero al que permití acercarse cuando todos los demás debían esperar. ¿Y así me lo pagas?\n\nRyu sintió que aquellas palabras se hundían en él.\n\nNo porque fueran falsas. Había recibido aquella confianza. Había sido importante. Había protegido a Dios, había compartido sus espacios y había defendido su autoridad ante los demás.\n\nPero nunca había pensado que todo aquello fuera una deuda que le impidiera reconocer una injusticia.\n\n—Te protegí durante eras —dijo, con la voz baja—. Lo habría seguido haciendo.\n\n—Entonces hazlo.\n\n—No puedo protegerte de las consecuencias de tus propias decisiones.\n\nLa mirada de Dios se endureció.\n\n—Cuidado.\n\n—No quiero quitarte el trono. No quiero gobernar el reino angelical ni ocupar tu lugar. No quiero que los humanos me adoren ni que me entreguen tributos. Quiero que dejen de sufrir por decisiones que podrían evitarse. Quiero que alguien les enseñe a vivir sin convertir el miedo en una ley.\n\n—No te corresponde decidir qué necesitan.\n\n—A ti tampoco debería corresponderte decidir que no importan.\n\nZara observó a Ryu con una mezcla de preocupación y reconocimiento. Los guardianes permanecían inmóviles.\n\nDios extendió una mano hacia el umbral. La abertura desapareció por completo.\n\n—No cruzarás.\n\nRyu miró la energía extinguida.\n\n—No puedes mantenerme aquí para siempre.\n\n—No necesito hacerlo. Solo necesito que recuerdes quién eres.\n\n—Lo recuerdo.\n\n—Eres mi serafín.\n\n—Soy Ryu.\n\n—Eres mi protector.\n\n—También soy responsable de lo que puedo hacer con el poder que me fue confiado.\n\n—Tu poder me pertenece.\n\nRyu guardó silencio.\n\nAquella frase contenía algo que jamás había querido considerar. Durante eras había entendido sus capacidades como parte de la función que desempeñaba. No se había preguntado si eran propias, concedidas o compartidas. Había utilizado su fuerza para servir a Dios y proteger el orden celestial, convencido de que ambos propósitos eran inseparables.\n\nAhora comprendía que el soberano veía su poder como una extensión de su propiedad.\n\n—Entonces retíralo —dijo.\n\nZara giró hacia él.\n\n—Ryu...\n\nÉl no apartó la mirada de Dios.\n\n—Si crees que mi poder es lo único que me mantiene aquí, retíralo. Pero no voy a decir que no vi lo que vi.\n\nDurante un instante, Dios pareció no reconocerlo.\n\n—No sabes lo que estás pidiendo.\n\n—Sé que no quiero seguir siendo tu guardián mientras me ordenas abandonar a quienes necesitan ayuda.\n\n—Te arrepentirás.\n\n—Tal vez.\n\nRyu bajó los brazos a los costados.\n\n—Pero no voy a regresar solo para dejar de sentirme culpable.\n\nDios dejó de intentar convencerlo.\n\nSu rostro perdió cualquier rastro de paciencia.\n\n—Entonces no volverás a ocupar tu lugar.\n\n\nIII — LA SENTENCIA\n\nEl primer cambio ocurrió en la luz.\n\nNo fue un destello ni una explosión. Fue una alteración profunda, como si algo que mantenía unido el espacio hubiera sido retirado. La claridad que rodeaba a Ryu comenzó a vibrar. Los bordes de sus alas se estremecieron y la energía que recorría su cuerpo respondió a una fuerza que no venía del exterior.\n\nRyu comprendió que Dios había comenzado a retirarle el poder.\n\nPor primera vez en su existencia, sintió que su propia luz podía abandonarlo.\n\nIntentó respirar con calma.\n\n—Mi señor... —murmuró uno de los guardianes.\n\nDios levantó una mano sin mirarlo.\n\nEl ángel calló.\n\n—Has confundido la confianza que te concedí con libertad para desafiarme —dijo Dios—. Has olvidado que tu rango existe por mi voluntad.\n\nRyu no contestó.\n\n—Has utilizado el conocimiento para justificar tu desobediencia. Has cuestionado mi autoridad delante de otros y has decidido actuar contra mis órdenes. No eres un protector si no puedes obedecer a quien te dio la fuerza para proteger.\n\nLa energía que rodeaba a Ryu se contrajo.\n\nUn dolor agudo le atravesó el pecho.\n\nNo era como una herida física. Era una ausencia que empezaba a abrirse desde dentro, como si partes de su existencia estuvieran siendo arrancadas de un lugar al que habían pertenecido siempre. Sus manos temblaron. Las luces que las recorrían se apagaron una tras otra.\n\nRyu apretó los dientes.\n\nHabía soportado heridas en otros tiempos. Había permanecido de pie bajo fuerzas que habrían obligado a retirarse a otros ángeles. El dolor no era desconocido para él.\n\nPero aquello era diferente.\n\nNo estaba siendo derrotado por un enemigo.\n\nEstaba siendo despojado por el ser al que había protegido.\n\n—Detente —dijo Zara.\n\nDios no la miró.\n\n—Esto no te concierne.\n\n—Está sufriendo.\n\n—Está recibiendo las consecuencias de sus actos.\n\nRyu sintió que sus rodillas cedían apenas. Se sostuvo con una mano contra el suelo antes de caer. El resplandor que había acompañado su cuerpo desde el principio se debilitó. Ya no podía sentir con claridad la extensión de su propia fuerza. Los vínculos que lo conectaban con el reino angelical se apagaban como luces al final de un corredor.\n\nDios se acercó.\n\n—Mírame.\n\nRyu levantó la cabeza.\n\nDurante un segundo, volvió a ver al soberano al que había servido. No al juez que lo condenaba ni al gobernante que exigía obediencia, sino al ser con quien había compartido incontables eras. Recordó su voz llamándolo para una tarea, sus silencios durante las reuniones y la confianza con la que alguna vez le había permitido permanecer a su lado.\n\nTodavía quería encontrar allí alguna señal de que aquello podía detenerse.\n\n—No tienes que hacerlo de esta manera —alcanzó a decir.\n\nDios lo miró sin vacilar.\n\n—Tú elegiste esta manera.\n\nEntonces la fuerza cambió de dirección.\n\nRyu sintió que algo se tensaba en su espalda. El dolor se volvió insoportable y una exhalación rota escapó de su garganta. Sus alas, que durante eras habían sido parte de su existencia, se extendieron involuntariamente. La luz que las recorría comenzó a desprenderse en fragmentos.\n\nPor primera vez, Ryu no pudo sostenerlas.\n\n—¡Mi señor, basta! —exclamó alguien entre los presentes.\n\nNo supo quién había hablado.\n\nDios no se detuvo.\n\nLa fuerza que lo sujetaba se cerró alrededor de las alas. Ryu intentó incorporarse, pero ya no tenía el control de su cuerpo. La luz se desgarró a lo largo de su espalda y el dolor le borró cualquier pensamiento ordenado.\n\nNo fue un corte limpio.\n\nFue una separación brutal.\n\nLas alas dejaron de responderle. La energía que las mantenía unidas a él se quebró y una claridad blanca llenó el acceso. Durante un instante, los presentes no pudieron distinguir nada. Luego el resplandor disminuyó.\n\nRyu estaba de rodillas.\n\nDetrás de él ya no había alas.\n\nEn el suelo quedaron rastros de luz que se desvanecían antes de tocar por completo la piedra. No había nada que pudiera recoger. Nada que pudiera volver a colocarse en su lugar. Aquello que lo había acompañado desde el principio había sido retirado de su cuerpo y convertido en un recuerdo que ni siquiera podía sostener entre las manos.\n\nRyu respiraba con dificultad.\n\nLa espalda le ardía. El pecho le pesaba. El mundo parecía haberse vuelto demasiado grande y demasiado distante.\n\nIntentó levantar una mano.\n\nNo apareció ninguna luz.\n\nIntentó convocar la energía que antes había respondido a su voluntad.\n\nNo ocurrió nada.\n\nSu poder había desaparecido.\n\nNo estaba dormido ni debilitado. No podía alcanzarlo. Era como si una puerta que había existido dentro de él durante toda su vida hubiera sido cerrada desde el otro lado.\n\nRyu miró sus manos.\n\nSeguían allí.\n\nSu cuerpo seguía allí.\n\nPero ya no reconocía del todo la sensación de estar dentro de sí mismo.\n\nDios observó el resultado sin acercarse más.\n\n—Desde este momento, tu nombre queda apartado de la jerarquía celestial. No hablarás en nombre del reino. No tendrás autoridad sobre sus órdenes ni derecho a regresar a mi presencia.\n\nRyu levantó la mirada.\n\n—No hablaba en nombre del reino.\n\n—Ya no hablarás en nombre de nada que me pertenezca.\n\n—Entonces hablaré por mí mismo.\n\nLa respuesta fue débil, pero llegó con claridad.\n\nDios hizo un gesto.\n\nEl umbral se abrió detrás de Ryu. Ya no mostraba un camino controlado ni una salida segura. Era una abertura inestable hacia el reino terrenal, distante y oscura desde aquella altura.\n\n—Serás expulsado —declaró Dios—. No volverás a caminar por estos corredores. No volverás a ocupar el lugar que tuviste. Tu rango, tu poder y tu protección quedan retirados.\n\nRyu intentó ponerse de pie.\n\nSus piernas apenas lo sostuvieron.\n\nZara dio un paso, pero dos guardianes se movieron para cerrarle el camino. Ella se detuvo, con las manos tensas a los costados.\n\n—No puedes simplemente arrojarlo —dijo.\n\nDios se volvió hacia ella.\n\n—No he pedido tu opinión.\n\n—Entonces escucha lo que tienes delante aunque no lo hayas pedido.\n\nLos guardianes quedaron inmóviles. Nadie parecía respirar.\n\nRyu levantó la cabeza hacia Zara.\n\nNo quería que hablara. No quería que se interpusiera. Ya había perdido sus alas y su poder; no necesitaba que ella perdiera algo por intentar defenderlo.\n\nPero no tenía fuerza para detenerla.\n\nDios observó a Zara con una expresión más fría.\n\n—Apártate.\n\nElla no se movió.\n\n—No.\n\nLa palabra fue distinta a la de Ryu. No llevaba el peso de una despedida. Era una negativa que todavía no había sido puesta a prueba.\n\nDios volvió a mirar al serafín caído.\n\n—Tu decisión ha sido tomada. Saldrás de este reino.\n\nRyu intentó hablar, pero el dolor le impidió formar una frase completa.\n\nEl gesto de Dios fue suficiente.\n\nUna fuerza invisible golpeó a Ryu en el pecho y lo lanzó hacia el umbral.\n\nSu cuerpo atravesó la abertura.\n\nPor un instante, alcanzó a ver el palacio, las columnas y las figuras reunidas al otro lado. Vio a Gabriel entre los presentes, inmóvil, con el rostro descompuesto. Vio a Zara intentando avanzar. Vio a Dios de pie, sin apartar la mirada.\n\nDespués, el reino angelical desapareció.\n\n\nIV — LA ELECCIÓN DE ZARA\n\nEl silencio que quedó en el acceso fue más duro que el estruendo de la expulsión.\n\nNadie se movió de inmediato.\n\nLos guardianes permanecieron junto al umbral, incapaces de decidir si debían cerrarlo. Los ángeles que habían presenciado la sentencia mantenían los ojos bajos. Algunos parecían horrorizados. Otros evitaban mirar a Dios. Ninguno se atrevía a hablar.\n\nZara seguía en el mismo lugar.\n\nHabía visto a Ryu desaparecer, pero todavía sentía su presencia más allá de la abertura. No sabía en qué estado había llegado al otro lado ni si seguía consciente. Solo sabía que lo habían arrojado sin alas, sin poder y con heridas que no podía imaginar por completo.\n\nDios se volvió hacia ella.\n\n—Ahora apártate.\n\nZara miró el umbral.\n\n—¿Por qué lo hiciste?\n\n—Porque desobedeció.\n\n—No. Te pregunté por qué lo hiciste.\n\nLa expresión de Dios se endureció.\n\n—No confundas tu posición con la suya. No has recibido su autoridad ni su cercanía. No te corresponde interrogarme.\n\n—Entonces no me pidas que vea esto y finja que no ocurrió.\n\n—Lo que ocurrió es una consecuencia de su elección.\n\n—Él eligió ayudar a quienes sufren.\n\n—Eligió ponerse por encima de mi voluntad.\n\nZara respiró con fuerza.\n\n—No quería tu lugar.\n\n—Eso no cambia su traición.\n\n—No fue una traición.\n\nDios se acercó un paso.\n\n—Cuidado, Zara. Todavía puedes regresar a tus funciones. Todavía puedes apartarte de esta disputa y continuar con tu vida.\n\n—¿Y qué se supone que debo hacer con lo que acabo de ver?\n\n—Olvidarlo.\n\nLa respuesta la dejó inmóvil durante un instante.\n\nDios continuó:\n\n—Ryu ha elegido el camino de la desobediencia. Ha rechazado el lugar que se le concedió. Si decides seguirlo, perderás tu posición dentro de este reino. No habrá una puerta abierta para tu regreso. No habrá un lugar reservado para ti en el consejo ni protección para tus decisiones.\n\nZara bajó la mirada hacia sus propias manos.\n\nTodavía conservaba su luz. Sus alas seguían extendidas detrás de ella, intactas. Podía sentir su fuerza, aunque el ambiente comenzaba a presionarla. Todavía tenía la posibilidad de marcharse de aquella estancia, volver a sus tareas y convencerse de que nada de aquello le correspondía.\n\nPodía conservar su vida.\n\nPodía conservar su puesto.\n\nPodía seguir siendo parte del reino angelical sin tener que explicar por qué había permanecido al lado de un serafín expulsado.\n\nPero entonces recordó la expresión de Ryu antes de que Dios lo arrojara al umbral. No había visto odio en sus ojos. Había visto dolor, decepción y una voluntad que todavía se negaba a desaparecer.\n\nZara comprendió que, si regresaba a sus funciones, algo dentro de ella tendría que aceptar aquella sentencia como justa.\n\nY no podía hacerlo.\n\n—No voy a olvidarlo —dijo.\n\nDios guardó silencio.\n\n—Zara, no te estoy dando otra oportunidad.\n\n—Lo sé.\n\n—Entonces entiende que, si cruzas, dejarás de pertenecer a este orden.\n\nElla levantó la mirada.\n\n—Quizá pertenecer a un lugar no debería significar obedecerlo incluso cuando hace daño.\n\n—No sabes lo que te espera abajo.\n\n—Tampoco lo sabía él.\n\nZara dio un paso hacia el umbral.\n\nUno de los guardianes intentó detenerla. Ella extendió una mano y una corriente de energía lo obligó a retroceder. No fue un ataque destinado a herirlo. Fue un aviso, la primera acción que realizaba contra una orden directa del reino al que había pertenecido.\n\nEl guardián no volvió a acercarse.\n\n—Zara —dijo Dios.\n\nElla se detuvo una última vez.\n\n—No voy a seguirlo porque crea que siempre tendrá razón —dijo—. No sé si la tendrá. No sé si sus decisiones serán mejores que las tuyas en cada ocasión. Pero sé que no puedo quedarme aquí después de haber visto cómo lo castigaste por negarse a abandonar a otros.\n\nDios la observó con frialdad.\n\n—Entonces tu elección queda registrada.\n\nLa luz que rodeaba a Zara cambió.\n\nSintió que una parte de su energía se apagaba. No fue el mismo desgarro que había sufrido Ryu. No le arrancaron las alas ni la dejaron despojada de toda capacidad. Pero el vínculo que la unía a la jerarquía celestial se debilitó y una parte de su poder dejó de responderle. Su resplandor perdió intensidad, como una llama a la que se le ha retirado el aire.\n\nSus alas permanecieron.\n\nZara las movió con dificultad. Seguían siendo suyas. Seguía pudiendo extenderlas y sentir el impulso que nacía en ellas, aunque algo en su fuerza había cambiado.\n\nDios no hizo ningún otro gesto.\n\n—Sal de mi reino.\n\nZara miró una última vez el palacio.\n\nHabía vivido allí. Había cumplido sus tareas, conocido sus corredores y aprendido a reconocer las voces que llenaban sus salas. No todo lo que dejaba atrás era cruel. Había personas a las que apreciaba, recuerdos que no deseaba perder y una vida que, hasta hacía poco, no había imaginado abandonar.\n\nNo salió sin tristeza.\n\nNo salió sin miedo.\n\nPero salió.\n\nCruzó el umbral con las alas extendidas y desapareció de la vista de quienes permanecieron en el reino angelical.\n\nGabriel dio un paso hacia la abertura.\n\nNo llegó a cruzarla.\n\nZara ya había tomado su decisión.\n\nY él seguía sin saber cuál sería la suya.\n\n\nV — ENTRE EL CIELO Y LA TIERRA\n\nEl descenso no se pareció a ninguno de los viajes que Ryu había realizado antes.\n\nNo hubo un trayecto claro ni una transición ordenada entre dominios. El umbral lo había expulsado con tanta fuerza que su cuerpo atravesó varias capas de energía antes de alcanzar el espacio abierto. La luz del reino angelical quedó arriba, cada vez más distante, mientras el mundo terrenal se extendía debajo de él.\n\nRyu no podía detener la caída.\n\nIntentó extender las alas por instinto.\n\nNo encontró nada.\n\nEl movimiento le arrancó un gemido. La espalda le ardía y cada vez que intentaba incorporarse sentía que su cuerpo se deshacía bajo una presión que no sabía controlar. Buscó dentro de sí la energía que antes habría acudido a su llamado. Encontró únicamente un silencio profundo.\n\nNo podía volar.\n\nNo podía protegerse.\n\nNo podía siquiera sostenerse en el aire.\n\nPor primera vez, el mundo tenía poder sobre él.\n\nLas nubes pasaron a su alrededor. El aire golpeó su rostro y se llevó las últimas partículas de luz que todavía permanecían sobre su cuerpo. Ryu giró sin control, perdió de vista el horizonte y volvió a encontrarlo unos segundos después.\n\nLa tierra se acercaba.\n\nMontañas oscuras. Extensiones de bosque. Un río que reflejaba la claridad del cielo. Lugares que había observado desde el reino angelical, pero que nunca había tenido que enfrentar desde aquella perspectiva.\n\nEl mundo que había prometido proteger no lo recibió con una bienvenida.\n\nLo recibió con gravedad, viento y una caída que podía terminar con su vida.\n\nRyu intentó pensar.\n\nSi lograba concentrarse, quizá podría convocar una pequeña parte de su antiguo poder. Quizá la expulsión no había destruido todo. Quizá solo necesitaba tiempo para recuperar el control.\n\nCerró los ojos y buscó la energía.\n\nNada.\n\nVolvió a intentarlo.\n\nNada.\n\nEl miedo apareció entonces, no como una idea, sino como una sensación física. Se extendió por su pecho y le hizo comprender que, si no encontraba una manera de sobrevivir al impacto, no podría ayudar a nadie.\n\nLa ironía era insoportable.\n\nHabía abandonado el palacio para proteger vidas y ahora no sabía cómo conservar la propia.\n\n—Ryu.\n\nLa voz llegó desde algún lugar detrás de él.\n\nAl principio creyó que era un recuerdo. Después vio una figura acercándose entre las corrientes de aire.\n\nZara.\n\nSus alas se extendían a ambos lados de su cuerpo. No se movía con la fuerza ni con la facilidad que habría tenido antes de perder parte de sus capacidades, pero todavía podía volar. Cada movimiento parecía exigirle un esfuerzo considerable. La luz a su alrededor era menos intensa que en el reino angelical, aunque no había desaparecido.\n\n—¡Ryu!\n\nÉl intentó responder.\n\nSolo consiguió expulsar aire.\n\nZara se acercó por un costado, cuidando de no golpearlo con las alas. Extendió una mano hacia él y trató de formar una corriente de energía que redujera la velocidad de la caída.\n\nLa fuerza que logró reunir se deshizo casi de inmediato.\n\nEl descenso continuó.\n\nZara apretó los dientes y volvió a intentarlo.\n\nUna segunda corriente envolvió parcialmente a Ryu. No fue suficiente para detenerlo, pero consiguió cambiar su trayectoria. Ambos se desviaron hacia una zona de bosque donde el terreno se abría entre árboles altos y una ladera de piedra.\n\n—¡Tienes que mantenerte consciente! —gritó ella.\n\nRyu abrió los ojos.\n\n—No... puedo...\n\n—No hables. Ahorra fuerzas.\n\nZara volvió a concentrarse. Sus alas se tensaron y el aire respondió con una vibración irregular. Por un momento creyó que conseguiría sostenerlo. Después una ráfaga los separó.\n\nRyu cayó hacia un costado.\n\n—¡Ryu!\n\nZara giró con dificultad y se lanzó tras él.\n\nLa distancia entre ambos se acortó. Ella extendió una mano y alcanzó a rozar su brazo. El contacto bastó para cambiar otra vez la trayectoria, aunque el impulso la arrastró también hacia abajo.\n\nEl suelo estaba demasiado cerca.\n\nZara tuvo que elegir entre intentar salvarlo por completo y evitar que ambos se estrellaran sin posibilidad de levantarse. No tenía fuerza suficiente para sostenerlos a los dos. Tampoco podía detener el tiempo ni abrir un camino de regreso.\n\nReunió lo que le quedaba de energía y la dirigió hacia el terreno.\n\nLa corriente golpeó las copas de los árboles. Las ramas se doblaron y varias se quebraron. Una parte del impulso se perdió entre las hojas, pero la caída dejó de ser completamente vertical.\n\nRyu atravesó las ramas de un árbol y cayó sobre una pendiente cubierta de tierra y vegetación. El impacto lo hizo rodar hasta una zona más baja, donde chocó contra el suelo rocoso.\n\nEl mundo se volvió blanco.\n\nDespués, oscuro.\n\nZara alcanzó el terreno unos instantes más tarde. Sus alas se abrieron de golpe para frenar el descenso y rozaron varias ramas antes de que lograra aterrizar. Cayó de rodillas, se sostuvo con una mano y permaneció así durante unos segundos, respirando con dificultad.\n\nEl silencio del bosque regresó poco a poco.\n\nNo era el silencio del reino angelical. Allí siempre existía una armonía lejana, una vibración que parecía sostener cada cosa en su lugar. En el mundo terrenal había sonidos pequeños y desordenados: hojas que se movían, agua a la distancia, insectos ocultos entre la vegetación y el viento atravesando las copas.\n\nZara levantó la cabeza.\n\n—Ryu...\n\nNo obtuvo respuesta.\n\nSe puso de pie con dificultad y comenzó a buscarlo.\n\n\nVI — LO QUE QUEDA DESPUÉS DE LAS ALAS\n\nRyu estaba tendido junto a una formación de rocas, parcialmente cubierto por hojas y tierra. Su cuerpo había dejado un rastro en la pendiente. Tenía los ojos cerrados y respiraba de forma irregular.\n\nZara se arrodilló a su lado.\n\n—Ryu. ¿Puedes escucharme?\n\nNo hubo respuesta.\n\nLe apartó algunas ramas del rostro y comprobó que seguía respirando. Aquello le permitió soltar el aire que llevaba reteniendo desde el impacto.\n\n—Bien —murmuró—. Bien. Todavía estás aquí.\n\nIntentó utilizar su poder para aliviar las heridas, pero la energía apenas respondió. Una luz tenue apareció entre sus dedos y desapareció casi de inmediato. Zara volvió a intentarlo, concentrándose más, aunque el esfuerzo le provocó un mareo.\n\nNo tenía suficiente fuerza.\n\nMiró a su alrededor.\n\nEl bosque se extendía en todas direcciones. No había columnas, guardianes ni caminos construidos por manos celestiales. Tampoco había una señal que indicara dónde se encontraban. El cielo era inmenso y el sol se filtraba entre las ramas con una naturalidad que le resultó extraña.\n\nEstaban solos.\n\nZara volvió a mirar a Ryu.\n\nHasta unas horas antes, él había sido el serafín de mayor rango, el protector más cercano a Dios y una de las figuras más respetadas del reino angelical. Había cruzado aquel mundo sin temor porque el mundo no podía hacerle demasiado daño. Sus alas lo elevaban por encima de los peligros y su poder respondía antes de que necesitara pedirlo.\n\nAhora estaba tendido sobre la tierra.\n\nSin alas.\n\nSin poder.\n\nSin la protección del reino al que había pertenecido desde el principio.\n\nZara extendió una mano y la colocó con cuidado junto a la suya.\n\n—No sé si puedes escucharme —dijo—, pero no voy a dejarte aquí.\n\nRyu movió apenas los dedos.\n\nZara se inclinó de inmediato.\n\n—¿Ryu?\n\nLos párpados del serafín temblaron. Abrió los ojos durante un instante. La luz que antes parecía habitar en ellos estaba apagada, reemplazada por el desconcierto de alguien que no sabía dónde se encontraba.\n\nMiró las ramas que se extendían sobre su cabeza.\n\nEl cielo se veía entre ellas.\n\nNo era el cielo desde el que había observado el mundo durante eras. No era la superficie distante que había contemplado desde los balcones del palacio. Estaba demasiado cerca. Podía ver las hojas, las pequeñas imperfecciones de la corteza y la luz moviéndose sobre ellas.\n\nIntentó incorporarse.\n\nEl dolor lo obligó a detenerse.\n\n—No te muevas —dijo Zara—. Estás herido.\n\nRyu la miró. Tardó un momento en reconocerla.\n\n—Zara...\n\n—Estoy aquí.\n\nÉl quiso preguntar dónde estaban, pero la voz no le respondió. Bajó la mirada hacia su cuerpo y después intentó volver a extender las alas.\n\nNo encontró nada.\n\nSu expresión cambió.\n\nZara supo que lo había comprendido.\n\n—No intentes hacerlo —murmuró—. No ahora.\n\nRyu volvió a mirar el cielo.\n\nPor instinto, buscó la presencia del reino angelical. Intentó reconocer la energía de las jerarquías, la corriente que conectaba a los seres celestiales con su hogar y la voz de Dios en algún lugar por encima de los dominios.\n\nNo encontró nada que pudiera alcanzar.\n\nEl silencio fue absoluto.\n\n—Ya no puedo... —susurró.\n\nZara no respondió enseguida.\n\nNo quería mentirle. Tampoco quería obligarlo a aceptar en aquel instante todo lo que había perdido.\n\n—Ahora no tienes que demostrar nada —dijo finalmente—. Solo respira.\n\nRyu cerró los ojos.\n\nDurante un momento pareció intentar obedecerla, aunque su respiración seguía siendo irregular. El cuerpo no le respondía como antes. Cada movimiento parecía exigirle una voluntad que apenas podía reunir.\n\nZara miró su espalda y apartó con cuidado la tela dañada por la caída. No encontró alas, ni el resplandor que solía rodear sus raíces. Solo heridas y una ausencia que no sabía cómo reparar.\n\nApartó la mirada.\n\nNo quería que Ryu tuviera que verla llorar.\n\nPero las lágrimas llegaron de todos modos.\n\nNo lloró por el palacio, ni por el puesto que había perdido, ni siquiera por la parte de su poder que ya no respondía. Lloró porque comprendió que Ryu había tenido que soportar el castigo de Dios sin que nadie pudiera detenerlo. Lloró porque lo había visto caer y no había podido evitar el impacto. Lloró porque, por primera vez, no tenía una respuesta para lo que venía después.\n\nSe limpió el rostro con el dorso de la mano.\n\n—Escúchame —dijo, acercándose otra vez—. No sé dónde estamos. No sé cuánto tardaremos en encontrar ayuda y no sé qué queda de nuestras capacidades. Pero saldremos de aquí.\n\nRyu abrió los ojos apenas.\n\n—No tenías que venir.\n\nZara soltó una risa breve, quebrada por el cansancio.\n\n—Ya hablamos de eso.\n\n—Podrías... haberlo perdido todo.\n\n—Perdí mi lugar en el reino. No perdí la capacidad de elegir.\n\nRyu intentó decir algo más.\n\n—No quiero que te arrepientas —murmuró.\n\n—No me pidas que me arrepienta antes de saber qué vamos a vivir.\n\nÉl guardó silencio.\n\nZara le sostuvo la mano.\n\n—No sé qué ocurrirá mañana —continuó—. Ni siquiera sé si podremos levantarnos cuando amanezca. Pero hoy estás vivo. Y yo también. Empezaremos por eso.\n\nRyu la miró por última vez antes de que el cansancio lo venciera.\n\n—Gracias...\n\nLa palabra apenas fue un susurro.\n\nDespués sus ojos se cerraron.\n\nZara permaneció junto a él, escuchando su respiración y observando el bosque. No podía regresar al reino angelical. No podía pedir ayuda a los guardianes ni convocar a quienes habían permanecido en el palacio. El cielo que había conocido estaba ahora por encima de ella, inaccesible.\n\nSus alas seguían extendidas a su espalda, aunque parte de su fuerza se había apagado. Las plegó lentamente para no lastimarse más.\n\nEl viento movió las copas de los árboles.\n\nPor primera vez, Zara comprendió que conservar las alas no significaba conservar el hogar.\n\nMiró hacia el cielo.\n\nNo pidió que Dios cambiara de opinión.\n\nNo pidió que el umbral se abriera.\n\nSolo permaneció allí, al lado del serafín que había elegido proteger a los demás incluso cuando eso significaba perder todo aquello que lo había definido.\n\nY, en algún lugar muy por encima de las nubes, el reino angelical continuó brillando como si nada hubiera ocurrido.\n\n\nEPÍLOGO — LOS QUE EL CIELO DEJÓ ATRÁS\n\nDesde el reino angelical, la caída de Ryu fue registrada como una expulsión.\n\nSu nombre dejó de aparecer entre los órdenes activos. Sus funciones fueron retiradas y su puesto quedó disponible para que otra figura lo ocupara. Las puertas que antes se abrían ante él ya no reconocerían su presencia. Los registros fueron corregidos y la historia oficial recibió una versión sencilla: el primer serafín había desobedecido y había sido apartado de la jerarquía.\n\nNo se escribió cuánto tiempo había servido.\n\nNo se escribió a quién había protegido.\n\nNo se escribió que su última petición había sido que los humanos dejaran de sufrir.\n\nEl palacio siguió funcionando.\n\nGabriel regresó a sus tareas, aunque las palabras de Ryu permanecieron en su memoria. Los guardianes recibieron nuevas instrucciones. Los demás ángeles aprendieron a no mencionar la caída en voz alta. Algunos se preguntaron en privado qué había ocurrido realmente; otros prefirieron aceptar la explicación del soberano.\n\nDios volvió a mirar hacia el reino terrenal.\n\nSu autoridad permanecía intacta.\n\nSus templos seguían recibiendo ofrendas.\n\nY, abajo, los humanos continuaban viviendo sin saber que el ser que había sido el protector más cercano del soberano acababa de ser expulsado por negarse a abandonarlos.\n\nEn el bosque, Zara levantó la vista cuando la luz del día comenzó a cambiar.\n\nRyu seguía inconsciente.\n\nNo sabía si al despertar recordaría todo con claridad. No sabía cuánto tardaría en recuperarse ni si alguna vez volvería a sentir el poder que había perdido. Tampoco sabía cómo explicarles a los humanos quién era, qué había sido o por qué había llegado desde el cielo sin alas.\n\nNo tenía respuestas.\n\nSolo tenía una decisión.\n\nSe acomodó junto a Ryu y extendió una de sus alas para protegerlo del viento.\n\nEl primer serafín había caído.\n\nPero su caída no había conseguido devolverlo a la obediencia.\n\nY Zara, que pudo quedarse en el cielo, había elegido compartir con él el mundo que ambos tendrían que aprender a habitar.\n\nLa historia de Ryu ya no se escribiría desde un trono.\n\nComenzaría desde la tierra.\n\n\nFIN DEL CAPÍTULO 3\n\n«A Ryu le arrancaron las alas por negarse a mirar hacia otro lado. Zara conservó las suyas porque, aun después de conocer el precio, decidió acompañarlo».\n\nCONTINUARÁ…\n\nCapítulo 4: Un cielo que ya no responde.\n"
  }

<script id="lore" type="text/plain">caracteristicas de la Linea alterna D-345
religion dominante de la realidad

Nombre de la religión: Aurantheísmo

Principios fundamentales:

Adoración de los Elementos: Los seguidores del Aurantheísmo creen en la existencia de cuatro elementos primordiales que forman la base de toda creación: tierra, agua, fuego y aire. Cada elemento representa una fuerza divina única y poderosa.

Ciclo de Renacimiento: La religión enseña que la vida es un ciclo eterno de muerte y renacimiento. Después de la muerte, el alma viaja a través de los reinos de los elementos, experimentando purificación y renovación antes de renacer en el mundo mortal.

Templos Elementales: Los templos del Aurantheísmo están dedicados a cada uno de los elementos. Cada templo es construido de manera que refleje y honre al elemento al que está dedicado. Los rituales y ceremonias se realizan en función de la conexión con el elemento respectivo.

Sacerdotes Elementalistas: Los líderes espirituales de la religión son los Elementalistas, sacerdotes que han demostrado una afinidad especial con uno de los elementos. Cada uno de ellos dirige un templo elemental y guía a los fieles en la comprensión y veneración de su elemento específico.

Ofrendas y Rituales: Los seguidores del Aurantheísmo realizan ofrendas regulares a los elementos, expresando gratitud y buscando su favor. Los rituales incluyen danzas, cánticos y ceremonias que simbolizan la armonía entre los elementos.

Códigos de Conducta Elemental: Se espera que los seguidores del Aurantheísmo vivan de acuerdo con los códigos de conducta específicos asociados con cada elemento. Por ejemplo, la lealtad y la determinación son virtudes para aquellos que siguen el camino del fuego, mientras que la paciencia y la adaptabilidad son fundamentales para los devotos del agua.

Astrología Elemental: La religión también abraza la astrología elemental, creyendo que la posición y movimiento de los astros influyen en la energía de los elementos en la tierra. Los sacerdotes Elementalistas son responsables de interpretar estos signos y aconsejar a la comunidad sobre cómo armonizarse con las fuerzas cósmicas.

El Aurantheísmo proporciona un marco espiritual y cultural para la sociedad de la Edad Antigua, influyendo en la forma en que las personas interactúan con la naturaleza, entre sí y con el mundo espiritual que creen que los rodea.

Nombre del lenguaje: Celestia

Características principales:

Alfabeto Celestiano: Celestia utiliza un alfabeto único compuesto por símbolos estilizados que representan los elementos naturales y cósmicos fundamentales. Cada símbolo tiene una conexión simbólica con la filosofía del Aurantheísmo.

Armonía Silábica: Las palabras en Celestia se construyen mediante una combinación de sílabas armoniosas que reflejan la creencia en la armonía entre los elementos. Las sílabas fluyen suavemente, imitando los ciclos naturales y ritmos celestiales.

Infusiones Elementales: Algunas palabras en Celestia llevan consigo "infusiones elementales", son pequeñas marcas o acentos que indican la conexión de la palabra con uno de los elementos. Estas infusiones añaden un matiz de significado relacionado con el elemento correspondiente.

Flexibilidad Poética: Celestia es un lenguaje flexible y poético. Los versos y las canciones son una parte integral de la expresión lingüística, y muchos textos religiosos y ceremonias rituales se llevan a cabo en forma de poesía.

Construcción Simbólica de Frases: La estructura de las frases en Celestia a menudo refleja la estructura de los rituales y la adoración en el Aurantheísmo. Las oraciones están diseñadas para evocar imágenes visuales y conceptos espirituales.

Ritmo Melódico: La pronunciación de Celestia tiene un ritmo melódico, y la entonación de las palabras a menudo se ajusta para imitar la naturaleza de los elementos. Los practicantes del lenguaje a menudo encuentran que hablar en Celestia es una experiencia casi musical.

Vocabulario Basado en la Naturaleza: El léxico de Celestia está estrechamente relacionado con la naturaleza y los elementos. Las palabras a menudo se derivan de nombres de plantas, animales, fenómenos naturales y conceptos cósmicos.

Este lenguaje, Celestia, no solo sirve como una herramienta práctica para la comunicación en la sociedad de Aurantheísmo, sino que también se considera una forma de conexión espiritual con los elementos y el cosmos.

Principios fundamentales:

Adoración de las Sombras Primordiales: Los seguidores del Umbraoscurantismo creen en la existencia de fuerzas oscuras primordiales que existen más allá de la comprensión humana. En lugar de venerar elementos naturales, buscan poder en las sombras y en la oscuridad.

Dominio del Caos: A diferencia del ciclo armonioso del Aurantheísmo, los umbraoscurantistas creen en el poder liberador del caos. Consideran que la anarquía y la desorden son vías hacia la verdadera libertad y el conocimiento.

Templos de la Oscuridad: Los templos umbraoscurantistas son lugares oscuros y misteriosos, con decoraciones que evocan sombras y formas caóticas. Las ceremonias religiosas a menudo se llevan a cabo en la penumbra, y las velas negras son comunes en sus rituales.

Sacerdotes de las Sombras: Los líderes espirituales de esta religión son los Sombrios, sacerdotes que practican artes oscuras y rituales secretos. Cada Sombrio se especializa en el dominio de las sombras y busca expandir su influencia en el mundo.

Sacrificios y Rituales Oscuros: Los seguidores del Umbraoscurantismo realizan sacrificios y rituales oscuros para ganar el favor de las sombras primordiales. Estos rituales a menudo involucran elementos prohibidos y prácticas consideradas tabú por otras religiones.

Códigos de Conducta Caótica: Los umbraoscurantistas siguen códigos de conducta que promueven la libertad individual y el desafío a las normas establecidas. Se valora la transgresión y la búsqueda constante de experiencias prohibidas.

Astrología Caótica: En lugar de seguir un sistema ordenado de astros como en el Aurantheísmo, los umbraoscurantistas interpretan los movimientos celestiales como señales caóticas que indican oportunidades para desafiar el orden establecido.

El Umbraoscurantismo proporciona un contraste oscuro y desafiante con el Aurantheísmo, representando una visión alternativa del mundo basada en el caos y las sombras. Los seguidores buscan liberarse de las restricciones de las estructuras ordenadas y abrazar la oscuridad como fuente de poder y conocimiento.

Discordancia Silábica: Las palabras en Umbréico a menudo tienen una discordancia en la estructura de las sílabas, rompiendo cualquier patrón predecible. Esta característica refleja la creencia en la libertad del caos y la negación de las reglas establecidas.

Infusiones Umbréicas: Al igual que en Celestia, Umbréico también tiene "infusiones", pero estas marcan la conexión de la palabra con las sombras y el caos. Estos marcadores añaden una sensación de oscuridad y misterio al significado de la palabra.

Ritmo Disonante: La pronunciación en Umbréico tiene un ritmo disonante y, a veces, estridente. Las palabras se pronuncian de manera que refleje la tensión y la irregularidad, contribuyendo a la atmósfera caótica del lenguaje.

Flexibilidad Disruptiva: Umbréico es un lenguaje que permite una gran flexibilidad en la construcción de frases, pero esta flexibilidad a menudo se utiliza para romper las expectativas lingüísticas comunes, creando una sensación de disonancia y rebeldía.

Arte de la Negación: La gramática y vocabulario de Umbréico a menudo incluyen expresiones y conceptos que niegan o desafían el significado convencional. Esto refleja la filosofía de los umbraoscurantistas de oponerse a las normas y estructuras establecidas.

Léxico Caótico: El léxico de Umbréico se construye a partir de palabras que evocan el caos, la oscuridad y la rebeldía. Las palabras a menudo son inventadas o modificadas para reflejar la naturaleza disruptiva del lenguaje.

Umbréico no solo sirve como una herramienta de comunicación para los seguidores del Umbraoscurantismo, sino que también se considera una forma de expresión artística que refleja la resistencia y la negación de las normas sociales y espirituales.
