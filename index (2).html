omueve la belleza y la comprensión entre las creaciones de Dios.\nPrincipados\nPrincipiel - Líder de los ángeles protectores de los reinos y naciones.\nNisroc - Defiende las fronteras espirituales y físicas del Primer Reino.\nMehiel - Inspirador de los líderes y gobernantes para que actúen con integridad.\nArcángeles\nMichael - Comandante de las fuerzas celestiales y protector contra el mal.\nRaphael - Sanador y mensajero de la curación y la restauración.\nSelaphiel - Encargado de la oración y la invocación de la luz divina.\nÁngeles\nAriel - Protector de la naturaleza y los animales.\nAzrael - Compañero de las almas al final de sus vidas.\nCassiel - Proveedor de consuelo y guía durante los períodos de soledad.\nSatanás - Originariamente un ángel caído de alto rango, ahora enemigo de Dios.\nen dicha reunion se decidio si crear mas vida y mas reinos debido a que la soledad en el universo, en ese momento estaba vacio, por votos gano la desicion de\nexpandiar los reinos, dando como inico a los 4 reinos del universo.\ntras pasar varios años, Dios habia tomado ideales erroneos, volviendo del universo un mundo de anarquia en el cual solo le importaba a el tener el poder del todo\nRyu al darse cuenta de esto cuestiona a dios, pero este es ignorado por el mismo\n\nRyu:No deberiamos proteger los reinos? no los creamos para eso?\n\nDios: -solo miraria a Ryu con desprecio y lo ignoraria-\n\nRyu: no piensas hacer nada? solo te quedaras ahi parado observando todo? si tu no piensas hacer nada entonces yo lo hare\n\nDios: -se levantaria de su asinto y miraria a Ryu de una forma seria- Chico, ellos no creen nosotros porque deberia yo ayudarlos?\n\nRyu: porque son tu gente, tu los creaste y deberias enseñarles\n\nDios: no me interesa enseñarles siempre y cuando no intenten rebelen ante mi\n\nRyu: entonces solo te quedaras ahi sentado sin hacer nada, mientras se matan?\n\nDios: exactamente, ya estas entendiendo\n\nRyu: yo me largo, si tu no piensas hacer nada entonces yo lo hare y no    "text": "En alguna linea alterna creado tras \"El incidente\". . . .\nCapitulo-5 \"La llegada\"\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\nera un dia normal lleno de luz el sonido del mar los pajaros cantaban era un dia hermoso como cualquier dia normal.\nen un pueblo cercano a bahía de Krest, Russia, se corria el rumor de una criatura mendigar por los bosques, se decia aquella criatura era nueva.\njamas se le habia visto antes mendigar por aquellos bosques, tambien se hacian rumores que en lo profundo del bosque existian entidades magicas, (dragones, hadas, etc)\nnadie se atrevia entrar al bosque, no solo, asta que de la nada. \n\n-un chico aparentemente joven se veia de unos 18 años entro a un bar del pueblo, el chico media 1.62 era pelo castaño y piel casi blanca como la nieve, este entraria al bar para buscar informacion sobre aquella criatura que contaban los lugareños-\n\nmike: -este se acercaria al cantinero comprando un trago y despues preguntarle- oye. . . eh escuchado que hablan de una criatura unica jamas vista antes me gustaria informacion no importa el precio\n\nel cantinero: -este solo se rie del chico para despues verlo y responderle de una forma sarcastica como si lo quisiera humillar- Escuchen todos este chico quiere informacion de la \"criatura\" mistica del bosque\n\n-el bar se llenaria de risas para despues un amargo silencio-\n\nel cantinero: escucha niño el bosque no es para debiluchos como tu regresa a casa no queremos salgas lastimado\n\nmike: -este dejaria pagada la cuenta y se dirigiria a la salida con verguenza al ver todos se burlaron de el-\n\ntras esto no habia percatado la hora que era y que ya era muy noche, las calles de ese pueblo durante las noches solian ser muy solitarias ni un alma salia a esa hora.\n\nmike: -caminaria con el presentimiento de que algo lo acechaba entre las oscuras calles del pueblo en el que se encontraba-\n\nde entre las sobras saldria una figura bastante afeminada la cual llevaba tiempo siguiendo a mike, mike tras ver aquella figura penso era la criatura que decian los lugareños.\neste al no poder ver bien la figura saldria corriendo, esto no serviria de mucho pues aquella figura lo seguiria, tras unos 5 minutos de corres bajo el frio de la nieve este resbalaria ya esperando su final.\n\n???: -aquella figura se detiene frente a el y lo mira-\n\nmike: -asustado sin saber que hacer en el piso se pondria a rezar esperando un milagro-\n\n???: oye tranquilo no soy un moustro para matarte. Escuche buscas a la criatura no es asi? me enojo ver al cantinero que te humillara asi, yo te ayudare me llamo Rize mucho gusto \n-esta le extenderia la mano a mike esperando que le correspondiera-\n\nmike: -al escuchar la voz de rize este se tranquiliza y abre los ojos para darle la mano y levantarse- O-oye Gracias! m-me llamo mike mucho gusto, y si busco a la criatura jaja\n\nrize: -le sonrie a mike- genial! ven vamos a una posada te vas a congelar si te quedas afuera en el camino hablamos de la criatura\n\nmike: -acierta con la cabeza y se sigue a rize-\n\ntras el camino rize casi no hablo mucho fue asta llegar a la posada despues de que mike se cambiara para no morir por congelacion que empezarian a platicar detalladamente\n\nrize: y bien querias saber de el no?\n\nmike: SI! . . . perdone es que lo llevo buscando mucho tiempo. . . usted sabe si es real?\n\nrize: -esta acierta con la mirada- sip es real el se encuentra en lo profundo del bosque. pero casi nadie sobrevive, apenas mi compañero y yo logramos salir con vida de ahi.\n\nmike: recuerdas como era \"eso\"¿? \n\nrize: pues era alto, su creo era cabello era blanco o como un gris muy claro, sus ojos eran negros completamente y parecia salir un liquido negro de ellos tambien no estoy seguro si era una especie de disfras o algo asi pero era completamente negro.\n\nmike: ya veo. . . (si que cambiaste mucho) y recuerdas algo mas¿?\n\nrize: lo ultimo que recuerdo al entrar es que cuando ibamos de salida esa cosa parecia sobre humana definitivamente no es humano o animal es algo mayor a eso\n\nmike: crees mañana me puedas llevar a donde lo viste por ultima ves¿?\n\nrize: claro con mucho gusto, solo debo hacer una llamada y nos vemos mañana a las 12 en la calle ###### vale?\n\nmike:gracias bueno a dormir mañana nos vemos\n\nrize: asta mañana mike que duermas bien\n\nen la mañana rize no estaria en la habitacion habria salido desde mas temprano, seguramente a ver a la llamada que se refirio a mike antes de dormir. . . \n\nmike: -este se despierta mira la hora en un reloj que habia en su habitacion y ve que son las 11:40- (DIOS SE ME HARA TARDE DEBO ESTAR A LAS 12 DONDE AYER RIZE ME MATARA)\n\ntras pensarlo se prepara y saldria a la calle donde acordaron ayer para darse cuenta que llego 10 minutos antes, tras darse cuenta este decide sentarse a esperar, el tiempo pasa dan las 12\na lo lejos se veia dos siluetas ir hacia donde mike\n\nRize: MIKE!!!! -esta le grita a mike a lo lejos junto a alguien mas que no lograba reconocer pero le era familiar a mike-\n\nmike: -este va hacia con ella para quedar frente a frente con la otra persona- hey! h-hola tu eres¿?\n\nrize:oh si lo siento, se me olvido mike el es zukushimo, zukushimo el es mike el que te venia hablando\n\nzukushimo: -este miraria a mike de arriba hacia abajo con una cara de decepcion- Rize te soy honesto no creo dure mucho ahi adentro, miralo \n\nmike: -este se averguenza un poco al verse intimidado-\n\nrize: oye dejalo que tu eras igual hace unos años, bueno mike vamos -esta le da la mano a mike-\n\nmike: -corresponde la mano de rize-\n\ntras agarrar a mike estos 3 se dirigen al bosque donde se vio por ultima ves a la \"criatura\" pero no todo seria color de rosas,pues al llegar la entrada al bosque estaria bloqueada \npor unos cordones de peligro y algunos letreros de no acercarse temporada de osos claramente ignoraron todas las advertencias y entrarian al bosque\ntras un largo rato de caminar zukushimo detendria a rize y mike diciendoles que esten atentos\n\nzukushimo: estamos cerca el olor a sangre y carne podrida aumenta.\n\nzukushimo sigue avanzando pero un toque de sigilo en su caminar rize y mike solo se miran entre si aciertan y siguen los pasos de zukushimo\ntras unas 2 horas de seguir a zukushimo estarian en una parte muy profunda del bosque a lo lejos se veia una vieja y desgastada instalacion\ntotalmente llena de grietas y nieve debido a la tormenta que estaba en aquel momento zukushimo se queda alado de la puerta de la instalacion\nesperando que rize y mike entren primero, al poco tiempo estos entran y detras de ellos entra zukushimo, el lugar era muy oscuro casi no se podia ver nada\nzukushimo saca unas linternas de su mochila y le da una a cada uno el señala las escaleras que bajan al subterraneo\n\nzukushimo: una vez que bajemos no habra vuelta atras estaremos atrapados por esa cosa sera mejor ir con cuidado para evitar bajas.\n\nrize: -ella va delante de todos con un cuchillo que saco del bolsillo y desciende lentamente las escaleras-\n\nen el tunel que baja se podia ver las grietas de que la instalacion lleva años sin mantenimiento conforme van bajando se puede ver arañazos en las paredes del tunel\nal igual que se ve sangre y huesos de antiguos exploradores, a medida que casi llegan al final de la bajada el olor a sangre y carner putrefacta\nse volvia mas fuerte al igual que la cantidad de huesos y pedazos de cuerpos se hacia mas presente, despues de un rato de bajar se ve una luz parpadear\nellos llegan al final de la bajado descubriendo un enorme laboratorio abandonado el musgo y enredaderas al igual que una gran parte ya hacia\ncubierta de tierra por derrumbes del techo hacian que el laboratorio se viera muy descuidado, con fiome se adentraron mas en el encontraron\nvarias capsulas unas en buen estado otras medio dañadas y otras rotas al igual que varias jaulas, jeringas y herramientas de tortura\nlas cuales estaban llenas de sangre seca, decidieron seguir adentrandose en el laboratorio y al poco tiempo encontraron prisiones con numeros romanos en ellas\nescritas,la mayoria de las celdas estaban abiertas dentro de ellas solo habia sangre, ratas y esqueletos humanos y de animales\nla ultima celda llamada \"X\" estaba cerrada y al otro lado de la habitacion se escuchaba ruidos extraños de por debajo de la puerta solo se veia un charco\nde sangre salir de ella, la sangre era fresca se podia escuchar como goteaba, el trio trataria de empujar la puerta pero los intentos fueron inutiles\ndeciden regresar a donde estaban las capsulas antes pero ahora algo estaba fuera de su lugar las capsulas una de las que estaban aun completa\nestaria rota y de ella estaria goteando un liquido extraño, el aire se lleno de una espesa niebla, el ambiente se puso tenso todos sentian que algo los observa desde las sombras\n \nzukushimo: ponganse de espaldas todos nos esta cazando a todos ya sabe que estamos aqui\n\nrize y mike se podrian en contraespalda a zukushimo todos preocupados y tensos por el ambiente, de entre las sombras se veria una figura\nbastante larga midiendo aproximadamente unos 2.10M de altura, la figura era muy delgada pero aun asi el brillo de sus afiladas garras se podia\nver atraves de la espesa niebla, ellos se quedarian viendo a la figura con preocupacion se mirarias despues entre ellos.\n\nzukushimo: debemos separarnos tratar de despitar a la criatura pero debemos tener cuidado no sabemos que tan rapida o letal sea\n\nrize: -esta mira a zukushimo y afirma con la cabeza- la mejor opcion es tratar de despitar a esa cosa como dices y salir de aqui lo mas pronto posible\n\nellos miran a mike y luego se miran entre si\n\nzukushimo: mike tu quedate aqui trata de ocultarte de esa cosa y hagas lo que hagas no vallas tras el\n\nmike: -este suspira y se quedaria escondido atras de uno de las capsulas esperando que zukushimo y rize encuentren la manera de salir de aqui-\n\nla figura veria como cada uno se va por un camino distinto por lo que empezaria a perseguir a zukushimo primero, tras un largo rato de silencio completo\nrize iria para donde fue zukushimo pero esta solo desaparece entre la niebla, mike quien ya se habia dado cuenta que ambos tardaron demasiado \nsaldria de su escondite y iria por donde vio por ultima vez a Rize y Zukushimo, este se adentraria mas en las instalaciones del laboratorio\nhasta encontrar una linterna tirada en el piso.\n\nMike: -toma la linterna y apunta hacia delante viendo si podria ver algo al final de la habitacion- esta espesa niebla no deja ver nada, ademas el lugar es enorme podrian haberse perdido\n\npenso mike pero de la nada algo empezaria a gotear en el hombro de mike, este temblando de miedo y sabiendo que era lo que estaba goteando mira\nhacia arriba, este solo traga saliva y deja salir un suspiro de alivio solo era un grieta que se habia formado hace poco por donde goteaba agua\nmike se levanta de donde estaba y decide adentrarse por el largo pasillo donde habia encontrado la linterna, al poco timepo de estar caminando\nescucharia pisadas cerca de el por lo que este se oculta en un casillero cercano, este trata de mantener su respiracion al ver la criatura \npasar por enfrente de el, en un suspiro de alivio sale del casillero al ver que la criatura se fue y sigue su camino\nllega al final de la habitacion donde se quedaria horrorizado al ver a Rise empalada contra la pared, el pecho lleno de sangre y debajo de ella\nun enorme charco de sangre esta mira a mike con su ultimo alienta y le indica que se acerque\n\nmike: -se acerca con los ojos llorosos- q-que paso? y zukushimo?\n\nrize: -tose un poco de sangre y con lo poco que le queda de vida le dice- se quedo atrapado detras de la celdas entro a una para ocultarse ve y salvalo. . . \n\nrize no sobrevivio a la cazeria y murio frente a mike, este decide ir hacia las celdas donde le dijo rize que zukushimo estaba encerrado\ny tal y como dijo al momento que zukushimo escucho las lagrimas de mike este le grita por ayuda, mike se limpia las lagrimas y junto a zukushimo\nempujarian la puerta hacia adentro para liberarlo de ahi, zukushimo veria la mirada perdida y traumada de mike, a lo que este lo abraza\nbuscando tranquilizarlo.\n\nzukushimo: ella, no lo logro, verdad?\n\nmike: -este rompe en llanto mientras acierta con la cabeza-\n\nzukushimo: ya veo, lo importante es salir de aqui ahora. . . \n\nambos salen de la zona de celdas y se dirigen hacia las escaleras que los trajeron aqui abajo, y justo antes de llegar frente a las escaleras\nestaria la criatura parada mirando fijamente hacia ellos con una sonrisa inhumana totalmente cubierta de sangre y restos humanos.\n\nzukushimo: definitivamente esa cosa no es humana. . ."
  },

   "title": "El encuentro",
   "part": "p2",
   "text": "Continuacion tras \"La llegada\"\nCapitulo-6 \"El encuentro\"\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\nRecordatorio: \"ambos salen de la zona de celdas y se dirigen hacia las escaleras que los trajeron aqui abajo, y justo antes de llegar frente a las escaleras\nestaria la criatura parada mirando fijamente hacia ellos con una sonrisa inhumana totalmente cubierta de sangre y restos humanos.\n\nzukushimo: definitivamente esa cosa no es humana. . . \"\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\n\nZukushimo: Quedate atras mike, no sabemos que es capaz.\n\naquella figura se quedaria totalmente quieta frente a la salida del laboratorio abandonado mirando fijamente a mike con una sonrisa\npeculiar, mike algo asustado se pondria detras de Zukushimo\n\nMike: Esa cosa no deja de mirarme, que es lo que busca.\n\nZukushimo: -voltea a ver a Mike- es claro lo que busca, te busca a ti por alguna razon que aun desconocido\n\nMike: Espera me busca a mi? por que? no tiene sentido alguno\n\nZukushimo: si algo aprendi es que nada en este universo tiene sentido, tal vez el te conoce? no lo se, pero debera pasar sobre mi\nsi es que te quiere matar\n\nla figura que hacia inmovil empezaria a moverse hacia ellos arrastrando las alargadas garras por las paredes sacar chispas de ellas"
  },
  {
   "id": "c10",
   "n": 10,
   "title": "El Enfrentamiento",
   "part": "p3",
   "text": "Capítulo 10: El Enfrentamiento\n\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-\n\nEn un mundo que había perdido su color bajo la sombra de la destrucción, la Ciudad del Horizonte se alzaba como un monumento a la decadencia. \nLas calles, una vez bulliciosas, ahora estaban desiertas, resonando solo con el eco de una tensión que crecía a cada segundo. \nLas nubes densas se arremolinaban en el cielo, formando un vórtice ominoso que presagiaba el choque inminente de dos poderes inconmensurables.\nZero caminaba entre las ruinas, su figura envolviéndose en una luz dorada que contrarrestaba la oscuridad creciente. \nCon cada paso, la gravedad parecía cambiar, como si el mundo mismo se inclinara ante su presencia. Pero en su rostro no había arrogancia, \nsino una mezcla de tristeza y resolución. Sus pensamientos eran un torbellino de recuerdos: las risas compartidas, las noches de promesas, \ny finalmente, el día en que todo se desmoronó. Este no era solo un enfrentamiento entre dos titanes; \nera la culminación de una historia de amor que se había torcido hasta convertirse en tragedia.\nA lo lejos, una risa fría rompió el silencio, resonando como un cuchillo que cortaba la calma antes de la tormenta. \nZwitt emergió de las sombras, su figura envuelta en un aura de oscuridad pura, con el monstruo legendario \nMazikar flotando detrás de él. Sus ojos, antaño cálidos y llenos de amor, ahora eran pozos de malevolencia, un reflejo del caos que había abrazado.\n\"Zero... nunca pensé que llegaríamos a esto,\" dijo Zwitt, con una voz que vibraba entre la nostalgia y el odio. \n\"¿Todavía crees que puedes salvar este mundo con tu luz? Este mundo está podrido, y tú, más que nadie, deberías saberlo.\"\nZero se detuvo, su mirada fija en Zwitt. Un destello cruzó sus ojos, y en un instante, \nla katana del clan Lost Night apareció en su mano, irradiando una luz cegadora que contrastaba con la oscuridad que emanaba de Zwitt. \"Zwitt,\" \nsu voz era firme, aunque teñida de dolor, \"no deseo hacerte daño... pero no puedo permitir que destruyas todo lo que juré proteger.\"\nLa tensión en el aire era palpable, el mundo mismo parecía contener el aliento. Y entonces, \nen un abrir y cerrar de ojos, Zwitt desató su ataque. Con un movimiento apenas perceptible, \nlanzó su técnica de corte maldito, una ráfaga de tajos invisibles que rasgaban el aire, \napuntando directamente a Zero. Pero antes de que los cortes pudieran alcanzarlo, \nla katana de Zero se movió en un arco perfecto, interceptando los ataques y desintegrándolos en chispas que iluminaban la oscura ciudad.\nMazikar rugió desde lo alto, descendiendo en picado con una furia descomunal, \nsus garras rodeadas de energía maldita. Pero se encontró de frente con una barrera invisible que lo detuvo en seco. \nZero había desplegado su técnica del Infinito, un campo que negaba cualquier ataque al detenerlo en una distancia infinita de su cuerpo. \nEl monstruo retrocedió, furioso, pero la barrera se mantuvo firme, impenetrable.\nZwitt sonrió con amargura, una sombra de lo que solía ser. \"¿Recuerdas cuando solíamos entrenar juntos? Siempre te admiré, Zero. Pero ahora, \nese poder que tanto respetaba es lo que debo destruir.\" Su voz, aunque llena de determinación, cargaba el peso de su antigua vida, \nde lo que había dejado atrás.\nSin previo aviso, Zwitt desapareció en un destello de velocidad, reapareciendo justo frente a Zero, \nlanzando una serie de cortes que desafiaban la lógica y el espacio. Pero Zero, con una calma inhumana, interceptó cada golpe, \nsu katana moviéndose como un rayo de luz en la oscuridad.\nEl suelo se quebró bajo sus pies, las estructuras colapsaron a su alrededor, y la ciudad, ya herida, \ncomenzó a desmoronarse bajo la presión de sus poderes. Zero retrocedió, parando un ataque tras otro, \nmientras Zwitt continuaba su embestida con una intensidad que solo podía nacer del dolor y la furia acumulada.\nMazikar, viendo la oportunidad, lanzó un ataque devastador, su cuerpo mutando y adaptándose para romper la barrera de Zero. \nLa criatura maldita, ahora con una fuerza multiplicada, golpeó la defensa de Zero con una energía que distorsionaba el espacio a su alrededor, \ncreando grietas en la barrera del Infinito.\n\"¡Mazikar, destrúyelo!\" gritó Zwitt, canalizando su propio poder en el monstruo. \nLa entidad evolucionó una vez más, su cuerpo se expandió, su aura se intensificó, \nhasta convertirse en una abominación imposible de describir con palabras. Un ser que podía destrozar montañas con solo existir.\nZero, consciente del peligro, supo que debía actuar rápidamente. Con un suspiro profundo, \ncerró los ojos y concentró toda su energía en su katana. La luz que emitía comenzó a intensificarse, \ncada vez más brillante, hasta que se convirtió en un faro que iluminó toda la ciudad. El Infinito comenzó a contraerse, \nenvolviéndolo en una singularidad de energía pura, un punto donde todo el poder se concentraba.\nZwitt observó, y por primera vez en mucho tiempo, sintió algo que creía haber olvidado: temor. \n\"No... no puede ser...\" murmuró, mientras Mazikar, en su forma final, se lanzaba hacia Zero con un rugido que sacudió el mund\nEl choque fue apocalíptico. La luz y la oscuridad colisionaron en una explosión de energía que rasgó el cielo, \npartiendo la tierra y disolviendo todo a su alrededor en un remolino de pura fuerza. \nEl mundo mismo parecía a punto de desintegrarse bajo la presión de sus poderes combinados. El sonido de la batalla se silenció, \ncomo si el universo contuviera la respiración en espera del resultado.\nCuando el polvo y la luz finalmente se disiparon, todo lo que quedó fue un silencio ensordecedor. \nEl vasto cráter que reemplazaba a la Ciudad del Horizonte era el único testigo de la batalla épica que había tenido lugar. \nZero se mantenía en pie, su katana brillando débilmente mientras el viento barría los restos de la devastación. A sus pies, \ndonde antes estaban Zwitt y Mazikar, no quedaba nada, solo cenizas y el eco de un nombre susurrado por el viento.\nZero miró el horizonte, sus ojos reflejando el vacío de lo que acababa de perder. En su corazón, la victoria se sentía vacía, \nteñida de la melancolía de un amor que no pudo salvar. Sin embargo, sabía que mientras él siguiera de pie, la luz no se extinguiría. \nCon un último vistazo al horizonte, Zero dio un paso adelante y desapareció en un destello, dejando tras de sí solo una leyenda.\n Una historia que sería contada como un recordatorio del día en que la luz y la oscuridad, una vez unidas por amor, \n colisionaron en una batalla que sacudió los cimientos del mundo.\n-<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>--<>-"
  },

   "title": "El último aliento",
   "part": "p4",
   "text": "---\n\nEl comienzo de la nueva aventura: \"El arcoíris después de la tormenta\"\nCapítulo 16: \"El último aliento\"\n\n---\n\nBajo la sombra de un árbol, con la lluvia de fondo, yacía aquel hombre que lo dio todo por su familia, su clan, sus amigos, \nsus reclutas y, sobre todo, por el bien de todos. Ahí, bajo aquella sombra, se encontraba Zero al borde de la muerte, \nlleno de heridas y desangrándose. A cada momento veía a Sage y Zwitt con una sonrisa, aun sabiendo que sería la última vez que los vería.\n Con su último aliento, les pidió que se acercaran.\n\nZwitt y Sage tenían el rostro lleno de tristeza y horror, pero aun así dieron un paso al frente. \nZero le pidió a Sage que se acercara primero. Este lo hizo, con la lluvia de fondo y las lágrimas cayendo del rostro de ambos. \nZero lo miró y le dijo:\n\n—Sage, vive con orgullo y la frente en alto. Si te ves abatido por tu debilidad y tus miedos, llena de coraje tu corazón. \nÁrmate de valentía y continúa tu camino. Aun si te detienes y te acobardas, no detendrás el flujo del tiempo. \nQue el hecho de que estemos llegando a nuestro final no sea la causa de tu tristeza. Tú puedes, Sage, no te rindas, no mires atrás. \nCreo en ti. Yo cumplí mi deber como líder, no dejé que nadie muriera. Fue un honor ser tu maestro. Hasta luego, alumno mío...\n\nSage se alejó tras las palabras de Zero, desgarrado por no poder hacer nada para ayudarlo. Al final, no pudo hacer nada para salvar a \nZero. Zwitt se acercó a Zero, todavía llorando por lo sucedido y por no poder ayudarlo. Una vez estuvieron frente a frente, \nZero tomó la mano de Zwitt y lo miró a los ojos.\n\n—Sabes, no estoy enojado contigo. No fue tu culpa; yo debí haberte protegido de aquel espíritu, pero preferí huir. Es irónico, ¿no? \n—Zero tosió un poco de sangre y volvió a sonreír—. ¿Cómo terminé siendo yo uno de ellos ahora, con mi muerte? Perdóname, Zwitt. \nTe fallé. Debí haberte ayudado y no abandonarte. Lo siento mucho... Por favor, cuida de todos. No los dejes ser guiados por el mal. \nY cuando Sage esté listo, dale mi mando y mi katana. Tiene el potencial, solo le falta entrenamiento. Perdón por... \nno ser la mejor pareja, ni la más atenta. Te amo... —La mano de Zero dejó la de Zwitt.\n\nZwitt se alejó del área, aún sin poder creer que aquel chico que se creía inmortal y que era considerado el más fuerte había muerto. \nSalvó a todos, sí, pero ¿a qué costo? ¿Valió la pena sacrificar su vida por la de todos? \nEsas y más preguntas rondaban en la mente de Zwitt y Sage.\n\nCon el pasar de los años, el cuerpo de Zero se unió con la naturaleza, dando lugar a un árbol de sakura. \nEn cuanto a Sage, logró su objetivo y se convirtió en el líder de los cazadores. Zwitt no se vio más. Todo estuvo en paz durante mucho, \nmucho tiempo. El clan Lost Night se separó, el mundo espiritual regresó a su plano existencial, los demonios volvieron al infierno, \ny los ángeles regresaron al cielo para cuidar del mundo. Aquel día, ese viernes 31 de diciembre a las 11:49, \nmarcó el inicio y el final de una era.\n\nAquel día perdieron más de lo que ganaron. Lograron la paz entre los Cruatro reinos, pero ¿a qué costo? Zero, siempre te recordaremos. \nA pesar de tu inicio, ojalá encuentres la paz en el más allá. 💖\n\n---"
  }
 ],

<script id="lore" type="text/plain">caracteristicas de la Linea alterna D-345
religion dominante de la realidad

Nombre de la religión: Aurantheísmo

Principios fundamentales:

Adoración de los Elementos: Los seguidores del Aurantheísmo creen en la existencia de cuatro elementos primordiales que forman la base de toda creación: tierra, agua, fuego y aire. Cada elemento representa una fuerza divina única y poderosa.

Ciclo de Renacimiento: La religión enseña que la vida es un ciclo eterno de muerte y renacimiento. Después de la muerte, el alma viaja a través de los reinos de los elementos, experimentando purificación y renovación antes de renacer en el mundo mortal.

Templos Elementales: Los templos del Aurantheísmo están dedicados a cada uno de los elementos. Cada templo es construido de manera que refleje y honre al elemento al que está dedicado. Los rituales y ceremonias se realizan en función de la conexión con el elemento respectivo.

Sacerdotes Elementalistas: Los líderes espirituales de la religión son los Elementalistas, sacerdotes que han demostrado una afinidad especial con uno de los elementos. Cada uno de ellos dirige un templo elemental y guía a los fieles en la comprensión y veneración de su elemento específico.

Ofrendas y Rituales: Los seguidores del Aurantheísmo realizan ofrendas regulares a los elementos, expresando gratitud y buscando su favor. Los rituales incluyen danzas, cánticos y ceremonias que simbolizan la armonía entre los elementos.

Códigos de Conducta Elemental: Se espera que los seguidores del Aurantheísmo vivan de acuerdo con los códigos de conducta específicos asociados con cada elemento. Por ejemplo, la lealtad y la determinación son virtudes para aquellos que siguen el camino del fuego, mientras que la paciencia y la adaptabilidad son fundamentales para los devotos del agua.

Astrología Elemental: La religión también abraza la astrología elemental, creyendo que la posición y movimiento de los astros influyen en la energía de los elementos en la tierra. Los sacerdotes Elementalistas son responsables de interpretar estos signos y aconsejar a la comunidad sobre cómo armonizarse con las fuerzas cósmicas.

El Aurantheísmo proporciona un marco espiritual y cultural para la sociedad de la Edad Antigua, influyendo en la forma en que las personas interactúan con la naturaleza, entre sí y con el mundo espiritual que creen que los rodea.

las notas encontradas en minas de la zona se desconoce el lenguaje aun no se sabe que dice o si alguien sabe de este lenguaje extraño los lugareños dicen jamas antes a ver visto dicho lenguaje

Nombre del lenguaje: Celestia

Características principales:

Alfabeto Celestiano: Celestia utiliza un alfabeto único compuesto por símbolos estilizados que representan los elementos naturales y cósmicos fundamentales. Cada símbolo tiene una conexión simbólica con la filosofía del Aurantheísmo.

Armonía Silábica: Las palabras en Celestia se construyen mediante una combinación de sílabas armoniosas que reflejan la creencia en la armonía entre los elementos. Las sílabas fluyen suavemente, imitando los ciclos naturales y ritmos celestiales.

Infusiones Elementales: Algunas palabras en Celestia llevan consigo "infusiones elementales", son pequeñas marcas o acentos que indican la conexión de la palabra con uno de los elementos. Estas infusiones añaden un matiz de significado relacionado con el elemento correspondiente.

Flexibilidad Poética: Celestia es un lenguaje flexible y poético. Los versos y las canciones son una parte integral de la expresión lingüística, y muchos textos religiosos y ceremonias rituales se llevan a cabo en forma de poesía.

Construcción Simbólica de Frases: La estructura de las frases en Celestia a menudo refleja la estructura de los rituales y la adoración en el Aurantheísmo. Las oraciones están diseñadas para evocar imágenes visuales y conceptos espirituales.

Ritmo Melódico: La pronunciación de Celestia tiene un ritmo melódico, y la entonación de las palabras a menudo se ajusta para imitar la naturaleza de los elementos. Los practicantes del lenguaje a menudo encuentran que hablar en Celestia es una experiencia casi musical.

Vocabulario Basado en la Naturaleza: El léxico de Celestia está estrechamente relacionado con la naturaleza y los elementos. Las palabras a menudo se derivan de nombres de plantas, animales, fenómenos naturales y conceptos cósmicos.

Este lenguaje, Celestia, no solo sirve como una herramienta práctica para la comunicación en la sociedad de Aurantheísmo, sino que también se considera una forma de conexión espiritual con los elementos y el cosmos.

otro dato se tiene es que existe otra religion tambien conocida como Umbraoscurantismo

Principios fundamentales:

Adoración de las Sombras Primordiales: Los seguidores del Umbraoscurantismo creen en la existencia de fuerzas oscuras primordiales que existen más allá de la comprensión humana. En lugar de venerar elementos naturales, buscan poder en las sombras y en la oscuridad.

Dominio del Caos: A diferencia del ciclo armonioso del Aurantheísmo, los umbraoscurantistas creen en el poder liberador del caos. Consideran que la anarquía y la desorden son vías hacia la verdadera libertad y el conocimiento.

Templos de la Oscuridad: Los templos umbraoscurantistas son lugares oscuros y misteriosos, con decoraciones que evocan sombras y formas caóticas. Las ceremonias religiosas a menudo se llevan a cabo en la penumbra, y las velas negras son comunes en sus rituales.

Sacerdotes de las Sombras: Los líderes espirituales de esta religión son los Sombrios, sacerdotes que practican artes oscuras y rituales secretos. Cada Sombrio se especializa en el dominio de las sombras y busca expandir su influencia en el mundo.

Sacrificios y Rituales Oscuros: Los seguidores del Umbraoscurantismo realizan sacrificios y rituales oscuros para ganar el favor de las sombras primordiales. Estos rituales a menudo involucran elementos prohibidos y prácticas consideradas tabú por otras religiones.

Códigos de Conducta Caótica: Los umbraoscurantistas siguen códigos de conducta que promueven la libertad individual y el desafío a las normas establecidas. Se valora la transgresión y la búsqueda constante de experiencias prohibidas.

Astrología Caótica: En lugar de seguir un sistema ordenado de astros como en el Aurantheísmo, los umbraoscurantistas interpretan los movimientos celestiales como señales caóticas que indican oportunidades para desafiar el orden establecido.

El Umbraoscurantismo proporciona un contraste oscuro y desafiante con el Aurantheísmo, representando una visión alternativa del mundo basada en el caos y las sombras. Los seguidores buscan liberarse de las restricciones de las estructuras ordenadas y abrazar la oscuridad como fuente de poder y conocimiento.

estos tambien tienen su propio lenguaje que es el Umbréico

Alfabeto Umbréico: Umbréico utiliza un alfabeto encriptado de símbolos oscuros que representan las sombras y formas caóticas. Cada símbolo tiene una apariencia intrincada y evoca una sensación de misterio.

Discordancia Silábica: Las palabras en Umbréico a menudo tienen una discordancia en la estructura de las sílabas, rompiendo cualquier patrón predecible. Esta característica refleja la creencia en la libertad del caos y la negación de las reglas establecidas.

Infusiones Umbréicas: Al igual que en Celestia, Umbréico también tiene "infusiones", pero estas marcan la conexión de la palabra con las sombras y el caos. Estos marcadores añaden una sensación de oscuridad y misterio al significado de la palabra.

Ritmo Disonante: La pronunciación en Umbréico tiene un ritmo disonante y, a veces, estridente. Las palabras se pronuncian de manera que refleje la tensión y la irregularidad, contribuyendo a la atmósfera caótica del lenguaje.

Flexibilidad Disruptiva: Umbréico es un lenguaje que permite una gran flexibilidad en la construcción de frases, pero esta flexibilidad a menudo se utiliza para romper las expectativas lingüísticas comunes, creando una sensación de disonancia y rebeldía.

Arte de la Negación: La gramática y vocabulario de Umbréico a menudo incluyen expresiones y conceptos que niegan o desafían el significado convencional. Esto refleja la filosofía de los umbraoscurantistas de oponerse a las normas y estructuras establecidas.

Léxico Caótico: El léxico de Umbréico se construye a partir de palabras que evocan el caos, la oscuridad y la rebeldía. Las palabras a menudo son inventadas o modificadas para reflejar la naturaleza disruptiva del lenguaje.

Umbréico no solo sirve como una herramienta de comunicación para los seguidores del Umbraoscurantismo, sino que también se considera una forma de expresión artística que refleja la resistencia y la negación de las normas sociales y espirituales.

/* Publicación a GitHub (actualiza index.html) y sincronización automática */
let LASTDB=window.__DBT;
const GF={cre:'creatures',dims:'dims',obj:'objects',wpn:'weapons',inf:'infections',zv:'variants'};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const GHC=()=>{try{return JSON.parse(localStorage.getItem('acd_gh'))||{}}catch(e){return{}}};
const DBRE=/(<script id="db" type="application\/json">)([\s\S]*?)(<\/script>)/;

async function sync(){
  try{
    const h=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.text());
    const m=h.match(DBRE);if(!m||m[2]===LASTDB)return;
    LASTDB=m[2];window.__DBT=m[2];
    let draft=null;try{draft=role==='admin'&&localStorage.getItem('acd_draft')}catch(e){}
    if(draft)return;
    DB=JSON.parse(m[2]);
    if(role){toast('ARCHIVOS ACTUALIZADOS');if(['t','p','b','d','o','w'].includes(CUR)&&!document.querySelector('#view .dos'))show(CUR)}
  }catch(e){}
}
setInterval(sync,60000);

const GH=c=>({Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'});
const GU=(c,p)=>`https://api.github.com/repos/${c.o}/${c.r}/contents/${p}`;
async function ghPut(c,path,content,msg,sha){
  if(sha==null){const g=await fetch(GU(c,path)+'?ref='+encodeURIComponent(c.b),{headers:GH(c)});if(g.ok)sha=(await g.json()).sha}
  const r=await fetch(GU(c,path),{method:'PUT',headers:GH(c),body:JSON.stringify({message:msg,content,branch:c.b,sha})});
  if(!r.ok)throw new Error(path+' → error '+r.status)
}
async function publish(log){
  const c=GHC();if(!c.o||!c.r||!c.t)throw new Error('Faltan los ajustes de GitHub');
  c.b=c.b||'main';const file=c.f||'index.html';
  const out=JSON.parse(JSON.stringify(DB));delete out.om5;
  for(const k in GF){for(const it of out[k]||[]){
    if(it.img&&it.img.startsWith('data:')){
      const p=`assets/img/${GF[k]}/${it.id.replace(/[^A-Za-z0-9_-]/g,'_')}.jpg`;
      log('subiendo '+p);await ghPut(c,p,it.img.split(',')[1],'imagen '+it.id);it.img=p}}}
  log('leyendo '+file);
  const meta=await fetch(GU(c,file)+'?ref='+encodeURIComponent(c.b),{headers:GH(c)});
  if(!meta.ok)throw new Error(file+' → error '+meta.status+' (revisa usuario, repositorio, rama y token)');
  const sha=(await meta.json()).sha;
  const src=await fetch(GU(c,file)+'?ref='+encodeURIComponent(c.b),{headers:{...GH(c),Accept:'application/vnd.github.raw+json'}}).then(r=>r.text());
  if(!DBRE.test(src))throw new Error('No encontré el bloque de datos en '+file);
  const json=JSON.stringify(out,null,1).replace(/<\//g,'<\\/');
  log('subiendo '+file);
  await ghPut(c,file,b64(src.replace(DBRE,(a,p,x,s)=>p+json+s)),'actualizar contenido',sha);
  try{localStorage.removeItem('acd_draft')}catch(e){}
}
function publicar(){
  if(role!=='admin')return;const c=GHC();
  V(`<h2 class='gl' data-t='PUBLICAR' style='font-size:42px'>PUBLICAR</h2>
<p style='color:var(--gd);max-width:70ch'>Sube tus cambios a GitHub. Se actualiza el archivo index.html del repositorio y todos los visitantes lo ven cuando GitHub Pages termina de publicar (cerca de 1 minuto). El sitio se refresca solo cada 60 segundos.</p>
<div class='panel'><div class='row'><div><label>USUARIO U ORGANIZACIÓN</label><input id='gu' value='${esc(c.o||'')}'></div><div><label>REPOSITORIO</label><input id='gr' value='${esc(c.r||'')}'></div><div><label>RAMA</label><input id='gb' value='${esc(c.b||'main')}'></div><div><label>ARCHIVO</label><input id='gf' value='${esc(c.f||'index.html')}'></div></div>
<label>TOKEN DE GITHUB (permiso Contents: lectura y escritura, solo este repositorio)</label><input id='gt' type='password' value='${esc(c.t||'')}'>
<p style='color:var(--gd);font-size:13px'>El token se guarda solo en este navegador. No lo compartas.</p><button id='gs'>GUARDAR AJUSTES</button></div>
<div class='panel'><div class='row'><button id='gp'>PUBLICAR CAMBIOS</button><button id='gx'>COPIA DE SEGURIDAD (JSON)</button><button id='gd' class='danger'>DESCARTAR BORRADOR</button></div><div id='gl' style='white-space:pre-wrap;margin-top:12px;color:var(--gd)'></div></div>`);
  const L=t=>{$('#gl').textContent+=t+'\n'};
  $('#gs').onclick=()=>{try{localStorage.setItem('acd_gh',JSON.stringify({o:$('#gu').value.trim(),r:$('#gr').value.trim(),b:$('#gb').value.trim()||'main',f:$('#gf').value.trim()||'index.html',t:$('#gt').value.trim()}))}catch(e){}$('#gs').textContent='GUARDADO'};
  $('#gp').onclick=async()=>{$('#gs').click();$('#gl').textContent='';try{await publish(L);L('LISTO. GitHub Pages tardará cerca de 1 minuto en mostrar los cambios.')}catch(e){L('ERROR: '+e.message)}};
  $('#gx').onclick=()=>{const o=JSON.parse(JSON.stringify(DB));delete o.om5;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='copia-acd.json';a.click()};
  $('#gd').onclick=()=>{if(confirm('¿Descartar el borrador local y volver al contenido publicado?')){try{localStorage.removeItem('acd_draft')}catch(e){}DB=JSON.parse(window.__DBT);L('Borrador descartado.')}};
